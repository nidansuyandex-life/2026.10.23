name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发版需要：创建 Release 与 tag
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # —— 安装 Android SDK ——
    # ubuntu-latest runner 默认没有 Android SDK，必须显式安装，否则
    # assembleDebug/assembleRelease 会因找不到 SDK（compileSdk 34 / build-tools）而失败。
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK packages & accept licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"

    # 仓库已提交标准 Gradle Wrapper（固定 Gradle 8.5），正常情况下这一步什么都不做。
    # 仅在 wrapper 文件缺失时兜底生成；必须带 --no-validate-url：
    # runner 预装的 Gradle 9.x 在 wrapper 任务里会对 distributionUrl 发 HEAD 校验，
    # 在 CI 网络下常误报 "Test of distribution url ... failed"。
    - name: Generate Gradle wrapper (fallback)
      run: |
        if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
          gradle :wrapper --gradle-version 8.5 --distribution-type bin --no-validate-url
        fi

    - name: Grant execute permission
      run: chmod +x ./gradlew

    - name: Gradle version
      run: ./gradlew --version

    - name: Verify assets (static regression)
      run: python3 ci/verify.py

    - name: Build Debug + Release APK
      run: >
        ./gradlew assembleDebug assembleRelease
        -PappVersionCode=${{ github.run_number }}
        -PappVersionName=1.0.${{ github.run_number }}
        --stacktrace

    # —— 可选：用你自己的生产密钥重签（默认不启用）。
    #   在仓库 Settings → Secrets and variables → Actions 里添加：
    #     SIGNING_KEY        用 openssl base64 < your.keystore | tr -d '\n' 生成
    #     KEY_ALIAS          密钥别名
    #     KEY_STORE_PASSWORD 密钥库密码
    #     KEY_PASSWORD       密钥密码
    #   不填则直接用 Gradle 已用仓库内 debug.keystore 签好的 app-release.apk。
    - name: Sign Release APK (optional, only if SIGNING_KEY secret set)
      if: ${{ secrets.SIGNING_KEY != '' }}
      uses: r0adkll/sign-android-release@v1
      id: sign_release
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Pick release APK to publish
      id: pick
      run: |
        if [ -n "$SIGNING_KEY" ]; then
          echo "apk=${{ steps.sign_release.outputs.signedReleaseFile }}" >> "$GITHUB_OUTPUT"
        else
          echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
        fi
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: ${{ steps.pick.outputs.apk }}

    # —— 发版：每次 push 到 main/master 自动建一个 Release，
    #    把已签名的 release APK 和 debug APK 挂上去，直接拿到安装链接。
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push'
      with:
        tag_name: v${{ github.run_number }}
        name: 健康生活 v1.0.${{ github.run_number }}
        body: |
          自动构建 · 提交 ${{ github.sha }}
          - app-release.apk：已签名，可直接安装
          - app-debug.apk：调试包
        files: |
          ${{ steps.pick.outputs.apk }}
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
