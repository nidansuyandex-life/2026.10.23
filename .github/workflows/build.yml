name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android SDK licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # 仓库已提交标准 Gradle Wrapper（固定 Gradle 8.5），正常情况下这一步什么都不做。
    # 仅在 wrapper 文件缺失时兜底生成；必须带 --no-validate-url：
    # runner 预装的 Gradle 9.x 在 wrapper 任务里会对 distributionUrl 发 HEAD 校验，
    # 在 CI 网络下常误报 "Test of distribution url ... failed"。
    - name: Generate Gradle wrapper (fallback)
      run: |
        if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
          gradle :wrapper --gradle-version 8.5 --distribution-type bin --no-validate-url
        fi

    - name: Grant execute permission
      run: chmod +x ./gradlew

    - name: Gradle version
      run: ./gradlew --version

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
