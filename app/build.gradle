plugins {
    id 'com.android.application'
}

def appVc = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVn = (project.findProperty('appVersionName') ?: '1.0').toString()

android {
    namespace 'com.daily.healthlife'
    compileSdk 34

    /* P57：AGP 8.x 默认关闭 BuildConfig 生成，defaultConfig 里用到
       buildConfigField 必须显式开启，否则配置阶段直接失败。 */
    buildFeatures {
        buildConfig true
    }

    /* P55：本地与 CI 共用同一份 keystore。
       以前 runner 每次新建 debug.keystore，导致新 APK 签名不同、无法覆盖安装。 */
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.daily.healthlife"
        minSdk 24
        targetSdk 34
        versionCode appVc
        versionName appVn
        buildConfigField "String", "BUILD_AT", "\"" + new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm').format(new Date()) + "\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            /* 不开混淆：JS 桥方法名 / 反射调用被裁掉会导致 TTS、图片、通知失效 */
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'

    // ★ 新增：WebSocket 客户端（用于讯飞 IAT）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 讯飞 SDK（可选，不用可以删）
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
}