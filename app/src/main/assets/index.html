async function handleV3Action(act, t, e){
  if (await handleToolsAction(act, t, e)) return true;
  if (await handleCompanionAction(act, t, e)) return true;
  if (act === 'thinkTemplate' || act === 'thinkExample'){
    const name = t.dataset.name;
    const m = (SEED.THINKING||[]).find(x => x.name === name);
    let ta = null;
    document.querySelectorAll('[data-think-ans]').forEach(n => { if (n.dataset.thinkAns === name) ta = n; });
    if (ta && m){
      const how = m.how || [];
      ta.value = act === 'thinkTemplate'
        ? ('今天遇到的一件小事：\n（写一句真实发生的事，比如「同事又催我改方案」）\n\n① ' + (how[0]||'先看事实') + ' → 我看到：\n\n② ' + (how[1]||'再找原因') + ' → 我想到：\n\n③ ' + (how[2]||'最后定动作') + ' → 所以我会：\n')
        : ('今天遇到的一件小事：同事又在群里催进度，我差点直接回「马上就好」。\n\n① ' + (how[0]||'先看事实') + ' → 我看到：其实缺的是最终验收标准，不是我做得慢。\n\n② ' + (how[1]||'再找原因') + ' → 我想到：每次都先答应再返工，是因为一开始没对齐标准。\n\n③ ' + (how[2]||'最后定动作') + ' → 所以我会：先问清「按哪版标准验收」，再给出时间。\n\n（这里用到的思路：' + (m.hint||m.core||'') + '）');
      try { ta.dispatchEvent(new Event('input', { bubbles:true })); } catch(er){ LearnStore.setThinkAns(name, ta.value); }
      try { ta.focus(); } catch(er){}
      toast(act === 'thinkTemplate' ? '模板已填好，改几个字就行' : '已放入例子，改成你自己的事吧');
    }
    return true;
  }
  if (act === 'markProductOpened'){
    const id = t.dataset.id, lib = getProductLibrary();
    const p = lib.find(x => x.id === id);
    if (p){ p.openedDate = todayStr(); if (!p.shelfLifeMonths) p.shelfLifeMonths = 6; saveProductLibrary(lib); state.prodLibFilter = 'opened'; LS.set('app-prod-lib-filter','opened'); toast('✓ 已开封，已自动切到「已开封」列表'); render({ keepScroll:true }); }
    return true;
  }
  if (act === 'clearAISettings'){
    if (!confirm('清空全部 AI 设置？\n服务商、主 API Key、备用 Key 和记住的模型都会被清除。')) return true;
    ['ai-provider','ai-key','ai-model','ai-vision-model','ai-keys','ai-last-good','ai-last-used'].forEach(k => { try { LS.del(k); } catch(er){} });
    try { Object.keys(localStorage).filter(k => k.indexOf('ai-model-pref:') === 0).forEach(k => localStorage.removeItem(k)); } catch(er){}
    try { openSheet(settingsSheet('ai')); } catch(er){}
    const st = document.getElementById('aiTestStatus');
    if (st){ st.style.display='block'; st.style.background='#E3F8F1'; st.style.color='#2DBE98'; st.textContent='✓ 已清除全部 AI 设置，现在可以直接粘贴新的 API Key（备用 Key 也一起清空了）。'; }
    toast('已清除 AI 设置'); render({ keepScroll:true }); return true;
  }
  if (act === 'openSearch'){ openSearchSheet(); return true; }
  if (act === 'searchJump'){ searchJump(t.dataset.kind, t.dataset.q); return true; }
  if (act === 'openAppLock'){ openSheet(appLockSheetHTML()); return true; }
  if (act === 'saveAppLockPin'){
    const el = document.getElementById('newLockPin'); const v = el ? String(el.value||'').trim() : '';
    if (!/^\d{4}$/.test(v)){ toast('请输入 4 位数字'); return true; }
    LS.set('app_lock_pin', pinHash(v)); LS.set('app_lock_on', true);
    toast('应用锁已开启 🔒'); closeSheet(); render(); return true;
  }
  if (act === 'offAppLock'){ LS.set('app_lock_on', false); toast('应用锁已关闭'); closeSheet(); render(); return true; }
  if (act === 'openSettings'){
    const sec = t.dataset.sec || '';
    state.settingsSec = sec || null;
    openSheet(sec ? settingsSheet(sec) : settingsMenu());
    return true;
  }
  if (act === 'setCfg'){
    const f = t.dataset.field; let v = t.dataset.val;
    if (f === 'walkOn' || f === 'autoBackup' || f === 'eveningOn') v = (v === '1');
    else if (f === 'walkFreq' || f === 'fontScale') v = Number(v);
    saveSettings({ [f]: v });
    openSheet(settingsSheet(state.settingsSec || 'walk'));
    if (f === 'walkOn' || f === 'walkFreq' || f === 'walkStart' || f === 'walkEnd'){ try { initWalkReminder(); } catch(err){} }
    if (f === 'eveningOn' || f === 'eveningTime'){ try { syncEveningToNative(); syncEveningBrief(); } catch(err){} }
    return true;
  }
  if (act === 'backupNow'){ const ok = AutoBackup.run(true); toast(ok ? (AutoBackup.nativeOk() ? '已备份为文件' : '已备份') : '备份失败，空间可能不足'); if (state.settingsSec) openSheet(settingsSheet(state.settingsSec)); return true; }
  if (act === 'restoreBackup'){
    const i = Number(t.dataset.i);

    } catch(err){ toast('恢复失败：' + err.message); }

    return true;
  }

    if (idx >= 0) done.splice(idx, 1); else done.push(k);
    LS.set('skin-done:' + todayStr(), done);

    return true;
  }
  if (act === 'addPR'){
    const raw = prompt('格式：动作 重量\n例如：深蹲 60');
    if (!raw) return true;
    const m = raw.trim().match(/^(.+?)\s+([\d.]+)\s*(?:kg)?$/i);
    if (!m){ toast('格式不对，试试「深蹲 60」'); return true; }
    const prs = getPRs();
    const name = m[1].trim();
    const weight = Number(m[2]);
    const ex = prs.find(p => p.name === name);
    if (ex){ if (weight > Number(ex.weight)){ ex.weight = weight; ex.date = todayStr(); toast('刷新 PR：' + name + ' ' + weight + 'kg'); } else { toast('当前 PR 已经是 ' + ex.weight + 'kg'); return true; } }
    else prs.push({ name, weight, date: todayStr() });
    savePRs(prs);
    render({ keepScroll: true });
    return true;
  }
  if (act === 'delPR'){
    const i = Number(t.dataset.i);
    if (!confirm('删除这条 PR 记录？')) return true;
    const prs = getPRs();
    const sorted = prs.slice().sort((a, b) => b.weight - a.weight);
    const target = sorted[i];
    savePRs(prs.filter(p => p !== target));
    render({ keepScroll: true });

/* ===== P51：子菜单左右滑动（对齐主流 App 手势规范） =====
   ① 左滑 = 下一个（右侧），右滑 = 上一个（左侧），与微信 / 小红书 / TabLayout 一致；
   ② 只切当前这一组标签，到边界即停，不再跨层级跳到别的菜单；
   ③ 标签条本身可横向滚动：横滑交给原生滚动，不劫持；
   ④ touchmove 判定为竖向滚动 / 慢拖 / 长按立即取消，上下滑列表不会误切；
   ⑤ 切换后只拦一次浏览器补发的 click，不再长时间吞掉所有点击；
   ⑥ 输入、滑块、轮播、滑动删除、弹层、锁屏、屏幕边缘一律让行。*/
const P48_SWIPE_MIN = 64;
const P48_SWIPE_RATIO = 1.3;
const P48_SWIPE_MAX_MS = 700;
const P48_SWIPE_MAX_DY = 34;
let _p48SwipeStart = null;

function p48SwipeBars(){
  const bars = Array.prototype.slice.call(view.querySelectorAll('.subtabs, .subtabs-secondary'));
  return bars.map(function(bar){
    const tabs = Array.prototype.slice.call(bar.querySelectorAll('.subtab'));
    let on = -1;
    for (let i = 0; i < tabs.length; i++){ if (tabs[i].classList.contains('on')){ on = i; break; } }
    return { bar:bar, tabs:tabs, secondary:bar.classList.contains('subtabs-secondary'), on:on };
  }).filter(function(g){ return g.tabs.length > 1 && g.on >= 0; });
}

function p48SwipeGroup(startEl){
  const groups = p48SwipeBars();
  if (!groups.length) return null;
  const bar = (startEl && startEl.closest) ? startEl.closest('.subtabs, .subtabs-secondary') : null;
  if (bar){
    const hit = groups.filter(function(g){ return g.bar === bar; })[0];
    if (hit) return hit;                      /* 起点在标签条上：只切这一组 */
  }
  /* 内容区：最内层（二级）优先；只有一级时切一级。绝不跨层级回落 */
  return groups.filter(function(g){ return g.secondary; })[0] ||
         groups.filter(function(g){ return !g.secondary; })[0] || null;
}
function p48SwipeTarget(startEl, dir){
  const g = p48SwipeGroup(startEl);
  if (!g) return null;
  const n = g.on + dir;
  if (n >= 0 && n < g.tabs.length) return g.tabs[n];
  return null;
}

let _p48ClickGuard = null, _p48GuardTimer = null;
function p48DropClickGuard(){
  if (_p48ClickGuard){ try { view.removeEventListener('click', _p48ClickGuard, true); } catch(e){} _p48ClickGuard = null; }
  if (_p48GuardTimer){ clearTimeout(_p48GuardTimer); _p48GuardTimer = null; }
}
/* 切换后把选中标签滚到可见 + 轻微淡入；只改透明度/缩放，不影响吸顶布局 */
function p48SwapFeedback(dir){
  setTimeout(function(){
    const on = view.querySelector('.subtabs-secondary .subtab.on') || view.querySelector('.subtabs .subtab.on');
    if (on){
      const bar = on.closest('.subtabs, .subtabs-secondary');
      if (bar && bar.scrollWidth > bar.clientWidth + 4){
        const left = on.offsetLeft - (bar.clientWidth - on.offsetWidth) / 2;
        try { bar.scrollTo({ left:Math.max(0, left), behavior:'smooth' }); }
        catch(e){ bar.scrollLeft = Math.max(0, left); }
      }
    }
    view.classList.remove('p51-swap');
    void view.offsetWidth;
    view.classList.add('p51-swap');
    setTimeout(function(){ view.classList.remove('p51-swap'); }, 260);
  }, 0);
}
function p48HandleSubSwipe(startEl, dx, dy, ms){
  if (Math.abs(dx) < P48_SWIPE_MIN) return false;
  if (Math.abs(dx) < Math.abs(dy) * P48_SWIPE_RATIO) return false;
  if (Math.abs(dy) > P48_SWIPE_MAX_DY) return false;
  if (ms !== undefined && ms > P48_SWIPE_MAX_MS) return false;
  const dir = dx < 0 ? 1 : -1;                /* 左滑下一个，右滑上一个 */
  const target = p48SwipeTarget(startEl, dir);
  if (!target) return false;
  p48DropClickGuard();                        /* 连续滑动：先撤掉上一次的拦截，别拦自己 */
  try { target.click(); } catch(e){ return false; }
  /* 只拦浏览器补发的那一个 click：拦到即自毁，不再吞掉后续正常点击 */
  const guard = function(ev){ ev.stopPropagation(); ev.preventDefault(); p48DropClickGuard(); };
  _p48ClickGuard = guard;
  view.addEventListener('click', guard, true);
  _p48GuardTimer = setTimeout(p48DropClickGuard, 120);
  p48SwapFeedback(dir);
  return true;
}
window.__p48Swipe = { bars:p48SwipeBars, target:p48SwipeTarget, group:p48SwipeGroup, go:p48HandleSubSwipe };

    s.dead = true; return;                    /* 竖向滚动 / 慢拖：取消本次手势 */
  }

async function fetchWordExampleFromApi(word){
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    let resp;
    try {
      resp = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), { signal: controller.signal });
    } finally { clearTimeout(timer); }
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!Array.isArray(data) || !data[0]) return null;

    const entry = data[0];
    let bestExample = '', pos = '', definition = '';
    for (const meaning of (entry.meanings || [])){
      pos = pos || meaning.partOfSpeech || '';
      for (const def of (meaning.definitions || [])){
        if (!definition) definition = def.definition || '';
        if (def.example && String(def.example).trim().length > 5){
          bestExample = def.example.trim();
          break;
        }
      }
      if (bestExample) break;
    }
    const scene = bestExample || definition;
    if (!scene) return null;

    let sceneCn = '';
    try { sceneCn = await translateToChinese(scene); } catch(e){}
    return { scene, sceneCn, pos, definition, source: 'dictionaryapi.dev', ts: Date.now() };
  } catch(e){
    console.warn('[Example] fetch failed', e);
    return null;
  }
}

function normWords(s){
  return String(s || '').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5' ]/g, ' ').split(/\s+/).filter(Boolean);
}
function localFollowScore(target, heard){
  const a = normWords(target), b = normWords(heard);
  if (!a.length) return { score:0, accuracy:0, tips:['没有可跟读的文本'] };
  const pool = b.slice(); const hit = [];
  a.forEach(w => { const i = pool.indexOf(w); if (i >= 0){ pool.splice(i, 1); hit.push(w); } });
  const acc = Math.round(hit.length / a.length * 100);
  const miss = a.filter(w => hit.indexOf(w) < 0).slice(0, 6);
  const extra = pool.slice(0, 4);
  const tips = [];
  if (miss.length) tips.push('没读到：' + miss.join(' / '));
  if (extra.length) tips.push('多读/读错：' + extra.join(' / '));
  if (!tips.length) tips.push('每个词都读到了，很棒！试着把连读和重音再练一遍。');
  const score = Math.max(0, Math.min(100, Math.round(acc * 0.9 + (b.length ? Math.min(10, b.length / a.length * 10) : 0))));
  return { score, accuracy:acc, tips, local:true };
}

/* ===== 慢速 + 长文分块朗读（P16） ===== */
function speakRateValue(){
  const v = (getSettings().speakRate) || 'slow';
  return v === 'normal' ? 1.0 : (v === 'verySlow' ? 0.65 : 0.78);
}
function splitSpeechChunks(text, maxLen){
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  if (!s) return [];
  const limit = maxLen || 160;
  if (s.length <= limit) return [s];
  const parts = (s.match(/[^.!?;。！？；]+[.!?;。！？；]?\s*/g) || [s]).map(x => x.trim()).filter(Boolean).reduce((acc, p) => {
    if (!p) return acc;
    while (p.length > limit){
      const cut = p.lastIndexOf(' ', limit);
      const at = cut > limit * 0.5 ? cut : limit;
      acc.push(p.slice(0, at).trim()); p = p.slice(at).trim();
    }
    if (p) acc.push(p);
    return acc;
  }, []);
  const out = []; let buf = '';
  (parts.length ? parts : [s]).forEach(p => {
    if (!buf) buf = p;
    else if ((buf + ' ' + p).length <= limit) buf += ' ' + p;
    else { out.push(buf); buf = p; }
  });
  if (buf) out.push(buf);
  return out;
}
function systemTTSQueue(chunks, langStr, rate, seq, cleanup){
  const step = (i) => {
    if (seq !== _speakSeq){ cleanup(); return; }
    if (i >= chunks.length){ cleanup(); return; }
    if (!window.speechSynthesis){ cleanup(); return; }
    try {
      const u = new SpeechSynthesisUtterance(chunks[i]);
      u.lang = langStr; u.rate = rate;
      u.onend = () => step(i + 1);
      u.onerror = () => step(i + 1);
      speechSynthesis.speak(u);
    } catch(e){ cleanup(); }
  };
  try { speechSynthesis.cancel(); } catch(e){}
  step(0);
}

function toggleSpeak(text, lang, btn){
  if (!text) { toast('没有内容可朗读'); return; }
  const wasPlaying = btn && _currentSpeakBtn === btn;
  stopSpeak();
  if (wasPlaying) return;
  const langStr = lang || 'en-US';
  const seq = ++_speakSeq;
  if (btn) { btn.classList.add('playing'); _currentSpeakBtn = btn; }
  playNetworkAudio(text, langStr, seq, btn);
}

/* P50 发音链路：设备自带系统 TTS 优先（离线可用、整段同一清晰嗓音、不依赖境外接口）。
   两个在线源只在系统引擎未就绪时使用，WebView 语音合成最后兜底。 */
function nativeSpeakText(text, langStr, rate){
  try {
    const api = window.AndroidTTS;
    if (!api || typeof api.speak !== 'function') return false;
    if (typeof api.speakWithRate === 'function')
      return api.speakWithRate(String(text), langStr, rate) === true;
    return api.speak(String(text), langStr) === true;
  } catch(e){ return false; }
}
function nativeSpeakCleanup(seq, cleanup, ms){
  setTimeout(() => { if (seq === _speakSeq) cleanup(); }, ms);
}

/* 多源网络 TTS：长文按句切块依次播放（不再 200 字截断），整体慢速适合新手 */
function playNetworkAudio(text, langStr, seq, btn) {
  const player = document.getElementById('ttsPlayer');
  if (!player) return;
  const full = String(text).replace(/\s+/g, ' ').trim();
  if (!full) return;
  const chunks = splitSpeechChunks(full, 160);
  const rate = speakRateValue();
  const isZh = String(langStr).startsWith('zh');
  const cleanup = () => {
    if (seq !== _speakSeq) return;
    if (_currentSpeakBtn) _currentSpeakBtn.classList.remove('playing');
    _currentSpeakBtn = null;
  };
  /* 系统 TTS 可用时直接发声：离线可用、整段同一嗓音，语速跟随设置 */
  if (nativeSpeakText(full, langStr, rate)) {
    nativeSpeakCleanup(seq, cleanup,
      Math.min(30000, Math.max(1200, Math.ceil(full.length * 95 / Math.max(0.5, rate)))));
    return;
  }
  /* P37 统一发音：以前 4 个在线源按健康度动态排序，长句切成多块后每块可能换一个声音
     （Google / Brian / 有道 / 百度），听起来像好几种发音，其中有道、百度发闷不清楚。
     现在固定只用 Google 标准清晰音，失败才退到 StreamElements（同为清晰音），
     并且整段锁定同一个源，中途绝不换嗓。 */
  const health = LS.get('tts-health', {});
  const markOk   = n => { health[n] = Math.min((health[n] || 0) + 1, 20); LS.set('tts-health', health); };
  const markFail = n => { health[n] = Math.max((health[n] || 0) - 1, -3); LS.set('tts-health', health); };
  let lockedSrc = null;
  const sourcesFor = chunk => [
    { name:'google', url:`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${isZh ? 'zh-CN' : 'en'}&q=${encodeURIComponent(chunk)}&total=1&idx=0&textlen=${chunk.length}&ttsspeed=1` },
    { name:'se', url:`https://api.streamelements.com/kappa/v2/speech?voice=${isZh ? 'Zhiyu' : 'Brian'}&text=${encodeURIComponent(chunk)}` }
  ];
  const playOne = chunk => new Promise(resolve => {
    const sources = sourcesFor(chunk);
    let idx = lockedSrc === null ? 0 : lockedSrc, done = false;
    const guard = setInterval(() => { if (seq !== _speakSeq) finish(false); }, 250);
    const hard = setTimeout(() => finish(false), 18000);
    const wires = () => { player.onplaying = null; player.onended = null; player.onerror = null; };
    function finish(ok){
      if (done) return; done = true;
      clearInterval(guard); clearTimeout(hard); wires();
      try { player.pause(); } catch(e){}
      resolve(ok);
    }
    const tryNext = () => {
      if (done) return;
      if (seq !== _speakSeq){ finish(false); return; }
      if (idx >= sources.length){ finish(false); return; }
      const srcItem = sources[idx++];
      let settled = false;
      const srcTimer = setTimeout(() => {
        if (settled || done) return;
        settled = true; markFail(srcItem.name); wires();
        try { player.pause(); } catch(e){}
        tryNext();
      }, 3000);
      player.onplaying = () => { if (settled || done) return; settled = true; clearTimeout(srcTimer); lockedSrc = idx - 1; markOk(srcItem.name); };
      player.onended = () => { if (!done){ clearTimeout(srcTimer); finish(true); } };
      player.onerror = () => {
        if (settled || done) return;
        settled = true; clearTimeout(srcTimer); markFail(srcItem.name); wires();
        try { player.pause(); } catch(e){}
        tryNext();
      };
      try {
        player.src = srcItem.url;
        try { player.playbackRate = rate; } catch(e){}
        const p = player.play();
        if (p && p.catch) p.catch(err => {
          if (settled || done) return;
          if (err && err.name === 'AbortError') return;
          settled = true; clearTimeout(srcTimer); markFail(srcItem.name); wires();
          tryNext();
        });
      } catch(e){ if (!done){ settled = true; clearTimeout(srcTimer); tryNext(); } }
    };
    tryNext();
  });
  (async () => {
    for (let i = 0; i < chunks.length; i++){
      if (seq !== _speakSeq) return;
      const ok = await playOne(chunks[i]);
      if (seq !== _speakSeq) return;
      if (!ok){
        /* 在线源全部失败：再给系统 TTS 一次机会（启动初期引擎可能尚未初始化完） */
        if (nativeSpeakText(chunks.slice(i).join(' '), langStr, rate)) {
          nativeSpeakCleanup(seq, cleanup, 8000);
          return;
        }
        systemTTSQueue(chunks.slice(i), langStr, rate, seq, cleanup);
        toast('在线发音不可用，已切备用发音；仍无声请检查系统语音引擎');
        return;
      }
    }
    cleanup();
  })();
}

// ============ 半小时走动提醒 ============
let _walkHalfHourTimer = null;

function isWalkHalfHourMoment() {
  const cfg = getSettings();
  if (!cfg.walkOn) return false;
  const now = new Date();
  const dow = now.getDay();                     // 0=日 1=一 ... 6=六
  if (dow === 0 || dow === 6) return false;     // 只在周一至周五
  if (now.getSeconds() > 20) return false;
  const [sh, sm] = String(cfg.walkStart || '08:30').split(':').map(Number);
  const [eh, em] = String(cfg.walkEnd || '17:00').split(':').map(Number);
  const totalMins = now.getHours() * 60 + now.getMinutes();
  const startM = sh * 60 + sm, endM = eh * 60 + em;
  if (totalMins < startM || totalMins > endM) return false;
  if (totalMins > 11 * 60 + 30 && totalMins < 13 * 60) return false;   // 午休静音
  const step = Number(cfg.walkFreq) || 30;
  return (totalMins - startM) % step === 0;
}

function checkWalkHalfHourTrigger() {
  try {
    // ★ 页面不可见（切到微信、锁屏、下拉通知）时绝不触发，
    //   否则会在后台调用原生 startForegroundService 导致 Android 12+ 抛异常杀进程
    if (document.visibilityState !== 'visible') return;
    if (!isWalkHalfHourMoment()) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const slotKey = `app_h_walkSlot_${todayStr()}_${hh}${mm}`;
    if (LS.get(slotKey, false)) return;
    LS.set(slotKey, true);
    console.log('[Walk] 半小时提醒触发:', hh + ':' + mm);
    if (typeof startWalkTimer === 'function') {
      startWalkTimer(200);
    }
  } catch (e) {
    console.warn('[Walk] checkWalkHalfHourTrigger error:', e);
  }
}

/* 把提醒设置交给系统闹钟：App 关掉/被清理也能准点响 */
function syncWalkToNative(){
  try {
    if (!window.AndroidBridge || typeof AndroidBridge.syncWalkSettings !== 'function') return;
    const s = getSettings();
    const [sh, sm] = String(s.walkStart || '08:30').split(':').map(Number);
    const [eh, em] = String(s.walkEnd || '17:00').split(':').map(Number);
    AndroidBridge.syncWalkSettings(s.walkOn ? 1 : 0, sh * 60 + sm, eh * 60 + em, Number(s.walkFreq) || 30);
  } catch(e){ console.warn('[Walk] 同步原生闹钟失败', e); }
}
/* 原生闹钟在 App 前台时直接调这里，弹 200 秒倒计时 */
window.onNativeWalkAlarm = function(){
  try {
    if (document.visibilityState !== 'visible') return;   // 后台不弹、不起服务
    const now = new Date();
    const slotKey = `app_h_walkSlot_${todayStr()}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    if (LS.get(slotKey, false)) return;
    LS.set(slotKey, true);

  } catch(e){ console.warn('[Walk] 原生回调出错', e); }
};
function initWalkReminder() {
  if (_walkHalfHourTimer) clearInterval(_walkHalfHourTimer);
  checkWalkHalfHourTrigger();

  syncWalkToNative();
  console.log('[Walk] 提醒已启动（原生闹钟 + 前台兜底）');
}

    if (!sported) missing.push('运动');
    if (!learned) missing.push('学习');
    if (!skined) missing.push('护肤');
    if (!booked) missing.push('记账');
    /* P44：药品效期 / 护肤品开封效期 / 咪咪全套提醒 / 经期，一并进晚间通知 */
    const due = [];
    try { mimiDueList().forEach(x => due.push(x)); } catch(e){}
    try {
      (getMedicines() || []).forEach(function(m){
        const l = expiryDaysLeft(m.expiry);
        if (l !== null && l <= 30) due.push('药品' + (m.name || '') + (l < 0 ? '已过期' + (-l) + '天' : '剩' + l + '天到期'));
      });
    } catch(e){}
    try {
      (getProductLibrary() || []).forEach(function(p){
        const l = productDaysLeft(p);
        if (l !== null && l <= 30) due.push('护肤' + (p.name || p.brand || '') + (l < 0 ? '已过期' + (-l) + '天' : '剩' + l + '天到期'));
      });
    } catch(e){}
    try { const pf = computePeriodForecast(); if (pf && pf.inPeriod) due.push('经期：' + (pf.status || '今天在经期窗口内')); } catch(e){}
    const dueTxt = due.length ? (' · 🔔 ' + (due.length > 2 ? due.slice(0, 2).join('、') + ' 等 ' + due.length + ' 项' : due.join('、'))) : '';
    if (!todo.length && !missing.length) return due.length ? ('今天都完成啦' + dueTxt + '，记得处理 ✦') : '今天都完成啦，来收星光，看一眼明天 ✦';
    if (todo.length && missing.length) return '今天还有 ' + todo[0] + '，' + missing.slice(0, 2).join('、') + ' 也还空着 · 星光等你来领' + dueTxt + ' ✦';
    if (todo.length) return '今天还有 ' + todo[0] + ' · 星光还没领哦' + dueTxt + ' ✦';
    if (missing.length) return '今天还没' + missing.slice(0, 3).join('、') + ' · 现在补一下正好' + dueTxt + ' ✦';
    return '今天的星光还没领哦，来收一下' + dueTxt + ' ✦';
  } catch(e){
    return '今天还有没完成的事吗？来收今天的星光 ✦';
  }
}
let _lastBriefAt = 0;
function syncEveningBrief(force){
  try {
    if (!window.AndroidBridge || typeof AndroidBridge.saveEveningBrief !== 'function') return;
    const now = Date.now();
    if (!force && now - _lastBriefAt < 60000) return;
    _lastBriefAt = now;
    AndroidBridge.saveEveningBrief(todayStr(), eveningBriefText());
  } catch(e){}
}
/** 原生闹钟在 App 前台时调用：温和提醒 + 直达时间线 */

(function init(){
  try {
    setTimeout(function(){ try { if (AutoBackup.run()) console.log('[备份] 自动备份完成'); } catch(e){} }, 6000);
    loadDataFromGlobals(); 
    /* P55：首屏先出界面，三个大词库在后台并行补齐，不阻塞显示 */
    try { window.__ensureAllData(); } catch(e){}
    p55NetUpdate();
    migrateOldSkinProducts(); 
    buildCalendarFromPlans(); 
    LearnStore.checkIn(); 
    restoreNavState(); 
    
    const bjD = new Date(Date.now() + 8*3600*1000);
    const wc = '日一二三四五六'[bjD.getUTCDay()];
    const dateEl = document.getElementById('topDate');
    if (dateEl) dateEl.textContent = (bjD.getUTCMonth()+1)+'月'+bjD.getUTCDate()+'日 周'+wc;

    render(); 
    try { initAppLock(); } catch(e){}
    initWalkReminder();
    try { initEveningReminder(); } catch(e){ console.warn('[Evening] 启动失败', e); }
    setTimeout(() => { try { if (window.AndroidBridge && window.AndroidBridge.getWidgetTimelineData) { const nativeJson = window.AndroidBridge.getWidgetTimelineData(); if (nativeJson && nativeJson !== "[]") { const arr = JSON.parse(nativeJson); const checks = getChecks(); let changed = false; const wt = todayStr();
          arr.forEach(item => { if (!item.key) return; if (item.done && !checks[item.key]) { checks[item.key] = true; changed = true; }
            else if (item.done === false && checks[item.key] && String(item.key).indexOf('_' + wt + '_') >= 0) { delete checks[item.key]; changed = true; } }); if (changed) { saveChecks(checks); render(); } } } syncToNativeWidget(); } catch (e) { console.error('init widget sync error:', e); } }, 1200);
    setInterval(() => { const el = document.getElementById('sportTimer'); if (el){ const sess = getSportSession(); if (sess && !sess.endTs && !sess.pausedAt){ let elapsed = Date.now() - sess.startTs - (sess.pausedTotal || 0); const total = Math.floor(elapsed / 1000); const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60; el.textContent = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; const sc = document.getElementById('sportSetCount'); if (sc) sc.textContent = Object.values(sess.sets || {}).reduce((a,b) => a + b.length, 0); } } }, 1000);
  } catch (err) { var el = document.getElementById('fatal-error'); if (el) { el.style.display = 'block'; el.innerHTML = '启动失败：' + err.message + '<br><br>' + err.stack; } else { document.getElementById('view').innerHTML = '<div style="padding:20px;color:#121C2A;">启动失败：' + err.message + '</div>'; } }
})();
// === 提供给 Android 物理返回键调用的方法 ===
window.handleNativeBack = function() {
  // 1. 如果弹窗层（Sheet）是打开的，先关弹窗
  if (sheet.classList.contains('open')) {
    closeSheet();
    return true; 
  }
  
  // 2. P48：工具箱里的子应用，第一次返回先回工具箱首页，第二次才回 APP 首页
  if (state.tab === 'tools' && state.toolsSub && state.toolsSub !== 'home') {
    state.toolsSub = 'home';
    render();
    return true;
  }

  // 3. 不在首页（含工具箱首页），切回 APP 首页
  if (state.tab !== 'home') {
    state.tab = 'home';
    render();
    return true;
  }
  
  // 4. 已经在 APP 首页且无弹窗，返回 false 告诉原生可以退出 App
  return false;
};
const _bootDay = todayStr();
function _checkDayRollover(){
  if (todayStr() !== _bootDay){
    console.log('[Day] 跨天，刷新页面');

}

});
