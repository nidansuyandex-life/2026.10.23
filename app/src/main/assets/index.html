<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>日常 · 健康生活</title>
<script src="./data/decks.js"></script>
<script src="./data/valve.js"></script>
<script src="./data/thinking.js"></script>
<script src="./data/scenes.js"></script>
<style>
:root{--brand:#4f46e5;--brand2:#7c3aed;--sub:#6b7280;--ok:#059669;--warn:#b45309;--err:#dc2626;--accent:#1FBFA9;--accent2:#5FD9C4;--accent-soft:#E7F9F5;--hot:#FF6B5B;--hot2:#FFA36B;--hot-soft:#FFF0EC;--purple:#8B7CF6;--purple2:#B39BFF;--purple-soft:#F1EEFF;--blue:#4A9EFF;--blue2:#7FC4FF;--blue-soft:#EAF3FF;--pink:#FF6FA5;--pink2:#FFA1C4;--pink-soft:#FFEEF5;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e9ebf3;color:#111827;display:flex;justify-content:center;min-height:100dvh;overflow:hidden;}
.phone{position:relative;width:100%;max-width:460px;height:100dvh;background:linear-gradient(180deg,#fbfbfe,#f3f4fa);display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 0 4px rgba(79,70,229,.12);}
.today{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;}
.top-icon-btn{border:0;background:#fff;width:34px;height:34px;border-radius:11px;font-size:15px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.06);}
#view{flex:1;overflow-y:auto;padding:2px 16px 90px;}
#view::-webkit-scrollbar{width:0;}
.tabbar{flex-shrink:0;display:flex;background:rgba(255,255,255,.95);border-top:1px solid rgba(0,0,0,.06);padding:8px 2px calc(8px + env(safe-area-inset-bottom));}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:12px;cursor:pointer;color:#9aa0b0;font-size:9.5px;font-weight:600;font-family:inherit;}
.tab.on{color:var(--brand);}
.tab-icon{font-size:16px;line-height:1;}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid rgba(16,24,40,.045);box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -14px rgba(16,24,40,.28);}
.card.done{background:#f8f9fd;border-style:dashed;opacity:.72;}
.hero{padding:4px 4px 14px;}
.hero-k{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.5px;margin-bottom:7px;}
.hero h1{font-size:22px;margin:0;letter-spacing:-.5px;}
.sec-title{font-size:13px;font-weight:700;color:#3b4256;margin:14px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sec-title .muted{font-weight:500;font-size:11.5px;display:flex;align-items:center;gap:6px;}
.muted{color:var(--sub);}
.foot-note{text-align:center;font-size:11.5px;color:#aab0c0;padding:18px 0 4px;}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px -10px rgba(79,70,229,.9);}
.btn.wide{width:100%;margin-top:6px;}
.btn.ghost{background:#f1f2f9;color:#4b5265;padding:8px 14px;font-size:13px;}
.btn.danger{background:#fef2f2;color:#dc2626;padding:8px 14px;font-size:13px;}
.btn-primary{width:100%;border:none;font-family:inherit;font-size:15px;font-weight:600;color:#fff;padding:15px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-top:4px;}
.btn-ghost-h{width:100%;border:none;font-family:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:14px;cursor:pointer;background:var(--accent-soft);color:var(--accent);}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px;padding:6px 16px 12px;flex-wrap:nowrap;}
.chips::-webkit-scrollbar{display:none;}
.chip{border:1px solid #e6e8f0;background:#fff;color:#5b6276;padding:8px 15px;border-radius:99px;font-size:13.5px;font-weight:650;white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:inherit;}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.subtabs{display:flex;gap:5px;background:#fff;border-radius:14px;padding:5px;margin-bottom:12px;border:1px solid rgba(16,24,40,.05);overflow-x:auto;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{border:0;background:none;padding:9px 12px;border-radius:10px;font-size:12.5px;font-weight:650;color:#7a8194;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;}
.subtab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;}
.tip-card{background:#fff;border:1px dashed #dfe2ee;border-radius:16px;padding:14px;font-size:12.5px;line-height:1.7;color:#5b6276;margin-top:4px;}
.loading-card{background:#fff;border-radius:18px;padding:32px 20px;text-align:center;margin-bottom:12px;}
.err-inline{background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;color:#92400e;margin-top:8px;}
.src-tag{display:inline-block;font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:5px;margin-bottom:8px;background:#eef0ff;color:var(--brand);}
.sk{background:linear-gradient(90deg,#eef0f7 25%,#f7f8fc 37%,#eef0f7 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:18px;margin-bottom:12px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.home-head{background:#fff;border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.home-head .left .title{font-size:24px;font-weight:800;letter-spacing:.5px;color:#1B1F2A;}
.home-head .left .suggest{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.65;max-width:230px;}
.home-head .right{text-align:right;flex:none;}
.home-head .right .date{font-size:14px;font-weight:700;}
.home-head .right .weather{font-size:13px;color:#5A6175;margin-top:8px;}
.home-head .right .temp{font-size:12.5px;color:var(--sub);margin-top:3px;}
.home-tl-wrap{background:#fff;border-radius:18px;margin-bottom:12px;overflow:hidden;}
.home-tl-item{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;transition:background .15s;cursor:pointer;}
.home-tl-item:active{background:#f5fbfa;}
.home-tl-item:not(:last-child)::after{content:'';position:absolute;left:29px;bottom:-6px;width:1.5px;height:14px;background:#E6E9F1;}
.home-tl-text{flex:1;font-size:13.5px;color:#1B1F2A;line-height:1.5;min-width:0;}
.home-tl-text .tm{color:var(--sub);font-size:11.5px;font-weight:600;margin-right:8px;}
.home-tl-text .sub{color:var(--sub);font-size:11.5px;display:block;margin-top:2px;line-height:1.45;}
.home-tl-arrow{color:var(--accent);font-size:16px;flex:none;opacity:.55;}
.home-tl-badge{font-size:10px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;font-weight:700;flex:none;}
.home-tl-item.is-done .home-tl-text{color:var(--sub);}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #E3E6EF;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;transition:.2s;background:#fff;}
.check.done{background:var(--accent);border-color:var(--accent);}
.check.done::after{content:'✓';}
.body-state-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.body-state-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px;border-radius:9px;background:#F7F8FC;border:1.5px solid transparent;cursor:pointer;font-size:10px;font-weight:600;color:#3A4152;text-align:center;line-height:1.2;transition:.15s;}
.body-state-item .bsi-icon{font-size:15px;line-height:1;}
.body-state-item .bsi-label{font-size:9.5px;font-weight:600;white-space:nowrap;}
.body-state-item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.body-state-item.active .bsi-label{color:var(--accent);font-weight:700;}
.task-card{background:linear-gradient(135deg,#fff,#f8f9fd);border:1px solid rgba(79,70,229,.12);border-radius:18px;padding:16px;margin-bottom:14px;}
.task-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.task-title{font-size:14px;font-weight:750;}
.task-progress{font-size:12px;color:var(--sub);font-weight:600;}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eceef4;cursor:pointer;}
.task-row:last-child{border:0;}
.task-check{width:22px;height:22px;border-radius:8px;border:2px solid #dfe2ee;background:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;}
.task-check.on{background:var(--brand);border-color:var(--brand);}
.task-label{flex:1;font-size:13px;font-weight:600;color:#3f4658;}
.task-label.on{color:#aab0c0;text-decoration:line-through;}
.task-count{font-size:11.5px;color:var(--sub);font-weight:600;}
.review-entry{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:18px;padding:14px;margin-bottom:14px;}
.review-entry .r-title{font-size:13.5px;font-weight:750;color:#92400e;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.review-entry .r-meta{font-size:12px;color:#a16207;line-height:1.7;margin-bottom:10px;}
.streak-badge{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:99px;}
.know-q{font-size:15.5px;font-weight:750;line-height:1.5;}
.know-a{font-size:13.5px;line-height:1.78;color:#3f4658;margin-top:12px;padding-top:12px;border-top:1px dashed #eceef4;}
.know-key{margin-top:12px;background:#f8f9fd;border-left:3px solid var(--brand);padding:11px 13px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.75;color:#4b5265;}
.know-body{display:none;margin-top:12px;}
.know.open .know-body{display:block;}
.know-cat{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:#eef0ff;padding:3px 9px;border-radius:6px;margin-bottom:10px;}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:10px 14px;margin:8px 0 4px;}
.search-input{flex:1;border:0;outline:0;background:transparent;font-size:14px;padding:2px 0;font-family:inherit;}
.word-mini{background:#fff;border:1px solid rgba(16,24,40,.06);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px;}
.word-mini.done{background:#f8f9fd;opacity:.65;border-style:dashed;}
.word-mini .wm-word{font-size:15px;font-weight:750;color:#2b3244;flex-shrink:0;}
.word-mini.done .wm-word{text-decoration:line-through;color:#aab0c0;}
.word-mini .wm-cn{font-size:12px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.word-mini .wm-check{width:22px;height:22px;border-radius:50%;border:2px solid #dfe2ee;background:#fff;display:grid;place-items:center;font-size:11px;flex-shrink:0;color:#fff;font-weight:700;}
.word-mini .wm-check.on{background:var(--brand);border-color:var(--brand);}
.word-big{font-size:32px;font-weight:850;letter-spacing:-.8px;color:#2b3244;}
.word-ph{font-size:13px;color:var(--sub);margin-top:6px;}
.deck-chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:11px 14px;cursor:pointer;flex-shrink:0;min-width:130px;text-align:left;font-family:inherit;}
.deck-chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;}
.deck-chip .dc-name{font-size:13.5px;font-weight:750;}
.deck-chip .dc-meta{font-size:11px;opacity:.7;}
.progress-bar{height:8px;background:#e5e7f5;border-radius:99px;overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s;}
.load-more{border:0;background:#f1f2f9;color:#4b5265;width:100%;padding:13px;border-radius:12px;font-size:13px;font-weight:650;cursor:pointer;margin-top:6px;font-family:inherit;}
.answer-input{width:100%;min-height:80px;border:1px solid #e6e8f0;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;resize:vertical;background:#fafbfe;margin-top:6px;font-family:inherit;}
.score-card{background:#fff;border:1px solid #e2e5ff;border-radius:16px;padding:16px;margin-top:14px;}
.score-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.score-num{font-size:34px;font-weight:850;color:var(--brand);letter-spacing:-1.5px;line-height:1;}
.score-label{font-size:12px;font-weight:700;color:var(--brand);}
.score-row{margin-top:12px;padding-top:12px;border-top:1px dashed #eceef4;}
.score-row-title{font-size:12px;font-weight:750;margin-bottom:8px;}
.score-extra{background:#f8f9fd;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.78;color:#4b5265;}
.score-list{margin:0;padding-left:18px;}
.score-list li{font-size:13px;line-height:1.75;color:#3f4658;}
.rate-row{display:flex;gap:8px;margin-top:14px;}
.rate-btn{flex:1;border:0;padding:12px 4px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.rate-btn.again{background:#fef2f2;color:#dc2626;}
.rate-btn.hard{background:#fef3c7;color:#b45309;}
.rate-btn.good{background:#ecfdf5;color:#047857;}
.h-task{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #F3F5F9;}
.h-task:last-child{border-bottom:none;padding-bottom:0;}
.h-task .body{flex:1;min-width:0;}
.h-t-name{font-size:14px;font-weight:500;}
.tag{font-size:11px;padding:3px 9px;border-radius:9px;background:#F3F5F9;color:#7A8196;font-weight:500;}
.tag.on{background:var(--accent-soft);color:var(--accent);}
.progress{height:8px;border-radius:8px;background:#F0F2F7;overflow:hidden;margin:2px 0 9px;}
.progress .bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.row-between{display:flex;justify-content:space-between;align-items:center;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;}
.stat{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;transition:.15s;}
.stat:active{transform:scale(.97);}
.stat .v{font-size:18px;font-weight:700;}
.stat .k{font-size:11px;color:var(--sub);margin-top:5px;}
.stat .d{font-size:10px;color:var(--sub);margin-top:3px;font-weight:600;}
.tl{position:relative;padding-left:24px;}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:#EDF0F6;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #DDE2EC;box-sizing:border-box;}
.tl-item.done::before{background:var(--accent);border-color:var(--accent);}
.tl-time{font-size:11px;color:var(--sub);margin-bottom:3px;font-weight:500;}
.tl-title{font-size:14px;font-weight:500;}
.tl-item.done .tl-title{text-decoration:line-through;color:var(--sub);}
.tl-desc{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.55;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .m{font-size:15px;font-weight:700;}
.cal-head span.nav{color:#B9C0D0;font-size:17px;cursor:pointer;padding:0 6px;}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-week div{text-align:center;font-size:11px;color:#A3A9B8;padding:4px 0;font-weight:500;}
.cal-grid div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;border-radius:10px;position:relative;color:#3A4152;cursor:pointer;user-select:none;padding:2px 0;}
.cal-grid div.empty{visibility:hidden;cursor:default;}
.cal-grid div.sel{background:var(--blue-soft);color:var(--blue);font-weight:600;}
.cal-grid div.today{background:var(--blue);color:#fff;font-weight:700;}
.cal-grid div.has::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:.75;}
.cal-grid div.today.has::after{background:#fff;opacity:1;}
.cal-grid div.holiday{color:var(--hot);font-weight:700;}
.cal-grid div.holiday .holiday-name{font-size:8px;line-height:1;margin-top:1px;font-weight:500;color:var(--hot);}
.cal-grid div.today.holiday .holiday-name{color:#fff;}
.balance{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;}
.balance .lab{font-size:12px;opacity:.85;}
.balance .big{font-size:30px;font-weight:700;margin-top:8px;}
.balance .foot{display:flex;gap:26px;margin-top:16px;font-size:11.5px;opacity:.92;}
.mic-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 20px;}
.mic{width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(145deg,var(--accent2),var(--accent));font-size:40px;color:#fff;transition:.2s;}
.mic.listening{animation:pulseMic 1.4s infinite;box-shadow:0 0 0 6px rgba(31,191,169,.15);}
@keyframes pulseMic{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.mic-hint{margin-top:16px;font-size:12.5px;color:var(--sub);text-align:center;padding:0 20px;line-height:1.6;}
.mic-actions{display:flex;gap:8px;margin-top:10px;max-width:320px;width:100%;}
.text-input-area{display:none;margin-top:10px;width:100%;}
.text-input-area.show{display:block;}
.text-input-area input{width:100%;border:1.5px solid #E3E6EF;border-radius:12px;padding:12px 14px;font-family:inherit;font-size:13.5px;outline:none;margin-bottom:8px;}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F5F9;cursor:pointer;border-radius:8px;}
.tx:last-child{border-bottom:none;padding-bottom:0;}
.tx .ic{width:36px;height:36px;border-radius:11px;background:#F5F7FB;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;}
.tx .body{flex:1;min-width:0;}
.tx .amt{font-weight:600;font-size:14px;margin-left:6px;}
.tx .amt.inc{color:var(--accent);}
.tx .del-tx{width:24px;height:24px;border-radius:50%;border:none;background:#FFEDEA;color:var(--hot);font-size:12px;cursor:pointer;flex:none;line-height:1;}
.cat-chip{font-size:11.5px;padding:6px 12px;border-radius:10px;background:#F3F5F9;color:#5A6175;font-weight:500;cursor:pointer;border:none;font-family:inherit;margin:2px;display:inline-block;}
.cat-chip.active{background:var(--accent);color:#fff;}
.cat-chip.newcat{background:var(--blue-soft);color:var(--blue);}
.sport-timer{font-size:40px;font-weight:700;color:var(--accent);text-align:center;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:4px 0 2px;line-height:1.1;}
.sport-timer-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:4px;}
.sport-meta{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:12px;color:#5A6175;flex-wrap:wrap;}
.sport-meta b{color:#1B1F2A;font-weight:700;}
.sport-done-badge{display:inline-block;margin-top:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;}
.week-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #F3F5F9;font-size:13px;}
.week-row:last-child{border-bottom:none;padding-bottom:0;}
.week-row .d{width:42px;flex:none;font-weight:600;color:#5A6175;font-size:12px;}
.week-row .dt{width:44px;flex:none;color:#B9C0D0;font-size:10.5px;}

<body>
<div class="phone">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>日常 · 健康生活</div>
    <div class="today" id="todayLabel"></div>
  </header>
  <main id="view">
    <div id="fatal-error"></div>
  </main>
  <button class="fab" id="fab">🤖</button>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="sheet"></div>
  <div class="center-timer" id="centerTimer">
    <div class="box">
      <div class="big" id="centerTimerNum">200</div>
      <div class="txt">该站起来走动走动了</div>
      <div class="sub">起身 → 走动 2–3 分钟<br>下巴轻收 5 次 → 肩胛向后下轻收 5–8 次</div>
      <div class="actions">
        <button class="btn-skip" data-act="closeCenterTimer">关闭</button>
        <button class="btn-ok" data-act="closeCenterTimer">知道了</button>
      </div>
    </div>
  </div>
  <audio id="ttsPlayer" preload="auto"></audio>

<script>
// === 终极白屏防御 ===
window.onerror = function(msg, url, line, col, error) {
    var el = document.getElementById('fatal-error');
    if (el) {
        el.style.display = 'block';
        el.innerHTML += '脚本错误: ' + msg + '<br>位置: ' + line + ':' + col + '<br><br>';
    }
    return false;
};

window.addEventListener('error', e => console.error('Error:', e.message));
window.addEventListener('unhandledrejection', e => console.error('Promise:', e.reason));

// ============ 桌面卡片桥接（桌面 → App / App → 桌面） ============
window.onWidgetCheckin = function(key, done) {
    try {
        if (key.startsWith('todo_')) {
            const payloadStr = key.substring(5);
            try {
                const payload = JSON.parse(decodeURIComponent(payloadStr));
                const item = (state.calendarData[payload.date] || []).find(x => x.time === payload.time && x.title === payload.title);
                if (item) {
                    const m = getTodoStatusMap();
                    const k = getTodoKey(payload.date, item);
                    if (done) m[k] = true; else delete m[k];
                    saveTodoStatusMap(m);
                }
            } catch(err) { console.error('parse todo error', err); }
        } else {
            setCheck(key, done);
        }
        render({ keepScroll: true });
        syncToNativeWidget();
    } catch (e) { console.error('onWidgetCheckin error:', e); }
};

window.jumpFromNative = function(route) {
    try {
        if (route === 'money') {
            state.tab = 'life'; state.lifeSub = 'money'; state.moneySub = 'record'; render();
        } else if (route === 'study') {
            state.tab = 'study'; state.studySub = 'today'; render();
        } else {
            state.tab = 'home'; render();
        }
    } catch (e) { console.error('jumpFromNative error:', e); }
};

function syncToNativeWidget() {
    try {
        if (window.AndroidBridge && window.AndroidBridge.syncWidgetData) {
            const t = todayStr();
            const checks = getChecks();
            const manualTodos = ((state.calendarData[t] || []).filter(x => x.manual)).slice();
            const ov = getOverride(new Date());
            const ovMap = { swim:'游泳', reduced:'减量训练', period:'经期休息', leave:'请假', rest:'休息' };
            const plan = currentPlan();
            let sportText = plan.label; if (ov && ovMap[ov]) sportText = ovMap[ov];
            const showProtein = (!ov) || ov === 'swim' || ov === 'reduced';

            const fixedItems = [
                { time:'07:40', text:'起床', checkKey: `home_${t}_wake`, icon: '🌅' },
                { time:'07:45', text:'护肤', checkKey: `home_${t}_skin_am`, icon: '🧴' },
                { time:'07:50', text:'早饭', checkKey: `home_${t}_breakfast`, icon: '🥣' },
                { time:'08:00', text:'上班', checkKey: `home_${t}_commute`, icon: '💼' },
                { time:'12:00', text:'中饭', checkKey: `home_${t}_lunch`, icon: '🍱' },
                { time:'12:30', text:'学习', checkKey: `home_${t}_study`, icon: '📚' },
                { time:'18:00', text:'晚饭', checkKey: `home_${t}_dinner`, icon: '🍲' },
                { time:'19:30', text: sportText, checkKey: `home_${t}_sport`, icon: '🏃' },
                { time:'22:00', text:'洗漱', checkKey: `home_${t}_skin_pm`, icon: '🐱' },
                { time:'22:30', text:'睡前呼吸', checkKey: `home_${t}_breathe`, icon: '🌙' }
            ];
            if (showProtein){
                fixedItems.push({ time:'20:30', text:'吃蛋白粉', checkKey: `home_${t}_protein`, icon: '🥛' });
            }
            
            const todoItems = manualTodos.map(mt => {
                return {
                    time: mt.time || '99:99',
                    text: mt.title,
                    key: 'todo_' + encodeURIComponent(JSON.stringify({ date: t, time: mt.time, title: mt.title })),
                    done: !!mt.done,
                    icon: '📝'
                };
            });
            
            const allTimeline = fixedItems.map(it => ({
                time: it.time,
                text: it.text,
                icon: it.icon,
                key: it.checkKey,
                done: !!checks[it.checkKey]
            }));
            
            const finalTimeline = [...allTimeline, ...todoItems].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            
            if (window.AndroidBridge.syncTimelineData) {
                window.AndroidBridge.syncTimelineData(JSON.stringify(finalTimeline));
            }

            const tasks = LearnStore.getTodayTasks();
            const doneTasks = tasks.filter(x => x.done).length;
            const studyText = `今日学习：${doneTasks}/${tasks.length}`;
            const monthTx = transactions.filter(x => x.date.startsWith(t.slice(0,7)));
            const monthExp = monthTx.filter(x => x.type === 'expense').reduce((s,x) => s + x.amount, 0);
            const expenseText = `本月支出：¥${monthExp.toFixed(0)}`;
            window.AndroidBridge.syncWidgetData(studyText, expenseText);
        }
    } catch (e) { console.error('syncToNativeWidget error:', e); }
}

const DAY = Math.floor((Date.now() + 8*3600*1000) / 86400000);
const DAILY_WORD_COUNT = 5, DAILY_VALVE_COUNT = 5, REVIEW_TARGET = 5, PAGE_SIZE = 50;
const WEEK_CN = '日一二三四五六';

function bjDate(){ return new Date(Date.now() + 8*3600*1000); }
function fmtDate(){ const d = bjDate(); return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日 星期'+WEEK_CN[d.getUTCDay()]; }

function prevDayStr(){ const d = new Date(Date.now()-86400000+8*3600*1000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }

function dailyPick(arr,n,salt=0){
  if(!arr||!arr.length) return [];
  let seed=(DAY*1000+salt*7919)%2147483647;
  if(seed<=0) seed+=2147483646;
  const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
  const idx=arr.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,n).map(i=>arr[i]);
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function raceTimeout(promise, ms, errMsg='请求超时'){ return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(errMsg)), ms))]); }
function friendlyErr(e){
  const msg = (e && e.message) ? e.message : String(e || '');
  if (/Failed to fetch/i.test(msg)) return '网络不通';
  if (/aborted|timeout|请求超时/i.test(msg)) return '请求超时';
  return msg || '失败';
}
async function fetchJson(url, timeout=8000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try { const r = await fetch(url, { signal: controller.signal }); if (!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally { clearTimeout(timer); }
}
function extractList(result){
  if (!result) return [];
  if (Array.isArray(result)) return result;
  if (Array.isArray(result.newslist)) return result.newslist;
  if (Array.isArray(result.list)) return result.list;
  if (result.title || result.content || result.description || result.en) return [result];
  return [];
}
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.querySelector('.phone').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 1900);
}

  <div class="sec-title" style="margin:10px 4px 6px;"><span>时间线</span><span style="display:flex;align-items:center;gap:8px;"><button class="mini-add" data-act="newTodoToday" style="font-size:12px;padding:5px 12px;">＋ 新建今日待办</button><span class="muted" style="font-weight:500;font-size:11.5px;">点左侧圆圈打卡</span></span></div>
  <div class="home-tl-wrap">${tlHtml}</div>
  <div class="foot-note">数据保存在本设备 · 请定期备份</div>`;
}

async function studyView(){ return `<div class="hero"><div class="hero-k">学习 · ${todayStr()}</div><h1>每天进步一点</h1></div><div class="tip-card">学习模块（略）</div>`; }
async function lifeView(){ return `<div class="hero"><div class="hero-k">生活 · 记录</div><h1>生活</h1></div><div class="tip-card">生活模块（略）</div>`; }
async function discoverView(){ return `<div class="hero"><div class="hero-k">发现 · 认知提升</div><h1>发现</h1></div><div class="tip-card">发现模块（略）</div>`; }
function meView(){ return `<div class="hero"><div class="hero-k">我的</div><h1>数据管理</h1></div><div class="tip-card">我的模块（略）</div>`; }

const VIEWS = { home:homeView, study:studyView, life:lifeView, discover:discoverView, me:meView };
const SKELETON = { home:'<div class="sk" style="height:140px"></div>', study:'<div class="sk" style="height:140px"></div>', life:'<div class="sk" style="height:140px"></div>', discover:'<div class="sk" style="height:140px"></div>', me:'<div class="sk" style="height:180px"></div>' };
let renderToken = 0;
async function render(options){
  options = options || {};
  const token = ++renderToken; const tab = state.tab; const keepScroll = options.keepScroll;
  const prevScroll = keepScroll ? view.scrollTop : 0;
  renderTabs(); updateTopbar();
  if (!keepScroll){ view.scrollTop = 0; view.innerHTML = SKELETON[tab] || '<div class="sk" style="height:200px"></div>'; }
  let html;
  try { html = await VIEWS[tab](); } catch(e){ console.error(e); html = `<div class="tip-card" style="color:red;">加载失败：${esc(e.message)}</div>`; }
  if (token !== renderToken || state.tab !== tab) return;
  view.innerHTML = html;
  requestAnimationFrame(() => {
    if (keepScroll) view.scrollTop = prevScroll;
    applyChecks();
    if (tab === 'home') fetchWeather();
  });
}
function applyChecks(){ const c = getChecks(); document.querySelectorAll('[data-check-key]').forEach(el => { if (c[el.dataset.checkKey]) el.classList.add('done'); else el.classList.remove('done'); }); }

let _sheetCloseTimer = null;
function sheetHTML(html){ return `<div class="sheet-mask" data-act="closeSheet"></div><div class="sheet-body">${html}</div>`; }
function openSheet(html){ if (_sheetCloseTimer){ clearTimeout(_sheetCloseTimer); _sheetCloseTimer = null; } const wasOpen = sheet.classList.contains('open'); sheet.innerHTML = sheetHTML(html); if (!wasOpen) requestAnimationFrame(() => sheet.classList.add('open')); }
function closeSheet(){ sheet.classList.remove('open'); state.review = null; if (_sheetCloseTimer) clearTimeout(_sheetCloseTimer); _sheetCloseTimer = setTimeout(() => { if (!sheet.classList.contains('open')) sheet.innerHTML = ''; _sheetCloseTimer = null; }, 320); }

view.addEventListener('input', e => {});
view.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  
  if (act === 'jumpFromHome'){ const target = t.dataset.target; if (target === 'study'){ state.tab = 'study'; } else if (target === 'sport'){ state.tab = 'life'; } else if (target === 'money'){ state.tab = 'life'; } render(); return; }
  if (act === 'newTodoToday'){ 
    const time = prompt('时间（如 09:00）', '09:00'); if (time === null) return; 
    const title = prompt('事项'); if (!title || !title.trim()) return; 
    const desc = prompt('备注（可留空）', ''); if (desc === null) return; 
    const date = todayStr(); const saved = getManualTodos(); if (!saved[date]) saved[date] = []; 
    saved[date].push({ time: (time||'09:00').trim(), title: title.trim(), desc: (desc||'').trim(), done:false }); 
    saveManualTodos(saved); buildCalendarFromPlans(); syncToNativeWidget(); toast('已添加'); render({ keepScroll: true }); return; 
  }
  if (act === 'setOverride'){ 
    const mode = t.dataset.mode; const today = new Date(); today.setHours(0,0,0,0); 
    setOverride(today, mode === 'original' ? null : mode); 
    buildCalendarFromPlans(); syncToNativeWidget(); render({ keepScroll: true }); return; 
  }
  if (act === 'closeCenterTimer'){ finishWalkTimer(); return; }
});

view.addEventListener('click', e => {
  const toggle = e.target.closest('[data-toggle-todo]');
  if (toggle && !e.target.closest('[data-del-todo]')){ 
    try { 
      const payload = JSON.parse(decodeURIComponent(toggle.dataset.toggleTodo)); 
      const item = (state.calendarData[payload.date] || []).find(x => x.time === payload.time && x.title === payload.title); 
      if (item){ 
        const m = getTodoStatusMap(); const k = getTodoKey(payload.date, item); 
        if (m[k]) delete m[k]; else m[k] = true; 
        saveTodoStatusMap(m); syncToNativeWidget(); render({ keepScroll: true }); 
      } 
    } catch(err){} 
    return; 
  }
  const c = e.target.closest('.check');
  if (c && !c.closest('[data-toggle-todo]') && !c.dataset.act){ 
    if (c.dataset.checkKey){ 
      c.classList.toggle('done'); const isDone = c.classList.contains('done'); 
      setCheck(c.dataset.checkKey, isDone); 
      syncToNativeWidget(); 
    } 
    return; 
  }
});

tabbar.addEventListener('click', e => { const t = e.target.closest('.tab'); if (!t) return; state.tab = t.dataset.tab; render(); });

// ============ 倒计时（原生接管，后台保活） ============
const WALK_LAST_KEY = 'app_h_lastWalkReminder';
let _walkTimerHandle = null, _walkCountdownHandle = null, _walkEndTs = 0;
function isInWalkWindow(){ const now = new Date(); const mins = now.getHours() * 60 + now.getMinutes(); return (mins >= 8*60 + 30 && mins <= 11*60 + 30) || (mins >= 13*60 + 30 && mins <= 17*60); }
function vibratePattern(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function speakText(text){ const t = String(text || ''); if (!t) return; try { if (window.AndroidTTS && typeof AndroidTTS.speak === 'function'){ AndroidTTS.speak(t, 'zh-CN'); return; } if ('speechSynthesis' in window){ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; u.rate = 1.0; speechSynthesis.speak(u); } } catch(e){} }
function requestNotifPermission(){ try { if (window.AndroidNotify && AndroidNotify.requestPermission) AndroidNotify.requestPermission(); if (typeof Notification !== 'undefined' && Notification.permission === 'default') Notification.requestPermission(); } catch(e){} }
function sendNotification(title, body){ try { if (window.AndroidNotify && AndroidNotify.notify){ AndroidNotify.notify(title, body); return; } if (typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification(title, { body }); } catch(e){} }
function finishWalkTimer(){ 
  const el = document.getElementById('centerTimer'); 
  if (el) el.classList.remove('show'); 
  if (_walkCountdownHandle){ clearInterval(_walkCountdownHandle); _walkCountdownHandle = null; } 
  _walkEndTs = 0; 
  playBeep(); 
  setTimeout(() => playBeep(), 420); 
  vibratePattern([300, 150, 300]); 
  // 结束不再网页播报，交给原生 WalkTimerService 处理
  sendNotification('活动结束', '可以回到座位继续工作了'); 
}
function startWalkTimer(sec){ 
  const el = document.getElementById('centerTimer'); 
  const num = document.getElementById('centerTimerNum'); 
  if (!el || !num) return; 
  const duration = Math.max(1, parseInt(sec, 10) || 200); 
  _walkEndTs = Date.now() + duration * 1000; 
  num.textContent = duration; 
  el.classList.add('show'); 
  
  // 触发原生倒计时（原生会播报开始和结束的语音，并且后台保活）
  if (window.AndroidBridge && window.AndroidBridge.startNativeWalkTimer) {
      window.AndroidBridge.startNativeWalkTimer(duration);
  }
  
  if (_walkCountdownHandle) clearInterval(_walkCountdownHandle); 
  _walkCountdownHandle = setInterval(() => { 
    const left = Math.max(0, Math.ceil((_walkEndTs - Date.now()) / 1000)); 
    num.textContent = left; 
    if (left <= 0) finishWalkTimer(); 
  }, 250); 
  
  // 网页端语音播报删除，避免双重声音
  vibratePattern([150, 100, 150]); 
  sendNotification('该站起来走动了', '起身活动 2–3 分钟，下巴轻收 5 次'); 
}
function checkWalkReminder(force){ if (!force && !isInWalkWindow()) return; const last = parseInt(LS.get(WALK_LAST_KEY, '0') || '0', 10); const now = Date.now(); if (!force && now - last < 30 * 60 * 1000) return; LS.set(WALK_LAST_KEY, now); if (!_walkEndTs || _walkEndTs < now) startWalkTimer(200); sendNotification('该站起来走动了', '起身活动 2–3 分钟，下巴轻收 5 次'); }
function initWalkReminder(){ requestNotifPermission(); setTimeout(() => checkWalkReminder(false), 3000); if (_walkTimerHandle) clearInterval(_walkTimerHandle); _walkTimerHandle = setInterval(() => checkWalkReminder(false), 60 * 1000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkWalkReminder(false); }); }
function playBeep(){ try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; o.type = 'sine'; g.gain.setValueAtTime(0.3, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8); o.start(); o.stop(ctx.currentTime + 0.8); } catch(e){} }

function buildCalendarFromPlans(){
  const data = {}; 
  const saved = getManualTodos();
  Object.keys(saved).forEach(k => { data[k] = (saved[k]||[]).map(x => ({ ...x, manual:true })); });
  const statusMap = getTodoStatusMap();
  Object.entries(data).forEach(([date, items]) => { items.forEach(it => { if (statusMap[getTodoKey(date, it)]) it.done = true; }); });
  state.calendarData = data;
}

function fetchWeather(){
  const el1 = document.getElementById('homeWeather'); const el2 = document.getElementById('homeTemp');
  if (el1) el1.textContent = '☀️ 晴';
  if (el2) el2.textContent = '--℃';
}

(function init(){
  try {
    loadDataFromGlobals();
    buildCalendarFromPlans();
    LearnStore.checkIn();
    render();
    initWalkReminder();
    setTimeout(() => {
      try {
        if (window.AndroidBridge && window.AndroidBridge.getWidgetTimelineData) {
            const nativeJson = window.AndroidBridge.getWidgetTimelineData();
            if (nativeJson && nativeJson !== "[]") {
                const arr = JSON.parse(nativeJson);
                const checks = getChecks();
                let changed = false;
                arr.forEach(item => {
                    if (item.key && item.done && !checks[item.key]) {
                        checks[item.key] = true;
                        changed = true;
                    }
                });
                if (changed) { saveChecks(checks); render(); }
            }
        }
        syncToNativeWidget();
      } catch (e) { console.error('init widget sync error:', e); }
    }, 1200);
    setInterval(() => {
      const el = document.getElementById('sportTimer');
      if (el){}
    }, 1000);
  } catch (err) {
    var el = document.getElementById('fatal-error');
    if (el) {
        el.style.display = 'block';
        el.innerHTML = '启动失败：' + err.message + '<br><br>' + err.stack;
    }
  }
})();
</script>
