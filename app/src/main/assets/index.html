/* ===== 护肤品拍照 AI 识别（P16） ===== */
function nativePostJson(url, obj, timeout, headers){
  return new Promise((resolve, reject) => {
    if (!window.AndroidHttp || typeof window.AndroidHttp.httpPostJson !== 'function'){ reject(new Error('原生桥不可用')); return; }
    window.__nativeHttpCbs = window.__nativeHttpCbs || {};
    const id = 'h' + (window.__nativeHttpSeq = (window.__nativeHttpSeq || 0) + 1);
    const ms = timeout || 30000;
    const timer = setTimeout(() => { delete window.__nativeHttpCbs[id]; reject(new Error('AI 请求超时')); }, ms + 3000);
    window.__nativeHttpCbs[id] = res => {
      clearTimeout(timer); delete window.__nativeHttpCbs[id];
      try {
        const j = JSON.parse(res);
        if (!j.ok) reject(new Error('HTTP ' + (j.status || 0) + (j.error ? ' ' + j.error : '')));
        else resolve(j.body);
      } catch(e){ reject(new Error('原生桥返回异常')); }
    };
    try { window.AndroidHttp.httpPostJson(url, JSON.stringify(obj), JSON.stringify(headers || {}), id); }
    catch(e){ clearTimeout(timer); delete window.__nativeHttpCbs[id]; reject(e); }
  });
}
function hasNativePost(){ return !!(window.AndroidHttp && typeof window.AndroidHttp.httpPostJson === 'function'); }
async function aiPostJSON(url, body, timeout, apiKey){
  const headers = { 'Content-Type':'application/json' };
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  if (hasNativePost()){
    try { return JSON.parse(await nativePostJson(url, body, timeout, headers)); }
    catch(e){ console.warn('[AI] 原生桥失败，改用 WebView fetch', e.message); }
  }
  const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), timeout || 30000);
  try {
    const r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body), signal: controller.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

  if (AI.provider === 'deepseek') throw new Error('DeepSeek 不支持读图，请把 AI 服务商切换成通义千问或智谱 GLM');
  const cfg = AI.endpoints()[AI.provider];

async function fetchQuoteOfDay(){
  // 四个在线源依次尝试，全部失败才抛错（不内置任何句子）
  const sources = [
    async () => {
      const d = await raceTimeout(fetchJson('https://zenquotes.io/api/random', 6000), 7000);
      if (!Array.isArray(d) || !d[0] || !d[0].q) throw new Error('无内容');
      return { text: d[0].q, author: d[0].a || 'Unknown', src: 'ZenQuotes' };
    },
    async () => {
      const d = await raceTimeout(fetchJson('https://dummyjson.com/quotes/random', 6000), 7000);
      if (!d || !d.quote) throw new Error('无内容');
      return { text: d.quote, author: d.author || 'Unknown', src: 'QuoteDB' };
    },
    async () => {
      const d = await raceTimeout(fetchJson('https://api.adviceslip.com/advice', 6000), 7000);
      if (!d || !d.slip || !d.slip.advice) throw new Error('无内容');
      return { text: d.slip.advice, author: 'Advice Slip', src: 'AdviceSlip' };
    },
    async () => {
      const d = await raceTimeout(fetchJson('https://uselessfacts.jsph.pl/api/v2/facts/random?language=en', 7000), 8000);
      if (!d || !d.text) throw new Error('无内容');
      return { text: d.text, author: 'Useless Facts', src: 'UselessFacts' };
    },
    async () => {
      const d = await tianapiFetch(`https://apis.tianapi.com/enmaxim/index?key=${TIANAPI}`, 6000);
      if (d.code !== 200 || !d.result || !d.result.en) throw new Error('无内容');
      return { text: d.result.en, author: '格言库', src: '天聚格言', cn: d.result.zh || '' };
    }
  ];
  for (let i = 0; i < sources.length; i++){
    try {
      const r = await sources[i]();
      if (!r || !r.text) continue;
      let cn = r.cn || '';
      if (!cn){ try { cn = await translateToChinese(r.text); } catch(e){} }
      return { text: r.text, author: r.author, cn: cn, src: r.src };
    } catch(e){}
  }
  throw new Error('名言接口全部不可用');
}
async function fetchStoryOfDay(){
  // ① PoetryDB：随机一首短诗（14 行，公版英文诗，可朗读可翻译）
  try {
    let titles = CacheStore.load('poetry-titles');
    if (!titles || !titles.length || CacheStore.shouldRefresh('poetry-titles')){
      const d = await raceTimeout(fetchJson('https://poetrydb.org/linecount/14/title', 9000), 11000);
      titles = (Array.isArray(d) ? d : []).map(x => x && x.title).filter(t => t && t.indexOf('/') < 0 && t.length < 60);
      if (titles.length) CacheStore.save('poetry-titles', titles);
    }
    if (titles && titles.length){
      const pick = titles[Math.floor(Math.random() * titles.length)];
      const p = await raceTimeout(fetchJson('https://poetrydb.org/title/' + encodeURIComponent(pick) + '/lines,author,title', 9000), 11000);
      const poem = Array.isArray(p) ? p[0] : null;
      if (poem && Array.isArray(poem.lines) && poem.lines.length >= 4){
        const text = poem.lines.join('\n').trim().slice(0, 900);
        let cn = '';
        try { cn = await translateToChinese(text.slice(0, 450)); } catch(e){}
        return { title: poem.title + (poem.author ? ' · ' + poem.author : ''), text: text, cn: cn, src: 'PoetryDB' };
      }
    }
  } catch(e){}
  // ② UselessFacts：英文冷知识短文
  try {
    const d = await raceTimeout(fetchJson('https://uselessfacts.jsph.pl/api/v2/facts/random?language=en', 8000), 9000);

      let cn = '';
      try { cn = await translateToChinese(d.text); } catch(e){}
      return { title: 'Today I Learned', text: d.text, cn: cn, src: 'UselessFacts' };
    }
  } catch(e){}
  // ③ AdviceSlip：英文短语
  try {
    const d = await raceTimeout(fetchJson('https://api.adviceslip.com/advice', 6000), 7000);
    if (d && d.slip && d.slip.advice){

      return { title: 'A Piece of Advice', text: d.slip.advice, cn: cn, src: 'AdviceSlip' };
    }
  } catch(e){}
  throw new Error('短文接口全部不可用');
}

function exprStats(){
  const hist = LS.get('expr-history', []);
  const scores = hist.map(h => h.score).filter(s => typeof s === 'number');
  let weekDays = 0, monthDays = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(Date.now() - i * 86400000); if (LS.get('expr-done:' + localDateStr(d), false)) weekDays++; }
  for (let i = 0; i < 30; i++){ const d = new Date(Date.now() - i * 86400000); if (LS.get('expr-done:' + localDateStr(d), false)) monthDays++; }
  return { weekDays, monthDays, avg: scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0, best: scores.length ? Math.max.apply(null, scores) : 0, count: scores.length };
}

/* 抓取逻辑（与旧版一致：缓存 7 天 → 串行抓取 → 二轮重试），返回 {html, ck} */
async function recBodyHTML(cat, offset){
  const catEmoji = { '科学':'🔬','历史':'🏛️','人物':'👤','文化':'🏮','电影':'🎬','电视':'📺','纪录片':'🎞️','书':'📖','播客':'🎙️','APP':'📱' };
  if (cat === '电影' || cat === '电视'){
    const eps = cat === '电影' ? [['movie','本周口碑电影榜']] : [['tv_chinese','本周华语剧集榜'],['tv_global','本周全球剧集榜']];
    const ck = recCacheKey(cat, offset);
    let groups = CacheStore.loadFresh(ck, 7);
    if (!groups){
      const tryFetch = async () => {
        const rs = [];
        for (const ep of eps){
          try { rs.push({ label: ep[1], list: await fetchDoubanWeekly(ep[0]) }); } catch(e){ console.warn('榜单接口失败：' + ep[0], e); }
          if (eps.length > 1) await new Promise(r => setTimeout(r, 1200));
        }
        return rs;
      };
      groups = await tryFetch();
      if (!groups.length){ await new Promise(r => setTimeout(r, 3000)); groups = await tryFetch(); }
      if (groups.length) CacheStore.save(ck, groups);
    }
    if (!groups || !groups.length) return { html: recErrorCard('获取榜单失败，请检查网络后重试', 'refreshRecList'), ck };
    return { html: recRenderDouban(cat, groups), ck };
  }
  if (cat === '播客'){
    const term = PODCAST_TERMS[(WEEK + offset) % PODCAST_TERMS.length];
    const ck = recCacheKey(cat, offset);
    let list = CacheStore.loadFresh(ck, 7);
    if (!list){ try { list = await fetchPodcasts(term, 8); CacheStore.save(ck, list); } catch(e){ console.warn('播客接口失败', e); } }
    if (!list || !list.length) return { html: recErrorCard('获取播客失败，请检查网络后重试', 'refreshRec'), ck };
    return { html: recRenderPodcast(term, list), ck };
  }
  if (cat === 'APP'){
    const page = (DAY + offset) % 3;
    const ck = recCacheKey(cat, offset);
    let list = CacheStore.loadFresh(ck, 7);
    if (!list){ try { list = await fetchAppArticles(10, page); CacheStore.save(ck, list); } catch(e){ console.warn('应用推荐接口失败', e); } }
    if (!list || !list.length) return { html: recErrorCard('获取应用推荐失败，请检查网络后重试', 'refreshRec'), ck };
    return { html: recRenderApp(list), ck };
  }
  const topics = DISCOVER_TOPICS[cat] || [];
  const startIdx = topics.length ? (DAY + offset) % topics.length : 0;
  const ck = recCacheKey(cat, offset);
  let item = CacheStore.loadFresh(ck, 7);
  if (!item){
    for (let t = 0; t < Math.min(4, topics.length) && !item; t++){
      if (t > 0) await new Promise(r => setTimeout(r, 1500));
      const topic = topics[(startIdx + t) % topics.length];
      try {
        item = await raceTimeout(fetchBaikeItem(topic), 9000);
        if (item) CacheStore.save(ck, item);
      } catch(e){ console.warn('百科接口失败：' + topic, e); }
    }
  }
  if (!item) return { html: recErrorCard('获取失败，请检查网络后重试', 'refreshRec'), ck };
  return { html: recRenderBaike(cat, item), ck };
}
async function recommendSection(){
  const catList = ['科学','历史','人物','文化','电影','电视','纪录片','书','播客','APP'];
  const catEmoji = { '科学':'🔬','历史':'🏛️','人物':'👤','文化':'🏮','电影':'🎬','电视':'📺','纪录片':'🎞️','书':'📖','播客':'🎙️','APP':'📱' };
  // 每周自动换一个推荐主题，默认只展示这一个分类（不再铺 10 个标签）
  const weekIdx = ((WEEK % catList.length) + catList.length) % catList.length;
  const weekCat = catList[weekIdx];
  const todayCat = catList.includes(state.recommendCat) ? state.recommendCat : weekCat;
  const offset = state.recOffset || 0;
  const showAll = !!state.recShowAll;
  const chips = `<div class="card" style="margin-bottom:10px;background:linear-gradient(135deg,#EFF5FF,#F7FAFF);border:1px solid #DDE8FF;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div><div style="font-size:11px;letter-spacing:1px;font-weight:750;color:#6B84C4;">本周推荐 · 每周换一个</div>
        <div style="font-size:19px;font-weight:850;color:#1D4ED8;margin-top:3px;">${catEmoji[todayCat]||'📌'} ${esc(todayCat)}</div>
        <div style="font-size:11.5px;color:var(--sub);margin-top:3px;">本周第 ${weekIdx+1} 个主题 · 内容每天更新</div></div>
        <button class="link-btn" data-act="recToggleCats" style="font-size:12px;white-space:nowrap;">${showAll?'收起 ▲':'其他分类 ▾'}</button>
      </div>
    </div>${showAll ? `<div class="chips" style="flex-wrap:wrap;margin-bottom:10px;">${catList.map(c => `<button class="chip ${c===todayCat?'on':''}" data-act="recCat" data-cat="${esc(c)}">${catEmoji[c]||'📌'} ${esc(c)}</button>`).join('')}</div>` : ''}`;
  const ck = recCacheKey(todayCat, offset);
  // ① 有缓存：同步出内容，零等待
  const cached = CacheStore.loadFresh(ck, 7);
  if (cached){
    let html = '';
    if (todayCat === '电影' || todayCat === '电视') html = recRenderDouban(todayCat, cached);
    else if (todayCat === '播客') html = recRenderPodcast(PODCAST_TERMS[(WEEK + offset) % PODCAST_TERMS.length], cached);
    else if (todayCat === 'APP') html = recRenderApp(cached);
    else html = recRenderBaike(todayCat, cached);
    return chips + cacheTag(ck) + `<div id="recBody">${html}</div>`;
  }
  // ② 无缓存：骨架立即渲染，后台抓取，完成后只更新内容区（不整页重渲染）
  const key = ck + '|' + offset;
  if (!state.recInflight || state.recInflight.key !== key){
    state.recInflight = { key };
    recBodyHTML(todayCat, offset).then(({ html, ck: usedCk }) => {
      if (state.recInflight && state.recInflight.key === key) state.recInflight = null;
      const el = document.getElementById('recBody');
      if (el && state.tab === 'study' && state.studySub === 'recommend') el.innerHTML = (cacheTag(usedCk) || '') + html;
    }).catch(e => {
      if (state.recInflight && state.recInflight.key === key) state.recInflight = null;
      const el = document.getElementById('recBody');
      if (el) el.innerHTML = recErrorCard('获取失败，请检查网络后重试', 'refreshRec');
    });
  }
  return chips + `<div id="recBody">${recSkeleton()}</div>`;
}

function setNotes(a){ LS.set('app_notes', a); }
function noteTime(ts){ const d = new Date(ts); const p = n => String(n).padStart(2,'0'); return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function noteDayLabel(dateStr){ const t = Date.parse(dateStr+'T00:00:00'); const today = Date.parse(todayStr()+'T00:00:00'); const diff = Math.round((today - t)/86400000); if (diff === 0) return '今天'; if (diff === 1) return '昨天'; if (diff > 1) return diff + ' 天前'; if (diff === -1) return '明天'; return Math.abs(diff) + ' 天后'; }

function toolsView(){
  const sub = state.toolsSub || 'home';
  const modules = [
    { id:'notes', icon:'📝', color:'#B8860B', bg:'#FFF3D6', label:'随手记', desc:'心情 · 灵感 · 照片', count:(getNotes()||[]).length },
    { id:'eat', icon:'🍜', color:'#DC2626', bg:'#FDECEC', label:'探店打卡', desc:'餐厅 · 评分 · 推荐菜', count:(getEats()||[]).length },
    { id:'film', icon:'🎬', color:'#7C3AED', bg:'#F1E9FE', label:'影视·书·剧', desc:'想看 / 已看评分', count:(getMedia()||[]).length },
    { id:'bucket', icon:'🎯', color:'#DB2777', bg:'#FCE7F3', label:'人生体验', desc:'想做的事 · 清单', count:(getBucket()||[]).filter(function(b){ return !b.done; }).length },
    { id:'wish', icon:'🎁', color:'#F97316', bg:'#FFF1E6', label:'心愿单', desc:'想要的 / 要送的', count:(getWishes()||[]).length },
    { id:'asset', icon:'📦', color:'#0E7490', bg:'#E0F2F7', label:'物品资产', desc:'家电 · 数码 · 花费', count:(getAssets()||[]).length },
    { id:'footprint', icon:'📍', color:'#1D4ED8', bg:'#E8F0FF', label:'足迹', desc:'去过的城市', count:(getFootprints()||[]).length },
    { id:'grow', icon:'🌱', color:'#12A08A', bg:'#E4F5F0', label:'养成', desc:'重新养一遍自己', count:null },
    { id:'ai', icon:'🤖', color:'#0E9F6E', bg:'#E4F5F0', label:'AI 助手', desc:'通用问答', count:null },
  ];
  if (sub === 'home'){
    const cells = modules.map(function(m){
      const badge = (m.count == null) ? '' : (m.count ? `<span class="tool-badge">${m.count}</span>` : '');
      return `<button class="tool-cell" data-act="toolsSub" data-sub="${m.id}" style="--tc:${m.color};--tbg:${m.bg};">
        <span class="tool-ico">${m.icon}</span>
        <span class="tool-name">${m.label}</span>
        <span class="tool-desc">${m.desc}</span>
        ${badge}
      </button>`;
    }).join('');
    return `<div class="hero-sm"><h1>工具箱</h1></div>
      <p class="muted" style="margin:-4px 4px 14px;font-size:12.5px;line-height:1.5;">点开下面的工具，随手记录生活点滴 ✨</p>
      <div class="tool-grid">${cells}</div>`;
  }
  const cur = modules.find(function(m){ return m.id === sub; }) || modules[0];
  let content = '';
  try {
    if (sub === 'notes') content = notesSection();
    else if (sub === 'eat') content = eatSection();
    else if (sub === 'film') content = filmSection();
    else if (sub === 'bucket') content = bucketSection();
    else if (sub === 'wish') content = wishSection();
    else if (sub === 'asset') content = assetSection();
    else if (sub === 'footprint') content = footprintSection();
    else if (sub === 'grow') content = growSection();
    else if (sub === 'ai') content = aiChatSection();
  } catch(e){ console.error(e); content = `<div class="tip-card">加载失败：${esc(e.message)}</div>`; }
  return `<div class="tool-bar"><button class="tool-back" data-act="toolsHome">‹ 工具箱</button><span class="tool-cur">${cur.icon} ${cur.label}</span></div>
    <div class="tool-page">${content}</div>`;
}
function toolStub(emoji, title, desc){ return `<div class="empty-state" style="margin-top:30px;"><div class="es-icon">${emoji}</div><div class="es-title">${title}</div><div class="es-desc">${desc} 🚧</div></div>`; }

function notesSection(){
  const notes = (getNotes()||[]).slice().sort(function(a,b){ return b.ts - a.ts; });
  const allTags = Array.from(new Set((notes||[]).flatMap(function(n){ return n.tags||[]; })));
  const ftag = state.noteFilterTag || '';
  const shown = notes.filter(function(n){ if (ftag && !(n.tags||[]).includes(ftag)) return false; return true; });
  const draft = state.noteDraftPhotos || [];
  const groups = {};
  shown.forEach(function(n){ (groups[n.date] = groups[n.date] || []).push(n); });
  const dates = Object.keys(groups).sort(function(a,b){ return a < b ? 1 : -1; });
  const noteCard = function(n){
    const hay = ((n.text||'') + ' ' + (n.tags||[]).join(' '));
    const photosHtml = (n.photos && n.photos.length) ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;">${n.photos.map(function(p){ return `<img src="${readImageFromNative(p.path||p)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;">`; }).join('')}</div>` : '';
    const tagsHtml = (n.tags && n.tags.length) ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">${n.tags.map(function(t){ return `<span style="font-size:12px;background:#FFF3D6;color:#B8860B;padding:3px 9px;border-radius:20px;">#${esc(t)}</span>`; }).join('')}</div>` : '';
    return `<div class="note-card" data-hay="${esc(hay)}" style="background:#fff;border:1px solid #eee;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);">
      ${n.text ? `<div style="font-size:14px;line-height:1.6;white-space:pre-wrap;color:#2b3244;">${esc(n.text)}</div>` : ''}
      ${photosHtml}
      ${tagsHtml}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:#9aa0b2;"><span>${noteTime(n.ts)}</span><button class="link-btn" data-act="delNote" data-id="${n.id}">删除</button></div>
    </div>`;
  };
  const timeline = dates.length ? dates.map(function(d){ return `<div style="font-size:12px;font-weight:800;color:#8a6d3b;margin:14px 2px 8px;letter-spacing:.5px;">${d} · ${noteDayLabel(d)}</div>` + groups[d].map(noteCard).join(''); }).join('') : `<div class="empty-state" style="margin-top:20px;"><div class="es-icon">📝</div><div class="es-title">还没有记录</div><div class="es-desc">写下第一条随手记吧</div></div>`;
  const draftHtml = draft.length ? `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;">${draft.map(function(p,i){ return `<div style="position:relative;width:100%;aspect-ratio:1;"><img src="${readImageFromNative(p)}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;"><button class="ndi-x" data-act="delNoteDraftImg" data-i="${i}" style="position:absolute;top:2px;right:2px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;">✕</button></div>`; }).join('')}</div>` : '';
  return `
  <div class="card" style="background:#FFFDF7;border:1px solid #F0E6C8;">
    <div style="font-size:13px;font-weight:800;color:#B8860B;margin-bottom:8px;">✍️ 写一条随手记</div>
    <textarea id="noteInput" class="answer-input" style="min-height:64px;background:#fff;" placeholder="今天的心情、灵感、发生的事…"></textarea>
    <input type="text" id="noteTags" placeholder="标签，用空格分隔（如 旅行 美食）" style="margin-top:8px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;background:#fff;">
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
      <label class="btn ghost" style="margin:0;position:relative;overflow:hidden;padding:9px 14px;font-size:13px;">📷 加照片<input type="file" id="notePhoto" accept="image/*" style="position:absolute;inset:0;opacity:0;"></label>
      <span class="muted" style="font-size:12px;">${draft.length ? draft.length + ' 张' : ''}</span>
      <button class="btn primary" style="margin:0;margin-left:auto;padding:9px 18px;font-size:14px;" data-act="saveNote">保存</button>
    </div>
    ${draftHtml}
  </div>
  <input type="text" id="noteSearch" placeholder="🔍 搜索文字或标签" style="margin:14px 0 4px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;box-sizing:border-box;background:#fff;">
  ${allTags.length ? `<div style="margin:6px 0 10px;display:flex;flex-wrap:wrap;gap:6px;">${allTags.map(function(t){ return `<button class="ntag" data-act="noteFilterTag" data-tag="${esc(t)}" style="font-size:12px;background:${t===ftag?'#B8860B':'#FFF3D6'};color:${t===ftag?'#fff':'#B8860B'};padding:3px 10px;border-radius:20px;border:0;">#${esc(t)}</button>`; }).join('')}</div>` : ''}
  ${timeline}`;
}

async function handleToolsAction(act, t, e){
  if (act === 'toolsSub'){ state.toolsSub = t.dataset.sub; render(); return true; }
  if (act === 'toolsHome'){ state.toolsSub = 'home'; render(); return true; }
  if (act === 'saveNote'){
    const ta = document.getElementById('noteInput'); const tg = document.getElementById('noteTags');
    const text = (ta && ta.value || '').trim();
    const tags = (tg && tg.value || '').trim().split(/\s+/).filter(Boolean);
    const photos = (state.noteDraftPhotos || []).map(function(p){ return { path:p }; });
    if (!text && !photos.length){ toast('写点什么或加张照片吧'); return true; }
    const notes = getNotes();
    notes.push({ id:'n'+Date.now(), ts:Date.now(), date:todayStr(), text:text, tags:tags, photos:photos });
    setNotes(notes); state.noteDraftPhotos = [];
    toast('已保存 📝'); render(); return true;
  }
  if (act === 'delNote'){
    const id = t.dataset.id; if (!confirm('删除这条随手记？')) return true;
    setNotes(getNotes().filter(function(n){ return n.id !== id; }));
    render(); return true;
  }
  if (act === 'delNoteDraftImg'){
    const i = Number(t.dataset.i); if (state.noteDraftPhotos) state.noteDraftPhotos.splice(i,1); render({ keepScroll:true }); return true;
  }
  if (act === 'noteFilterTag'){
    const tag = t.dataset.tag; state.noteFilterTag = (state.noteFilterTag === tag) ? '' : tag; render(); return true;
  }
  return false;
}

function daysBetween(d1, d2){ const a = Date.parse((d1||todayStr())+'T00:00:00'); const b = Date.parse((d2||todayStr())+'T00:00:00'); return Math.max(1, Math.round(Math.abs(a - b)/86400000)); }

function assetSection(){
  const items = (getAssets()||[]).slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  const total = items.reduce(function(s,i){ return s + (parseFloat(i.price)||0); }, 0);
  const daily = items.reduce(function(s,i){ return s + (parseFloat(i.price)||0)/daysBetween(i.date, todayStr()); }, 0);
  const cats = ['家电','数码','家具','服饰','其他'];
  const form = `<div class="card"><div style="font-size:13px;font-weight:800;margin-bottom:8px;">➕ 添加一件物品</div>
    <input id="asName" placeholder="名称，如 扫地机器人" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;margin-bottom:7px;">
    <div style="display:flex;gap:7px;margin-bottom:7px;"><select id="asCat" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;font:inherit;">${cats.map(function(c){ return '<option>'+c+'</option>'; }).join('')}</select><input id="asDate" type="date" value="${todayStr()}" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;font:inherit;"></div>
    <div style="display:flex;gap:7px;margin-bottom:9px;"><input id="asPrice" type="number" inputmode="decimal" placeholder="购买金额 ¥" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;"><input id="asLife" type="number" inputmode="decimal" placeholder="预计寿命(年,选填)" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;"></div>
    <button class="btn primary" style="width:100%;" data-act="saveAsset">保存</button></div>`;
  const stats = `<div class="stats" style="grid-template-columns:repeat(2,1fr);margin:12px 0;"><div class="stat"><div class="v">¥${total.toFixed(0)}</div><div class="k">累计购入</div></div><div class="stat"><div class="v">¥${daily.toFixed(1)}</div><div class="k">日均花费(估)</div></div></div>`;
  const list = items.length ? items.map(function(i){
    const price = parseFloat(i.price)||0; const days = daysBetween(i.date, todayStr()); const dc = price/days; const life = parseFloat(i.life);
    let lifeTip = '';
    if (life > 0){ const left = life*365 - days; lifeTip = (left>0?('剩余约 '+Math.round(left)+' 天'):('已超期 '+Math.round(-left)+' 天')) + '（年均 ¥'+(price/Math.max(life,0.1)).toFixed(0)+'）'; }
    return `<div style="background:#fff;border:1px solid #eee;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:750;color:#2b3244;">${esc(i.name)}</div><div style="font-size:12px;color:var(--sub);margin-top:2px;">${esc(i.cat||'其他')} · ${i.date||''}</div></div><button class="link-btn" data-act="delAsset" data-id="${i.id}">删除</button></div>
      <div style="display:flex;gap:14px;margin-top:6px;font-size:12.5px;"><div><b style="color:#2b3244;">¥${price.toFixed(2)}</b></div><div style="color:var(--sub);">已用 ${days} 天</div><div style="color:#B8860B;font-weight:700;">日均 ¥${dc.toFixed(2)}</div></div>
      ${lifeTip?`<div style="font-size:11.5px;color:#9aa0b2;margin-top:3px;">${lifeTip}</div>`:''}
    </div>`;
  }).join('') : `<div class="empty-state" style="margin-top:14px;"><div class="es-icon">📦</div><div class="es-title">还没有记录</div><div class="es-desc">记下家电/数码的购买信息，看看每天花多少</div></div>`;
  return form + stats + list;
}

function filmSection(){
  const list = (getMedia()||[]).slice().sort(function(a,b){ return b.ts - a.ts; });
  const ft = state.filmFilter || 'all';
  const shown = list.filter(function(m){ return ft==='all' || m.status===ft; });
  const label = { want:'想看', watching:'在看', done:'已看' };
  const form = `<div class="card"><div style="font-size:13px;font-weight:800;margin-bottom:8px;">➕ 添加一部作品</div>
    <input id="fmTitle" placeholder="名称，如 《奥本海默》/《三体》" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;margin-bottom:7px;">
    <div style="display:flex;gap:7px;margin-bottom:7px;"><select id="fmType" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;font:inherit;"><option value="电影">电影</option><option value="剧集">剧集</option><option value="书">书</option></select><select id="fmStatus" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;font:inherit;"><option value="want">想看</option><option value="watching">在看</option><option value="done">已看</option></select></div>
    <input id="fmNote" placeholder="备注/短评（选填）" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;margin-bottom:8px;">
    <button class="btn primary" style="width:100%;" data-act="saveMedia">保存</button></div>`;
  const chips = `<div style="display:flex;gap:6px;margin:12px 0 8px;">${[{id:'all',t:'全部'},{id:'want',t:'想看'},{id:'watching',t:'在看'},{id:'done',t:'已看'}].map(function(s){ return '<button data-act="filmFilter" data-f="'+s.id+'" style="font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid '+(ft===s.id?'var(--pri)':'var(--line)')+';background:'+(ft===s.id?'var(--pri)':'#fff')+';color:'+(ft===s.id?'#fff':'#555')+';">'+s.t+'</button>'; }).join('')}</div>`;
  const stars = function(n){ let s=''; for (var k=1;k<=5;k++) s += (k<=n?'★':'☆'); return s; };
  const items = shown.length ? shown.map(function(m){
    const right = m.status==='done' ? '<span style="color:#F5A623;font-size:14px;">'+stars(m.rating||0)+'</span>' : '<span style="font-size:11.5px;color:#9aa0b2;">'+label[m.status]+'</span>';
    const rateBtns = m.status==='done' ? '' : '<div style="margin-top:6px;display:flex;gap:6px;"><button class="link-btn" data-act="rateMedia" data-id="'+m.id+'" data-r="5">★5</button><button class="link-btn" data-act="rateMedia" data-id="'+m.id+'" data-r="4">★4</button><button class="link-btn" data-act="rateMedia" data-id="'+m.id+'" data-r="3">★3</button></div>';
    return `<div style="background:#fff;border:1px solid #eee;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;"><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:750;color:#2b3244;">${esc(m.title)}</div><div style="font-size:12px;color:var(--sub);margin-top:2px;">${esc(m.type||'')}${m.note?(' · '+esc(m.note)):''}</div></div>${right}<button class="link-btn" data-act="delMedia" data-id="${m.id}">✕</button></div>${rateBtns}</div>`;
  }).join('') : `<div class="empty-state" style="margin-top:14px;"><div class="es-icon">🎬</div><div class="es-title">还没有作品</div><div class="es-desc">想看/在看/已看，一键记录</div></div>`;
  return form + chips + items;
}

function wishSection(){
  const list = (getWishes()||[]).slice().sort(function(a,b){ return b.ts - a.ts; });
  const unbought = list.filter(function(w){ return !w.bought; });
  const sum = unbought.reduce(function(s,w){ return s + (parseFloat(w.price)||0); }, 0);
  const form = `<div class="card"><div style="font-size:13px;font-weight:800;margin-bottom:8px;">➕ 添加一个心愿</div>
    <input id="wTitle" placeholder="想要什么，如 降噪耳机" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;margin-bottom:7px;">
    <div style="display:flex;gap:7px;margin-bottom:7px;"><input id="wPrice" type="number" inputmode="decimal" placeholder="预估 ¥(选填)" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;"><select id="wPri" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;font:inherit;"><option value="中">优先级 中</option><option value="高">优先级 高</option><option value="低">优先级 低</option></select></div>
    <input id="wFor" placeholder="送给谁/场合（选填），如 妈妈生日" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box;margin-bottom:8px;">
    <button class="btn primary" style="width:100%;" data-act="saveWish">保存</button></div>`;
  const stat = `<div style="background:#FFF7ED;border:1px solid #FDE2C4;border-radius:14px;padding:12px;margin:12px 0;"><div style="font-size:22px;font-weight:850;color:#C2410C;">¥${sum.toFixed(0)}</div><div style="font-size:12px;color:#9a6b43;">未买心愿合计（${unbought.length} 件）</div></div>`;
  const items = list.length ? list.map(function(w){
    const priTag = { 高:'🔴 高', 中:'🟡 中', 低:'🟢 低' }[w.pri||'中'];
    return `<div style="background:#fff;border:1px solid #eee;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);${w.bought?'opacity:.55;':''}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;"><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:750;color:#2b3244;${w.bought?'text-decoration:line-through;':''}">${esc(w.title)}</div><div style="font-size:12px;color:var(--sub);margin-top:2px;">${w.price?('¥'+parseFloat(w.price).toFixed(0)+' · '):''}${priTag}${w.for?(' · '+esc(w.for)):''}</div></div><button class="link-btn" data-act="delWish" data-id="${w.id}">✕</button></div><div style="margin-top:8px;"><button class="btn ghost" style="font-size:12px;padding:6px 12px;" data-act="toggleWish" data-id="${w.id}">${w.bought?'↺ 标记未买':'✓ 已买'}</button></div></div>`;

async function handleToolsAction(act, t, e){
  if (act === 'toolsSub'){ state.toolsSub = t.dataset.sub; render(); return true; }
  if (act === 'toolsHome'){ state.toolsSub = 'home'; render(); return true; }
  if (act === 'saveNote'){
    const ta = document.getElementById('noteInput'); const tg = document.getElementById('noteTags');
    const text = (ta && ta.value || '').trim();
    const tags = (tg && tg.value || '').trim().split(/\s+/).filter(Boolean);
    const photos = (state.noteDraftPhotos || []).map(function(p){ return { path:p }; });
    if (!text && !photos.length){ toast('写点什么或加张照片吧'); return true; }
    const notes = getNotes();
    notes.push({ id:'n'+Date.now(), ts:Date.now(), date:todayStr(), text:text, tags:tags, photos:photos });
    setNotes(notes); state.noteDraftPhotos = [];
    toast('已保存 📝'); render(); return true;
  }
  if (act === 'delNote'){ const id = t.dataset.id; if (!confirm('删除这条随手记？')) return true; setNotes(getNotes().filter(function(n){ return n.id !== id; })); render(); return true; }
  if (act === 'delNoteDraftImg'){ const i = Number(t.dataset.i); if (state.noteDraftPhotos) state.noteDraftPhotos.splice(i,1); render({ keepScroll:true }); return true; }
  if (act === 'noteFilterTag'){ const tag = t.dataset.tag; state.noteFilterTag = (state.noteFilterTag === tag) ? '' : tag; render(); return true; }
  if (act === 'saveEat'){
    const name = (document.getElementById('eatName').value||'').trim();
    if (!name){ toast('填个店名'); return true; }
    const photos = (state.eatDraftPhotos || []).map(function(p){ return { path:p }; });
    const el = function(id){ const x = document.getElementById(id); return x ? x.value : ''; };
    const list = getEats();
    list.push({ id:'e'+Date.now(), ts:Date.now(), name:name, type:el('eatType')||'其他', rating:Number(el('eatRating'))||0, per:parseFloat(el('eatPer'))||0, dish:(el('eatDish')||'').trim(), note:(el('eatNote')||'').trim(), photos:photos });
    setEats(list); state.eatDraftPhotos = []; toast('已记录 🍜'); render(); return true;
  }
  if (act === 'delEat'){ const id = t.dataset.id; if (!confirm('删除这家店？')) return true; setEats(getEats().filter(function(x){ return x.id !== id; })); render(); return true; }
  if (act === 'delEatDraftImg'){ const i = Number(t.dataset.i); if (state.eatDraftPhotos) state.eatDraftPhotos.splice(i,1); render({ keepScroll:true }); return true; }
  if (act === 'eatFilter'){ const f = t.dataset.f; state.eatFilter = (state.eatFilter === f ? 'all' : f); render(); return true; }
  if (act === 'saveBucket'){
    const el = function(id){ const x = document.getElementById(id); return x ? x.value : ''; };
    const title = (el('bkTitle')||'').trim();
    if (!title){ toast('写点想做的事'); return true; }
    const list = getBucket();
    list.push({ id:'b'+Date.now(), ts:Date.now(), title:title, cat:el('bkCat')||'其他', done:false, note:(el('bkNote')||'').trim() });
    setBucket(list); toast('已加入清单 🎯'); render(); return true;
  }
  if (act === 'delBucket'){ const id = t.dataset.id; if (!confirm('删除这条？')) return true; setBucket(getBucket().filter(function(x){ return x.id !== id; })); render(); return true; }
  if (act === 'toggleBucket'){ const id = t.dataset.id; const list = getBucket(); const x = list.find(function(y){ return y.id === id; }); if (x){ x.done = !x.done; x.doneDate = x.done ? todayStr() : ''; } setBucket(list); render(); return true; }
  if (act === 'saveAsset'){
    const name = (document.getElementById('asName').value||'').trim();
    const price = parseFloat(document.getElementById('asPrice').value||'0');
    if (!name || isNaN(price) || price <= 0){ toast('填名称和金额'); return true; }
    const items = getAssets();
    items.push({ id:'a'+Date.now(), name:name, cat:document.getElementById('asCat').value, date:document.getElementById('asDate').value||todayStr(), price:price, life:parseFloat(document.getElementById('asLife').value||'0')||0 });
    setAssets(items); toast('已添加 📦'); render(); return true;
  }
  if (act === 'delAsset'){ const id = t.dataset.id; if (!confirm('删除？')) return true; setAssets(getAssets().filter(function(i){ return i.id !== id; })); render(); return true; }
  if (act === 'saveMedia'){
    const title = (document.getElementById('fmTitle').value||'').trim();
    if (!title){ toast('填作品名'); return true; }
    const list = getMedia();
    list.push({ id:'m'+Date.now(), ts:Date.now(), title:title, type:document.getElementById('fmType').value, status:document.getElementById('fmStatus').value, rating:0, note:(document.getElementById('fmNote').value||'').trim() });
    setMedia(list); toast('已添加 🎬'); render(); return true;
  }
  if (act === 'delMedia'){ const id = t.dataset.id; if (!confirm('删除？')) return true; setMedia(getMedia().filter(function(m){ return m.id !== id; })); render(); return true; }
  if (act === 'rateMedia'){ const id = t.dataset.id; const r = Number(t.dataset.r); const list = getMedia(); const m = list.find(function(x){ return x.id === id; }); if (m){ m.rating = r; m.status = 'done'; } setMedia(list); render(); return true; }
  if (act === 'filmFilter'){ state.filmFilter = t.dataset.f; render(); return true; }
  if (act === 'saveWish'){
    const title = (document.getElementById('wTitle').value||'').trim();
    if (!title){ toast('填心愿'); return true; }
    const list = getWishes();
    list.push({ id:'w'+Date.now(), ts:Date.now(), title:title, price:parseFloat(document.getElementById('wPrice').value||'0')||0, pri:document.getElementById('wPri').value, for:(document.getElementById('wFor').value||'').trim(), bought:false });
    setWishes(list); toast('已添加 🎁'); render(); return true;
  }
  if (act === 'delWish'){ const id = t.dataset.id; if (!confirm('删除？')) return true; setWishes(getWishes().filter(function(w){ return w.id !== id; })); render(); return true; }
  if (act === 'toggleWish'){ const id = t.dataset.id; const list = getWishes(); const w = list.find(function(x){ return x.id === id; }); if (w) w.bought = !w.bought; setWishes(list); render(); return true; }
  if (act === 'saveFootprint'){
    const city = (document.getElementById('fpCity').value||'').trim();
    if (!city){ toast('填城市/地点'); return true; }
    const list = getFootprints();
    list.push({ id:'f'+Date.now(), city:city, date:document.getElementById('fpDate').value||todayStr(), with:(document.getElementById('fpWith').value||'').trim(), note:(document.getElementById('fpNote').value||'').trim() });
    setFootprints(list); toast('已打卡 📍'); render(); return true;
  }
  if (act === 'delFootprint'){ const id = t.dataset.id; if (!confirm('删除？')) return true; setFootprints(getFootprints().filter(function(f){ return f.id !== id; })); render(); return true; }
  if (act === 'aiSend2'){
    const input = document.getElementById('aiInput2'); const q = (input && input.value || '').trim(); if (!q) return true;
    const msgs = getAIChat(); msgs.push({ role:'user', content:q }); setAIChat(msgs);
    if (!AI.enabled()){ msgs.push({ role:'bot', content:'请先在「我的 → 设置 → AI」里配置好 AI 服务商。' }); setAIChat(msgs); render(); return true; }
    render();
    try { const ans = await AI.assistant(q, 'study'); msgs.push({ role:'bot', content: ans || '（无返回）' }); setAIChat(msgs); } catch(err){ msgs.push({ role:'bot', content:'调用失败：'+(err.message||'未知') }); setAIChat(msgs); }
    render(); return true;
  }
  return false;
}

function dueKeys(type, limit){
  const s = LearnStore.getSchedule(type);
  return Object.keys(s).filter(k => ((s[k] && s[k].nextDay) || 0) <= DAY).slice(0, limit || 20);
}
async function startDueReview(type){
  const keys = dueKeys(type, 20);
  if (!keys.length){ toast('今天没有到期内容'); return; }
  let list = [];
  if (type === 'english'){ await DeckLoader.ensureForReview(); list = keys.map(k => DeckLoader.findWord(k)).filter(Boolean); }
  else { list = keys.map(k => SEED.VALVE_ALL.find(v => v.q === k)).filter(Boolean); }
  if (!list.length){ toast('内容还没加载出来，请稍后重试'); return; }
  startReview(type, list);
}

const SearchIndex = {
  ready:false,
  async ensure(){
    if (this.ready) return;
    await Promise.all(SEED.DECKS.map(d => DeckLoader.load(d.id).catch(() => [])));
    this.ready = true;
  }
};
function openSearchSheet(){
  state.searchQuery = '';
  openSheet(`<div class="srch-wrap"><div class="srch-head"><div class="srch-title">全局搜索</div><button class="sheet-x" data-act="closeSheet">✕</button></div><input class="srch-input" id="globalSearch" placeholder="单词 / 专业知识 / 账本 / 待办" autocomplete="off"><div id="globalSearchRes" class="srch-res"><div class="srch-tip">输入关键词，一次搜遍所有内容</div></div></div>`);
  SearchIndex.ensure().then(() => { const el = document.getElementById('globalSearch'); if (el && el.value) runGlobalSearch(el.value); });
  setTimeout(() => { const el = document.getElementById('globalSearch'); if (el) el.focus(); }, 220);
}
function runGlobalSearch(raw){
  const q = String(raw || '').trim().toLowerCase();
  const box = document.getElementById('globalSearchRes');
  if (!box) return;
  if (!q){ box.innerHTML = '<div class="srch-tip">输入关键词，一次搜遍所有内容</div>'; return; }
  const hit = (s) => String(s || '').toLowerCase().includes(q);
  const secs = [];
  const rows = (arr) => arr.join('');

  const words = [];
  SEED.DECKS.forEach(d => {
    (DeckLoader.get(d.id) || []).forEach(w => {
      if (words.length >= 8) return;
      if (hit(w.w) || hit(w.cn)) words.push(`<div class="srch-row" data-act="searchJump" data-kind="word" data-q="${esc(w.w)}"><div class="i">📗</div><div><div class="t">${esc(w.w)}</div><div class="d">${esc(w.cn||'')} · ${esc(d.name||'')}</div></div></div>`);
    });
  });
  if (words.length) secs.push(`<div class="srch-sec">单词 · ${words.length}</div>${rows(words)}`);

  const knows = [];
  SEED.VALVE_ALL.forEach(v => {
    if (knows.length >= 8) return;
    if (hit(v.q) || hit(v.a)) knows.push(`<div class="srch-row" data-act="searchJump" data-kind="know" data-q="${esc(v.q)}"><div class="i">🔧</div><div><div class="t">${esc(v.q)}</div><div class="d">${esc(String(v.a||'').slice(0,60))}… · ${esc(v.cat||'')}</div></div></div>`);
  });
  if (knows.length) secs.push(`<div class="srch-sec">专业知识 · ${knows.length}</div>${rows(knows)}`);

  const txs = [];
  (transactions || []).forEach(t => {
    if (txs.length >= 8) return;
    if (hit(t.note) || hit(t.category)) txs.push(`<div class="srch-row" data-act="searchJump" data-kind="tx" data-q="${esc(t.note||t.category||'')}"><div class="i">💰</div><div><div class="t">${esc(t.note || t.category)} · ${t.type==='income'?'+':'-'}¥${Number(t.amount).toFixed(2)}</div><div class="d">${esc(t.date)} ${esc(t.time||'')} · ${esc(t.category||'')}</div></div></div>`);
  });
  if (txs.length) secs.push(`<div class="srch-sec">账本 · ${txs.length}</div>${rows(txs)}`);

  let todos = [];
  try {
    if (!Object.keys(state.calendarData || {}).length) buildCalendarFromPlans();
    todos = getAllTodoItems().filter(it => hit(it.title) || hit(it.desc)).slice(0, 8).map(it => `<div class="srch-row" data-act="searchJump" data-kind="todo" data-q="${esc(it.date)}"><div class="i">📅</div><div><div class="t">${esc(it.title)}</div><div class="d">${esc(it.date)} ${esc(it.time||'')}${it.done?' · 已完成':''}</div></div></div>`);
  } catch(e){}
  if (todos.length) secs.push(`<div class="srch-sec">待办 · ${todos.length}</div>${rows(todos)}`);

  box.innerHTML = secs.length ? secs.join('') : `<div class="srch-tip">没有找到「${esc(raw.trim())}」<br>换个关键词试试</div>`;
}
function searchJump(kind, q){
  closeSheet();
  if (kind === 'word'){ state.tab = 'study'; state.studySub = 'english'; state.englishSub = 'learned'; state.englishPage = 1; toast('已跳到英语 · 已学列表'); }
  else if (kind === 'know'){ state.tab = 'study'; state.studySub = 'valve'; state.searchQuery = q; state.valveCat = '全部'; }
  else if (kind === 'tx'){ state.tab = 'life'; state.lifeSub = 'money'; state.moneySub = 'book'; }
  else { state.tab = 'life'; state.lifeSub = 'calendar'; state.calendarSub = 'all'; state.selectedDate = q; }
  render();
}

/* ---------- D. 记账月度报表 ---------- */
function monthKeyOf(offset){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + offset);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1);
}
function monthDays(ym){
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function moneyReportPane(){
  const CAT_COLORS = ['#2563EB','#12A08A','#F59E0B','#8B5CF6','#EC4899','#0EA5E9','#EF4444','#64748B'];
  const calc = (ym) => {
    const list = (transactions || []).filter(t => String(t.date || '').startsWith(ym));
    const exp = list.filter(t => t.type === 'expense');
    const inc = list.filter(t => t.type === 'income');
    const expSum = exp.reduce((s, t) => s + Number(t.amount || 0), 0);
    const incSum = inc.reduce((s, t) => s + Number(t.amount || 0), 0);
    const byCat = {};
    exp.forEach(t => { const c = t.category || '其他'; byCat[c] = (byCat[c] || 0) + Number(t.amount || 0); });
    const arr = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const biggest = exp.slice().sort((a, b) => Number(b.amount) - Number(a.amount))[0] || null;
    return { list, expSum, incSum, arr, biggest, count: list.length };
  };
  const ym = monthKeyOf(0), pv = monthKeyOf(-1);
  const A = calc(ym), B = calc(pv);
  const maxV = A.arr.length ? A.arr[0][1] : 1;
  const delta = A.expSum - B.expSum;
  const deltaPct = B.expSum > 0 ? (delta / B.expSum * 100) : null;
  const deltaColor = delta > 0 ? 'var(--hot)' : (delta < 0 ? 'var(--ok)' : 'var(--sub)');
  const deltaBg = delta > 0 ? '#FFEDEA' : (delta < 0 ? '#E7F9F5' : '#F1F3F9');
  const avg = A.expSum / Math.max(1, new Date().getDate());
  const catHtml = A.arr.length ? A.arr.slice(0, 9).map(([k, v], i) => `
    <div style="margin-bottom:13px;">
      <div class="rep-line"><span style="font-weight:650;">${esc(k)}</span><span><b>¥${v.toFixed(0)}</b> <span style="color:var(--sub);font-size:12px;">${(v / (A.expSum || 1) * 100).toFixed(0)}%</span></span></div>
      <div class="rep-bar"><i style="width:${(v / maxV * 100).toFixed(1)}%;background:${CAT_COLORS[i % CAT_COLORS.length]}"></i></div>
    </div>`).join('') : '<p class="tip">本月还没有支出记录</p>';

  const bars = [];
  for (let i = 5; i >= 0; i--){
    const k = monthKeyOf(-i);
    const v = calc(k).expSum;
    bars.push({ k, v });
  }
  const barMax = Math.max(...bars.map(b => b.v), 1);

/* ---------- E. 自动备份 ---------- */
const AutoBackup = {
  KEY:'auto-backups',
  /* 原生可用时，备份真正写到文件（不再只躺在 localStorage 里，
     清缓存不会连备份一起消失） */
  nativeOk(){ try { return !!(window.AndroidBridge && typeof AndroidBridge.listBackupFiles === 'function'); } catch(e){ return false; } },
  list(){
    if (this.nativeOk()){
      try {
        const arr = JSON.parse(AndroidBridge.listBackupFiles() || '[]');
        if (Array.isArray(arr) && arr.length){
          return arr.map(f => ({ t: f.t, size: f.size, name: f.name, file: true }))
                    .sort((a, b) => b.t - a.t);
        }
      } catch(e){}
    }
    const v = LS.get(this.KEY, []);
    return (Array.isArray(v) ? v : []).map(x => ({ t: x.t, size: x.size, data: x.data, file: false }));
  },
  run(force){
    try {
      if (!force && !getSettings().autoBackup) return false;
      const last = HealthStore.load('autoBackupLast', 0);
      if (!force && last && (Date.now() - last) < 6.5 * 86400000) return false;
      const data = buildBackupData();
      const json = JSON.stringify(data);
      if (json.length > 3500000) return false;
      let savedFile = false;
      if (this.nativeOk()){
        try {
          const d = new Date();
          const name = 'daily-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate())
                     + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
          savedFile = !!AndroidBridge.saveBackupFile(json, name);
        } catch(e){ console.warn('写备份文件失败', e); }
      }
      // localStorage 只留最近 2 份，避免把 5MB 配额撑爆
      const arr = LS.get(this.KEY, []);
      const next = Array.isArray(arr) ? arr : [];
      next.unshift({ t: Date.now(), size: json.length, data });
      LS.set(this.KEY, next.slice(0, 2));
      HealthStore.save('autoBackupLast', Date.now());
      return savedFile || next.length > 0;
    } catch(e){ console.warn('自动备份失败', e); return false; }
  },
  /* 读出一份备份的原始 JSON 字符串 */
  read(item){
    if (!item) return '';
    if (item.file){
      try { return AndroidBridge.readBackupFile(item.name) || ''; } catch(e){ return ''; }
    }
    return item.data ? JSON.stringify(item.data) : '';
  },
  del(item){
    if (item && item.file && this.nativeOk()){
      try { AndroidBridge.deleteBackupFile(item.name); return true; } catch(e){}
    }
    return false;
  }
};

function getPRs(){ const v = HealthStore.load('sportPR', []); return Array.isArray(v) ? v : []; }
function savePRs(v){ HealthStore.save('sportPR', v); }
function rangeStat(a, b){
  const all = getSportSessions();
  let days = 0, sets = 0, mins = 0;
  Object.keys(all).forEach(d => {
    const ts = new Date(d + 'T00:00:00').getTime();
    if (ts < a || ts > b) return;
    const s = all[d] || {};
    const cnt = Object.values(s.sets || {}).reduce((x, y) => x + (Array.isArray(y) ? y.length : 0), 0);
    if (cnt > 0 || s.endTs) days++;
    sets += cnt;
    if (s.startTs && s.endTs) mins += Math.max(0, (s.endTs - s.startTs - (s.pausedTotal || 0)) / 60000);
  });
  return { days, sets, mins };
}
function weekRange(offset){
  const end = new Date(); end.setHours(23, 59, 59, 999); end.setDate(end.getDate() - offset * 7);
  const start = new Date(end); start.setDate(start.getDate() - 6); start.setHours(0, 0, 0, 0);
  return [start.getTime(), end.getTime()];
}
function sportTrendPane(){
  const [s0, e0] = weekRange(0), [s1, e1] = weekRange(1);

    const [a, b] = weekRange(i);
    const st = rangeStat(a, b);

      <div><div class="k">上周时长</div><div class="v" style="color:var(--sub);">${Math.round(prev.mins)}<span style="font-size:12px;font-weight:600;"> 分钟</span></div></div>

  </div>

  <div class="card">
    <div class="row-between" style="margin-bottom:10px;"><div class="sec-title" style="margin:0;">个人记录 PR</div><button class="mini-add" data-act="addPR" style="font-size:12px;padding:5px 12px;">＋ 记录</button></div>

}

async function handleV3Action(act, t, e){
  if (await handleToolsAction(act, t, e)) return true;
  if (act === 'openSearch'){ openSearchSheet(); return true; }
  if (act === 'searchJump'){ searchJump(t.dataset.kind, t.dataset.q); return true; }
  if (act === 'reviewDue'){ await startDueReview(t.dataset.type); return true; }
  if (act === 'openSettings'){
    const sec = t.dataset.sec || '';
    state.settingsSec = sec || null;
    openSheet(sec ? settingsSheet(sec) : settingsMenu());
    return true;
  }
  if (act === 'setCfg'){
    const f = t.dataset.field; let v = t.dataset.val;
    if (f === 'walkOn' || f === 'autoBackup' || f === 'eveningOn') v = (v === '1');
    else if (f === 'walkFreq' || f === 'fontScale') v = Number(v);
    saveSettings({ [f]: v });
    openSheet(settingsSheet(state.settingsSec || 'walk'));
    if (f === 'walkOn' || f === 'walkFreq' || f === 'walkStart' || f === 'walkEnd'){ try { initWalkReminder(); } catch(err){} }
    if (f === 'eveningOn' || f === 'eveningTime'){ try { syncEveningToNative(); syncEveningBrief(); } catch(err){} }
    return true;
  }
  if (act === 'backupNow'){ const ok = AutoBackup.run(true); toast(ok ? (AutoBackup.nativeOk() ? '已备份为文件' : '已备份') : '备份失败，空间可能不足'); if (state.settingsSec) openSheet(settingsSheet(state.settingsSec)); return true; }
  if (act === 'restoreBackup'){
    const i = Number(t.dataset.i);
    const list = AutoBackup.list();
    const item = list[i];
    if (!item){ toast('这份备份已不存在'); return true; }
    if (!confirm('用 ' + mmdd(item.t) + ' 的备份覆盖当前数据？\n当前的改动会丢失。')) return true;
    try {
      const raw = AutoBackup.read(item);
      if (!raw){ toast('这份备份读不出来了'); return true; }
      doImportConfirm(raw);
      closeSheet();
    } catch(err){ toast('恢复失败：' + err.message); }
    return true;
  }
  if (act === 'delBackup'){
    const item = AutoBackup.list()[Number(t.dataset.i)];
    if (!item){ toast('已不存在'); return true; }
    if (!confirm('删除 ' + mmdd(item.t) + ' 的备份文件？')) return true;
    AutoBackup.del(item) ? toast('已删除') : toast('删除失败');
    if (state.settingsSec) openSheet(settingsSheet(state.settingsSec));
    return true;
  }
  if (act === 'toggleSkinStep'){
    const k = t.dataset.k;
    const done = skinDoneList();
    const idx = done.indexOf(k);
    if (idx >= 0) done.splice(idx, 1); else done.push(k);
    LS.set('skin-done:' + todayStr(), done);
    const card = t.closest('.card');
    if (card){ const html = skinCheckCard(); const wrap = document.createElement('div'); wrap.innerHTML = html; if (wrap.firstElementChild) card.replaceWith(wrap.firstElementChild); }
    return true;
  }
  if (act === 'addPR'){
    const raw = prompt('格式：动作 重量\n例如：深蹲 60');
    if (!raw) return true;
    const m = raw.trim().match(/^(.+?)\s+([\d.]+)\s*(?:kg)?$/i);
    if (!m){ toast('格式不对，试试「深蹲 60」'); return true; }
    const prs = getPRs();
    const name = m[1].trim();
    const weight = Number(m[2]);
    const ex = prs.find(p => p.name === name);
    if (ex){ if (weight > Number(ex.weight)){ ex.weight = weight; ex.date = todayStr(); toast('刷新 PR：' + name + ' ' + weight + 'kg'); } else { toast('当前 PR 已经是 ' + ex.weight + 'kg'); return true; } }
    else prs.push({ name, weight, date: todayStr() });
    savePRs(prs);
    render({ keepScroll: true });
    return true;
  }
  if (act === 'delPR'){
    const i = Number(t.dataset.i);
    if (!confirm('删除这条 PR 记录？')) return true;
    const prs = getPRs();
    const sorted = prs.slice().sort((a, b) => b.weight - a.weight);
    const target = sorted[i];
    savePRs(prs.filter(p => p !== target));
    render({ keepScroll: true });
    return true;
  }
  if (act === 'setValveTab'){ state.valveTab = t.dataset.tab; render({ keepScroll: true }); updateUnitResult(); return true; }
  if (act === 'nextSentence'){ state.sentenceOffset = (state.sentenceOffset || 0) + 1; render({ keepScroll: true }); return true; }
  if (act === 'copyTpl'){ const i = Number(t.dataset.i); const m = EMAIL_TEMPLATES[i]; if (m) copyText('Subject: ' + m.s + '\n\n' + m.b); return true; }
  if (act === 'quizAnswer'){
    if (LS.get('think-quiz:' + todayStr(), null) !== null && LS.get('think-quiz:' + todayStr(), null) !== undefined){ return true; }
    const i = Number(t.dataset.i);
    LS.set('think-quiz:' + todayStr(), i);
    render({ keepScroll: true });
    if (i === Number(t.dataset.a)) toast('答对了 ✓'); else toast('不对，看看下面的解析');
    return true;
  }
  return false;
}

function updateUnitResult(){
  const el = document.getElementById('unitInput');
  const sel = document.getElementById('unitFrom');
  const box = document.getElementById('unitResult');
  if (!el || !sel || !box) return;
  const v = parseFloat(el.value);
  if (!isFinite(v)){ box.innerHTML = '<span style="font-size:13px;color:var(--sub);">输入一个数值</span>'; return; }
  const toMPa = { 'MPa':1, 'bar':0.1, 'psi':0.00689476, 'kgf/cm²':0.0980665, 'kPa':0.001 };
  const mpa = v * (toMPa[sel.value] || 1);
  const rows = [['MPa', mpa], ['bar', mpa * 10], ['psi', mpa * 145.038], ['kgf/cm²', mpa * 10.1972], ['kPa', mpa * 1000]];
  box.innerHTML = rows.map(r => `<div class="rep-line" style="margin-bottom:5px;"><span style="color:var(--sub);font-size:12.5px;">${r[0]}</span><b style="font-size:13.5px;">${r[1] >= 100 ? r[1].toFixed(1) : r[1].toFixed(4)}</b></div>`).join('');
}
document.addEventListener('input', e => {
  const el = e.target;
  if (!el || !el.id) return;
  if (el.id === 'unitInput') updateUnitResult();
  if (el.id === 'globalSearch') runGlobalSearch(el.value);
  if (el.id === 'noteSearch'){ const q = (el.value||'').toLowerCase(); document.querySelectorAll('.note-card').forEach(c => { const hay = (c.dataset.hay||'').toLowerCase(); c.style.display = (!q || hay.includes(q)) ? '' : 'none'; }); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el && el.id === 'unitFrom') updateUnitResult();
});

function collectLearnStorage(){

  const re = /^(learned:|know-done:|note:|ask-cache:|ask-text:|think-ans:|think-done-days:|expr-ans:|expr-grade:|today-words:|schedule:|weekly-result:|alltest-result|word-deck-map|english-deck|streak|passage-done:|news-done:|quote-done:|story-done:|yiyan-done:|general-done:|expr-done:|news-think-|rec-|tag-)/;
  try {
    Object.keys(localStorage).forEach(k => {
      if (!re.test(k)) return;
      const raw = localStorage.getItem(k);
      try { out[k] = JSON.parse(raw); } catch(e){ out[k] = raw; }
    });
  } catch(e){}
  return out;
}

// === 滑动删除逻辑 ===
let swipeStartX = 0;
let swipeCurrentWrapper = null;

view.addEventListener('touchstart', e => {
  const wrapper = e.target.closest('.swipe-wrapper');
  if (!wrapper) return;
  swipeCurrentWrapper = wrapper;
  swipeStartX = e.touches[0].clientX;
  document.querySelectorAll('.swipe-content.active').forEach(el => {
    if (el !== wrapper.querySelector('.swipe-content')) {
      el.classList.remove('active');
    }
  });
}, { passive: true });

view.addEventListener('touchmove', e => {
  if (!swipeCurrentWrapper) return;
  const deltaX = e.touches[0].clientX - swipeStartX;
  const content = swipeCurrentWrapper.querySelector('.swipe-content');
  if (deltaX < 0 && deltaX > -75) {
    content.style.transition = 'none';
    content.style.transform = `translateX(${deltaX}px)`;
  }
}, { passive: true });

view.addEventListener('touchend', e => {
  if (!swipeCurrentWrapper) return;
  const content = swipeCurrentWrapper.querySelector('.swipe-content');
  const deltaX = e.changedTouches[0].clientX - swipeStartX;
  content.style.transition = 'transform 0.3s ease';
  content.style.transform = '';
  if (deltaX < -30) {
    content.classList.add('active');
  } else {

    fab.style.right = 'auto'; fab.style.bottom = 'auto';

    const r = fab.getBoundingClientRect(), pr = phone.getBoundingClientRect();
    dragging = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    ox = r.left - pr.left; oy = r.top - pr.top;

async function fetchWordExampleFromApi(word){
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    let resp;
    try {
      resp = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), { signal: controller.signal });
    } finally { clearTimeout(timer); }
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!Array.isArray(data) || !data[0]) return null;

    const entry = data[0];
    let bestExample = '', pos = '', definition = '';
    for (const meaning of (entry.meanings || [])){
      pos = pos || meaning.partOfSpeech || '';
      for (const def of (meaning.definitions || [])){
        if (!definition) definition = def.definition || '';
        if (def.example && String(def.example).trim().length > 5){
          bestExample = def.example.trim();
          break;
        }
      }
      if (bestExample) break;
    }
    const scene = bestExample || definition;
    if (!scene) return null;

    let sceneCn = '';
    try { sceneCn = await translateToChinese(scene); } catch(e){}
    return { scene, sceneCn, pos, definition, source: 'dictionaryapi.dev', ts: Date.now() };
  } catch(e){
    console.warn('[Example] fetch failed', e);
    return null;
  }
}

function normWords(s){
  return String(s || '').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5' ]/g, ' ').split(/\s+/).filter(Boolean);
}
function localFollowScore(target, heard){
  const a = normWords(target), b = normWords(heard);
  if (!a.length) return { score:0, accuracy:0, tips:['没有可跟读的文本'] };
  const pool = b.slice(); const hit = [];
  a.forEach(w => { const i = pool.indexOf(w); if (i >= 0){ pool.splice(i, 1); hit.push(w); } });
  const acc = Math.round(hit.length / a.length * 100);
  const miss = a.filter(w => hit.indexOf(w) < 0).slice(0, 6);
  const extra = pool.slice(0, 4);
  const tips = [];
  if (miss.length) tips.push('没读到：' + miss.join(' / '));
  if (extra.length) tips.push('多读/读错：' + extra.join(' / '));
  if (!tips.length) tips.push('每个词都读到了，很棒！试着把连读和重音再练一遍。');
  const score = Math.max(0, Math.min(100, Math.round(acc * 0.9 + (b.length ? Math.min(10, b.length / a.length * 10) : 0))));
  return { score, accuracy:acc, tips, local:true };
}

/* ===== 慢速 + 长文分块朗读（P16） ===== */
function speakRateValue(){
  const v = (getSettings().speakRate) || 'slow';
  return v === 'normal' ? 1.0 : (v === 'verySlow' ? 0.65 : 0.78);
}
function splitSpeechChunks(text, maxLen){
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  if (!s) return [];
  const limit = maxLen || 160;
  if (s.length <= limit) return [s];
  const parts = (s.match(/[^.!?;。！？；]+[.!?;。！？；]?\s*/g) || [s]).map(x => x.trim()).filter(Boolean).reduce((acc, p) => {
    if (!p) return acc;
    while (p.length > limit){
      const cut = p.lastIndexOf(' ', limit);
      const at = cut > limit * 0.5 ? cut : limit;
      acc.push(p.slice(0, at).trim()); p = p.slice(at).trim();
    }
    if (p) acc.push(p);
    return acc;
  }, []);
  const out = []; let buf = '';
  (parts.length ? parts : [s]).forEach(p => {
    if (!buf) buf = p;
    else if ((buf + ' ' + p).length <= limit) buf += ' ' + p;
    else { out.push(buf); buf = p; }
  });
  if (buf) out.push(buf);
  return out;
}
function systemTTSQueue(chunks, langStr, rate, seq, cleanup){
  const step = (i) => {
    if (seq !== _speakSeq){ cleanup(); return; }
    if (i >= chunks.length){ cleanup(); return; }
    if (!window.speechSynthesis){ cleanup(); return; }
    try {
      const u = new SpeechSynthesisUtterance(chunks[i]);
      u.lang = langStr; u.rate = rate;
      u.onend = () => step(i + 1);
      u.onerror = () => step(i + 1);
      speechSynthesis.speak(u);
    } catch(e){ cleanup(); }
  };
  try { speechSynthesis.cancel(); } catch(e){}
  step(0);
}

function toggleSpeak(text, lang, btn){
  if (!text) { toast('没有内容可朗读'); return; }
  const wasPlaying = btn && _currentSpeakBtn === btn;
  stopSpeak();
  if (wasPlaying) return;
  const langStr = lang || 'en-US';
  const seq = ++_speakSeq;
  if (btn) { btn.classList.add('playing'); _currentSpeakBtn = btn; }
  playNetworkAudio(text, langStr, seq, btn);
}

/* 多源网络 TTS：长文按句切块依次播放（不再 200 字截断），整体慢速适合新手 */
function playNetworkAudio(text, langStr, seq, btn) {
  const player = document.getElementById('ttsPlayer');
  if (!player) return;
  const full = String(text).replace(/\s+/g, ' ').trim();
  if (!full) return;
  const chunks = splitSpeechChunks(full, 160);
  const rate = speakRateValue();
  const isZh = String(langStr).startsWith('zh');
  const cleanup = () => {
    if (seq !== _speakSeq) return;
    if (_currentSpeakBtn) _currentSpeakBtn.classList.remove('playing');
    _currentSpeakBtn = null;
  };
  const health = LS.get('tts-health', {});
  const markOk   = n => { health[n] = Math.min((health[n] || 0) + 1, 20); LS.set('tts-health', health); };
  const markFail = n => { health[n] = -1; LS.set('tts-health', health); };
  const sourcesFor = chunk => {
    const arr = [
      { name:'google', url:`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${isZh ? 'zh-CN' : 'en'}&q=${encodeURIComponent(chunk)}&total=1&idx=0&textlen=${chunk.length}&ttsspeed=1` },
      { name:'se', url:`https://api.streamelements.com/kappa/v2/speech?voice=${isZh ? 'Zhiyu' : 'Brian'}&text=${encodeURIComponent(chunk)}` },
      { name:'youdao', url: isZh ? `https://dict.youdao.com/dictvoice?le=zh&audio=${encodeURIComponent(chunk)}` : `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(chunk)}&type=2` },
      { name:'baidu', url:`https://fanyi.baidu.com/gettts?lan=${isZh ? 'zh' : 'en'}&text=${encodeURIComponent(chunk)}&spd=2&source=web` }
    ];
    arr.sort((a, b) => (health[b.name] || 0) - (health[a.name] || 0));
    return arr;
  };
  const playOne = chunk => new Promise(resolve => {
    const sources = sourcesFor(chunk);
    let idx = 0, done = false;
    const guard = setInterval(() => { if (seq !== _speakSeq) finish(false); }, 250);
    const hard = setTimeout(() => finish(false), 18000);
    const wires = () => { player.onplaying = null; player.onended = null; player.onerror = null; };
    function finish(ok){
      if (done) return; done = true;
      clearInterval(guard); clearTimeout(hard); wires();
      try { player.pause(); } catch(e){}
      resolve(ok);
    }
    const tryNext = () => {
      if (done) return;
      if (seq !== _speakSeq){ finish(false); return; }
      if (idx >= sources.length){ finish(false); return; }
      const srcItem = sources[idx++];
      let settled = false;
      const srcTimer = setTimeout(() => {
        if (settled || done) return;
        settled = true; markFail(srcItem.name); wires();
        try { player.pause(); } catch(e){}
        tryNext();
      }, 3000);
      player.onplaying = () => { if (settled || done) return; settled = true; clearTimeout(srcTimer); markOk(srcItem.name); };
      player.onended = () => { if (!done){ clearTimeout(srcTimer); finish(true); } };
      player.onerror = () => {
        if (settled || done) return;
        settled = true; clearTimeout(srcTimer); markFail(srcItem.name); wires();
        try { player.pause(); } catch(e){}
        tryNext();
      };
      try {
        player.src = srcItem.url;
        try { player.playbackRate = rate; } catch(e){}
        const p = player.play();
        if (p && p.catch) p.catch(err => {
          if (settled || done) return;
          if (err && err.name === 'AbortError') return;
          settled = true; clearTimeout(srcTimer); markFail(srcItem.name); wires();
          tryNext();
        });
      } catch(e){ if (!done){ settled = true; clearTimeout(srcTimer); tryNext(); } }
    };
    tryNext();
  });
  (async () => {
    for (let i = 0; i < chunks.length; i++){
      if (seq !== _speakSeq) return;
      const ok = await playOne(chunks[i]);
      if (seq !== _speakSeq) return;
      if (!ok){ systemTTSQueue(chunks.slice(i), langStr, rate, seq, cleanup); return; }
    }
    cleanup();
  })();
}

// ============ 半小时走动提醒 ============
let _walkHalfHourTimer = null;

function isWalkHalfHourMoment() {
  const cfg = getSettings();
  if (!cfg.walkOn) return false;
  const now = new Date();
  const dow = now.getDay();                     // 0=日 1=一 ... 6=六
  if (dow === 0 || dow === 6) return false;     // 只在周一至周五
  if (now.getSeconds() > 20) return false;
  const [sh, sm] = String(cfg.walkStart || '08:30').split(':').map(Number);
  const [eh, em] = String(cfg.walkEnd || '17:00').split(':').map(Number);
  const totalMins = now.getHours() * 60 + now.getMinutes();
  const startM = sh * 60 + sm, endM = eh * 60 + em;
  if (totalMins < startM || totalMins > endM) return false;
  if (totalMins > 11 * 60 + 30 && totalMins < 13 * 60) return false;   // 午休静音
  const step = Number(cfg.walkFreq) || 30;
  return (totalMins - startM) % step === 0;
}

function checkWalkHalfHourTrigger() {
  try {
    if (!isWalkHalfHourMoment()) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const slotKey = `app_h_walkSlot_${todayStr()}_${hh}${mm}`;
    if (LS.get(slotKey, false)) return;
    LS.set(slotKey, true);
    console.log('[Walk] 半小时提醒触发:', hh + ':' + mm);
    if (typeof startWalkTimer === 'function') {
      startWalkTimer(200);
    }
  } catch (e) {
    console.warn('[Walk] checkWalkHalfHourTrigger error:', e);
  }
}

/* 把提醒设置交给系统闹钟：App 关掉/被清理也能准点响 */
function syncWalkToNative(){

    const [eh, em] = String(s.walkEnd || '17:00').split(':').map(Number);
    AndroidBridge.syncWalkSettings(s.walkOn ? 1 : 0, sh * 60 + sm, eh * 60 + em, Number(s.walkFreq) || 30);
  } catch(e){ console.warn('[Walk] 同步原生闹钟失败', e); }
}

function initWalkReminder() {

}

    let sported = false, skined = false, learned = false, booked = false;
    try { sported = !!getSportSession(today); } catch(e){}
    try { skined = skinDoneList().length > 0; } catch(e){}
    try { learned = (LS.get('learned:' + DAY, []) || []).length > 0 || (LS.get('know-done:' + DAY, []) || []).length > 0; } catch(e){}
    try { booked = (transactions || []).some(t => t.date === today); } catch(e){}
    const missing = [];

    if (!learned) missing.push('学习');
    if (!skined) missing.push('护肤');
    if (!booked) missing.push('记账');
    if (!todo.length && !missing.length) return '今天都完成啦，来收星光，看一眼明天 ✦';
    if (todo.length && missing.length) return '今天还有 ' + todo[0] + '，' + missing.slice(0, 2).join('、') + ' 也还空着 · 星光等你来领 ✦';
    if (todo.length) return '今天还有 ' + todo[0] + ' · 星光还没领哦 ✦';
    if (missing.length) return '今天还没' + missing.slice(0, 3).join('、') + ' · 现在补一下正好 ✦';
    return '今天的星光还没领哦，来收一下 ✦';
  } catch(e){
    return '今天还有没完成的事吗？来收今天的星光 ✦';
  }
}
let _lastBriefAt = 0;
function syncEveningBrief(force){
  try {
    if (!window.AndroidBridge || typeof AndroidBridge.saveEveningBrief !== 'function') return;
    const now = Date.now();
    if (!force && now - _lastBriefAt < 60000) return;
    _lastBriefAt = now;
    AndroidBridge.saveEveningBrief(todayStr(), eveningBriefText());
  } catch(e){}
}
/** 原生闹钟在 App 前台时调用：温和提醒 + 直达时间线 */
window.onNativeEveningReminder = function(){
  try {
    const msg = eveningBriefText();
    syncEveningBrief(true);
    state.tab = 'life'; state.lifeSub = 'calendar'; state.calendarSub = 'all';
    render({ keepScroll: false });
    toast('🌙 ' + msg);
  } catch(e){ console.warn('[Evening] 前台回调出错', e); }
  return true;
};
function initEveningReminder(){
  syncEveningToNative();
  syncEveningBrief(true);
}
(function init(){
  try {
    setTimeout(function(){ try { if (AutoBackup.run()) console.log('[备份] 自动备份完成'); } catch(e){} }, 6000);
    loadDataFromGlobals(); 
    migrateOldSkinProducts(); 
    buildCalendarFromPlans(); 
    LearnStore.checkIn(); 
    
    const bjD = new Date(Date.now() + 8*3600*1000);
    const wc = '日一二三四五六'[bjD.getUTCDay()];
    const dateEl = document.getElementById('topDate');
    if (dateEl) dateEl.textContent = (bjD.getUTCMonth()+1)+'月'+bjD.getUTCDate()+'日 周'+wc;

    render(); 
    initWalkReminder();
    try { initEveningReminder(); } catch(e){ console.warn('[Evening] 启动失败', e); }
    setTimeout(() => { try { if (window.AndroidBridge && window.AndroidBridge.getWidgetTimelineData) { const nativeJson = window.AndroidBridge.getWidgetTimelineData(); if (nativeJson && nativeJson !== "[]") { const arr = JSON.parse(nativeJson); const checks = getChecks(); let changed = false; arr.forEach(item => { if (item.key && item.done && !checks[item.key]) { checks[item.key] = true; changed = true; } }); if (changed) { saveChecks(checks); render(); } } } syncToNativeWidget(); } catch (e) { console.error('init widget sync error:', e); } }, 1200);
    setInterval(() => { const el = document.getElementById('sportTimer'); if (el){ const sess = getSportSession(); if (sess && !sess.endTs && !sess.pausedAt){ let elapsed = Date.now() - sess.startTs - (sess.pausedTotal || 0); const total = Math.floor(elapsed / 1000); const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60; el.textContent = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; const sc = document.getElementById('sportSetCount'); if (sc) sc.textContent = Object.values(sess.sets || {}).reduce((a,b) => a + b.length, 0); } } }, 1000);
  } catch (err) { var el = document.getElementById('fatal-error'); if (el) { el.style.display = 'block'; el.innerHTML = '启动失败：' + err.message + '<br><br>' + err.stack; } else { document.getElementById('view').innerHTML = '<div style="padding:20px;color:red;">启动失败：' + err.message + '</div>'; } }
})();
// === 提供给 Android 物理返回键调用的方法 ===
window.handleNativeBack = function() {
  // 1. 如果弹窗层（Sheet）是打开的，先关弹窗
  if (sheet.classList.contains('open')) {
    closeSheet();
    return true; 
  }
  
  // 2. 如果不在首页（如在学习、生活、发现、我的），切回首页
  if (state.tab !== 'home') {
    state.tab = 'home';
    render();
    return true;
  }
  
  // 3. 已经在首页且无弹窗，返回 false 告诉原生可以退出 App
  return false;
};
const _bootDay = todayStr();
function _checkDayRollover(){
  if (todayStr() !== _bootDay){
    console.log('[Day] 跨天，刷新页面');
    toast('已跨天，正在刷新…');
    setTimeout(() => location.reload(), 800);
  }
}
setInterval(_checkDayRollover, 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') _checkDayRollover();
});
