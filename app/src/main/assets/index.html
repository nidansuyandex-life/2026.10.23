<!-- P55 启动提速：3 个大词库（379 KB）改为按需加载，首屏同步脚本由 490 KB 降到 112 KB。
     type 非 JS 时浏览器不会下载；ensureData() 读取 src 后动态注入，
     保留 src="./data/..." 写法是为了兼容验收脚本把路径改写成 file:/// 绝对路径。 -->
<script type="text/x-lazy" src="./data/valve.js" data-key="valve" data-probe="__VALVE_DATA"></script>
<script type="text/x-lazy" src="./data/thinking.js" data-key="thinking" data-probe="__THINKING_DATA"></script>
<script type="text/x-lazy" src="./data/scenes.js" data-key="scenes" data-probe="__SCENES_DATA"></script>
<script src="./data/exanim.js"></script>
<script src="./data/grow-shop.js"></script>
<script>
/* ===== P55 启动提速 / 错误日志 ===== */
window.__LAZY_DATA = {};
[].forEach.call(document.querySelectorAll('script[type="text/x-lazy"][data-key]'), function(n){
  window.__LAZY_DATA[n.getAttribute('data-key')] = {
    src: n.getAttribute('src'), probe: n.getAttribute('data-probe') || ''
  };
});
window.__dataPromises = {};
window.__dataLoaded = {};
window.ensureData = function(key){
  var d = window.__LAZY_DATA[key];
  if (!d) return Promise.resolve(false);
  if (window.__dataLoaded[key]) return Promise.resolve(true);
  if (window.__dataPromises[key]) return window.__dataPromises[key];
  window.__dataPromises[key] = new Promise(function(resolve){
    var sc = document.createElement('script');
    sc.src = d.src;
    sc.setAttribute('data-p55-injected', '1');
    sc.onload = function(){
      window.__dataLoaded[key] = true;
      try { if (typeof loadDataFromGlobals === 'function') loadDataFromGlobals(); } catch(e){}
      resolve(true);
    };
    sc.onerror = function(){
      console.warn('[data] 加载失败:', d.src);
      window.__errLog && window.__errLog.add('data', '数据脚本加载失败 ' + d.src);
      resolve(false);
    };
    document.head.appendChild(sc);
  });
  return window.__dataPromises[key];
};
window.__ensureAllData = function(){
  return Promise.all(Object.keys(window.__LAZY_DATA).map(window.ensureData));
};
/* 只有学习页需要三大词库；其它页面（含首屏）一个都不等 */
window.ensureDataForState = function(){
  try {
    if (typeof state === 'undefined' || !state || state.tab !== 'study') return Promise.resolve([]);
    return window.__ensureAllData();
  } catch(e){ return Promise.resolve([]); }
};
/* 错误日志：只存本机、上限 60 条，不上传；用原生 localStorage 避免依赖后面才定义的 LS */
window.__errLog = {
  KEY: 'app_error_log', max: 60,
  all: function(){
    try { var a = JSON.parse(localStorage.getItem(this.KEY) || '[]'); return Array.isArray(a) ? a : []; }
    catch(e){ return []; }
  },
  add: function(kind, msg, extra){
    try {
      var a = this.all();
      a.push({ t: Date.now(), kind: String(kind || 'error'),
               msg: String(msg || '').slice(0, 500), extra: String(extra || '').slice(0, 300),
               ver: window.p55AppVersion ? window.p55AppVersion() : '' });
      if (a.length > this.max) a = a.slice(-this.max);
      localStorage.setItem(this.KEY, JSON.stringify(a));
    } catch(e){}
  },
  clear: function(){ try { localStorage.removeItem(this.KEY); } catch(e){} }
};
window.dumpErrorLog = function(){
  var a = window.__errLog.all();
  var lines = a.map(function(x){
    var d; try { d = new Date(x.t).toISOString(); } catch(e){ d = String(x.t); }
    return d + ' [' + x.kind + '] ' + x.msg + (x.extra ? ' | ' + x.extra : '') + (x.ver ? ' | v' + x.ver : '');
  }).join('\n');
  return '日常 · 健康生活 错误日志\n版本：' + (window.p55AppVersion ? window.p55AppVersion() : '未知') +
         '\n导出时间：' + new Date().toISOString() + '\n共 ' + a.length + ' 条\n\n' +
         (lines || '（暂无错误记录）');
};
</script>
<style>
.swipe-wrapper { position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 2px; }
.swipe-content { display: flex; align-items: center; gap: 10px; padding: 10px 0; background: #fff; transition: transform 0.3s ease; position: relative; z-index: 2; width: 100%; box-sizing: border-box;}
.swipe-content.active { transform: translateX(-70px); }
.swipe-delete { position: absolute; right: 0; top: 0; bottom: 0; width: 70px; background: #EC6A6A; color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; z-index: 1; cursor: pointer; border-radius: 0 8px 8px 0;}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in {
  animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
/* ================= 纸墨设计系统 ================= */
:root{
  /* ===== 明亮统一色板：晴空蓝 + 蓝白底，单一主色相 + 3 个语义色 ===== */
  --pri:#3485D6; --pri2:#6FB0EC; --pri-deep:#2567B5; --pri-soft:#E9F4FF;
  --brand:#3485D6; --brand2:#6FB0EC;
  --sub:#2A3C50;
  --ok:#2DBE98; --ok-soft:#E3F8F1;
  --warn:#E9A03C; --warn-soft:#FFF2DE;
  --err:#EC6A6A; --err-soft:#FFECEC;
  /* 兼容旧变量名：一律指向主色，任何组件都不会再冒出另一种颜色 */
  --accent:#3485D6; --accent2:#6FB0EC; --accent-soft:#E9F4FF;
  --hot:#3485D6; --hot2:#6FB0EC; --hot-soft:#E9F4FF;
  --purple:#3485D6; --purple2:#6FB0EC; --purple-soft:#E9F4FF;
  --blue:#3485D6; --blue2:#6FB0EC; --blue-soft:#E9F4FF;
  --pink:#3485D6; --pink2:#6FB0EC; --pink-soft:#E9F4FF;
  /* 灰阶（偏蓝，明快不脏） */
  --ink:#121C2A; --ink2:#203146; --ink3:#2F4359;
  --line:rgba(27,42,61,.08);
  --bg:#F6FAFF;
  /* 圆角与阴影 */
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow-card:0 1px 2px rgba(27,42,61,.03), 0 14px 34px -26px rgba(27,42,61,.26);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","OPPO Sans","Microsoft YaHei",sans-serif;background:#E7F1FC;color:var(--ink);display:flex;justify-content:center;min-height:100dvh;overflow:hidden;}
.phone{position:relative;width:100%;max-width:460px;height:100dvh;background:#F6FAFF;display:flex;flex-direction:column;overflow:hidden;}
/* --- 顶栏 --- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.2px;color:var(--ink);}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 4px rgba(52,133,214,.15);}
.top-right{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);}
.top-weather{display:flex;align-items:center;gap:4px;font-weight:600;background:#fff;padding:5px 11px;border-radius:99px;box-shadow:0 1px 4px rgba(25,27,34,.05);border:1px solid var(--line);}
/* --- 内容滚动区 --- */
#view{flex:1;overflow-y:auto;padding:2px 16px 122px;overscroll-behavior:contain;}
#view::-webkit-scrollbar{width:0;}
/* --- 底部导航：悬浮胶囊 --- */
.tabbar{flex-shrink:0;display:flex;margin:0 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:7px 6px;box-shadow:0 18px 44px -20px rgba(25,27,34,.35);}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border-radius:18px;cursor:pointer;color:#3E5065;font-size:10.5px;font-weight:600;letter-spacing:.3px;font-family:inherit;transition:color .18s;}
.tab-icon{width:24px;height:24px;display:grid;place-items:center;transition:transform .18s;line-height:1;}
.tab-icon svg{width:23px;height:23px;display:block;}
.tab:active .tab-icon{transform:scale(.86);}
.tab.on{color:#121C2A;font-weight:800;}
.tab.on .tab-icon{transform:translateY(-1px);}
/* --- 卡片 --- */
.card{background:#fff;border-radius:var(--r-lg);padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--shadow-card);}
.card.done{background:#E9F4FF;border-style:dashed;opacity:.72;}
/* 深色数据卡（词库/知识/测试等头部） */
.hero-card{background:linear-gradient(135deg,var(--pri-deep),var(--pri2));color:#fff;border:1px solid rgba(255,255,255,.08);}
.hero-card .btn{background:#fff;color:#121C2A;}
/* --- 页面标题 --- */
.hero{padding:4px 4px 14px;}
.hero-k{font-size:12px;color:var(--ink3);font-weight:700;letter-spacing:1.5px;margin-bottom:7px;}
.hero h1{font-size:26px;margin:0;letter-spacing:-.6px;font-weight:850;}
.hero-sm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 12px;}
.hero-sm h1{font-size:26px;margin:0;letter-spacing:-.6px;font-weight:850;}
.hero-sm .meta{font-size:12px;color:var(--ink2);font-weight:600;flex-shrink:0;background:#fff;padding:5px 12px;border-radius:99px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(25,27,34,.04);}
/* --- 分区标题：小字间距标签 --- */
.sec-title{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:1.5px;margin:18px 6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sec-title .muted{font-weight:600;font-size:12px;letter-spacing:0;display:flex;align-items:center;gap:6px;}
.muted{color:var(--sub);}
.tip{color:var(--sub);font-size:12.5px;line-height:1.65;}
.foot-note{text-align:center;font-size:12px;color:#2F4359;padding:16px 0 4px;letter-spacing:.5px;}
/* --- 按钮 --- */
.btn{border:0;border-radius:13px;padding:11px 18px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--pri);color:#fff;box-shadow:0 10px 24px -14px rgba(52,133,214,.55);}
.btn.wide{width:100%;margin-top:6px;}
.btn.ghost{background:#E9F4FF;color:var(--ink2);padding:8px 14px;font-size:13px;}
.btn.danger{background:#FFECEC;color:#203146;padding:8px 14px;font-size:13px;}
.btn-primary{width:100%;border:none;font-family:inherit;font-size:15px;font-weight:650;color:#fff;padding:15px;border-radius:var(--r-md);cursor:pointer;background:var(--pri);box-shadow:0 10px 24px -14px rgba(52,133,214,.55);margin-top:4px;}
.btn-ghost-h{width:100%;border:none;font-family:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:var(--r-md);cursor:pointer;background:var(--accent-soft);color:var(--ink);}
/* --- 标签组 --- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px;padding:6px 16px 12px;flex-wrap:nowrap;}
.chips::-webkit-scrollbar{display:none;}

/* ===== P52 AI 陪聊 ===== */
.cm-phead{display:flex;align-items:center;gap:10px;}
.cm-avatar{width:44px;height:44px;flex:0 0 44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--pri-soft);}
.cm-pname{font-size:15px;font-weight:800;color:#121C2A;}
.cm-pdesc{font-size:11.5px;color:var(--sub);line-height:1.55;margin-top:3px;}
.cm-prow{display:flex;gap:7px;overflow-x:auto;padding:11px 0 2px;flex-wrap:nowrap;}
.cm-prow::-webkit-scrollbar,.cm-quick::-webkit-scrollbar{display:none;}
.cm-pbtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#203146;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap;}
.cm-pbtn.on{background:var(--pri-soft);border-color:var(--pri);color:#121C2A;}
.cm-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);}
.cm-ailabel{font-size:11px;color:var(--sub);line-height:1.5;}
.cm-head .link-btn{flex:0 0 auto;}
.cm-more{text-align:center;padding:6px 0 12px;border-bottom:1px dashed var(--line);margin-bottom:12px;}
.cm-more .link-btn{font-size:11.5px;}
.cm-stat{font-size:11px;color:#2F4359;line-height:1.65;background:#F7FAFD;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:10px;}
.cm-box{height:auto;min-height:250px;max-height:52vh;overflow-y:auto;padding:14px 12px;background:#F7FAFD;}
.cm-bubble{max-width:84%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.7;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;}
.cm-bubble.bot{background:#fff;color:#121C2A;border:1px solid var(--line);border-radius:16px 16px 16px 4px;margin-right:auto;}
.cm-bubble.user{background:var(--pri);color:#fff;border-radius:16px 16px 4px 16px;margin-left:auto;}
.cm-bubble.error{background:#FFF2DE;color:#203146;border:1px solid #F0D6A8;}
.cm-bubble.bot + .cm-bubble.bot{margin-top:-6px;}
.cm-empty .cm-bubble.bot{max-width:88%;margin-left:auto;margin-right:auto;text-align:left;}
.cm-meta{font-size:10.5px;color:var(--sub);margin-top:5px;display:flex;gap:11px;align-items:center;flex-wrap:wrap;}
.cm-meta .cm-pill{color:var(--pri);font-weight:700;}
.cm-act{border:0;background:transparent;color:var(--pri);font-size:11px;font-weight:700;padding:0;cursor:pointer;}
.cm-quick{display:flex;gap:7px;overflow-x:auto;padding:9px 12px;border-top:1px solid var(--line);}
.cm-qbtn{flex:0 0 auto;background:#F2F7FD;border:1px solid var(--line);color:#203146;border-radius:18px;padding:7px 11px;font-size:11.5px;font-weight:600;white-space:nowrap;cursor:pointer;}
.cm-input{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line);align-items:flex-end;}
.cm-input textarea{flex:1;min-width:0;min-height:44px;max-height:110px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 11px;font-size:13.5px;color:#121C2A;background:#fff;font-family:inherit;line-height:1.55;}
.cm-typing{display:flex;gap:4px;padding:4px 2px;}
.cm-typing i{width:6px;height:6px;border-radius:50%;background:var(--pri);animation:cmBlink 1.1s infinite;}
.cm-typing i:nth-child(2){animation-delay:.18s;}
.cm-typing i:nth-child(3){animation-delay:.36s;}
@keyframes cmBlink{0%,60%,100%{opacity:.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}
.cm-empty{text-align:center;padding:26px 14px;}
.cm-empty-av{font-size:38px;}
.cm-empty-hi{font-size:14px;font-weight:750;color:#121C2A;margin-top:8px;line-height:1.6;}
.cm-empty-sub{font-size:11.5px;color:var(--sub);margin-top:5px;}
.cm-mem{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.cm-mem span{background:#F2F7FD;border:1px solid var(--line);border-radius:14px;padding:5px 9px;font-size:11.5px;color:#203146;}
.cm-warn{background:#FFF2DE;color:#203146;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.65;margin-bottom:12px;}
.cm-note{font-size:11px;color:var(--sub);line-height:1.65;margin:2px 3px 14px;}
.cm-form label{display:block;font-size:11.5px;font-weight:700;color:#203146;margin:9px 0 4px;}
.cm-form input,.cm-form textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;color:#121C2A;background:#fff;font-family:inherit;resize:vertical;}
.cm-form textarea{min-height:58px;line-height:1.55;}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:8px 15px;border-radius:99px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:inherit;transition:background .15s,color .15s;}
.chip.on{background:var(--pri);color:#fff;border-color:var(--ink);}
/* --- 主分段：吸顶胶囊标签 --- */
.subtabs{position:sticky;top:0;z-index:8;display:flex;gap:8px;margin:0 -16px 14px;padding:10px 16px 12px;background:rgba(245,246,250,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow-x:auto;flex-wrap:nowrap;box-shadow:0 1px 0 var(--line);}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{border:0;background:#fff;padding:9px 16px;border-radius:99px;font-size:15px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:background .15s,color .15s;box-shadow:0 1px 3px rgba(25,27,34,.06);}
.subtabs .subtab[data-tone]{background:var(--tab-soft);color:#121C2A;border:1px solid transparent;}
.subtabs .subtab[data-tone]::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tab-c);margin-right:6px;vertical-align:1px;}
.subtabs .subtab.on{background:var(--tab-c,var(--pri));color:#fff;font-weight:700;box-shadow:0 8px 18px -8px var(--tab-c,var(--pri));text-shadow:0 1px 2px rgba(16,45,80,.35);}
.subtabs .subtab.on::before{background:#fff;}
/* --- 二级分段：下划线 --- */
.subtabs-secondary{position:sticky;top:var(--sec-top,0px);z-index:7;display:flex;gap:16px;margin:0 -16px 12px;padding:7px 20px 0;border-bottom:1px solid var(--line);background:#F6FAFF;border-radius:0;border-top:none;border-left:none;border-right:none;overflow-x:auto;}
.subtabs-secondary::-webkit-scrollbar{display:none;}
.subtabs-secondary .subtab{padding:8px 4px 11px;font-size:14px;color:var(--ink3);font-weight:500;position:relative;background:none;box-shadow:none;}
.subtabs-secondary .subtab.on{background:transparent;color:#121C2A;font-weight:800;}
.subtabs-secondary .subtab.on::after{content:'';position:absolute;bottom:-1px;left:10%;width:80%;height:2.5px;background:var(--pri);border-radius:2px;}
/* --- 工具箱：宫格图标首页 --- */
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:2px;}
.tool-cell{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 15px 15px;box-shadow:var(--shadow-card);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:2px;transition:transform .12s,box-shadow .15s;}
.tool-cell:active{transform:scale(.97);box-shadow:0 8px 20px -12px rgba(27,42,61,.28);}
.tool-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--tbg);color:var(--tc);margin-bottom:10px;}
/* 小 emoji 图标自带高饱和色，统一压低饱和度，避免整站配色被零碎色点打断（插画 SVG 不受影响） */
.tool-name{font-size:15.5px;font-weight:800;color:var(--ink);letter-spacing:.2px;}
.tool-desc{font-size:11.5px;color:var(--sub);line-height:1.45;}
.tool-badge{position:absolute;top:13px;right:13px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--tc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.tool-bar{display:flex;align-items:center;gap:12px;padding:2px 4px 12px;}
.tool-back{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px 7px 12px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;box-shadow:0 1px 3px rgba(25,27,34,.05);display:inline-flex;align-items:center;gap:2px;}
.tool-back:active{transform:scale(.96);}
.tool-cur{font-size:16px;font-weight:800;color:var(--ink);}
.tool-page{animation:fadeInUp .28s cubic-bezier(.16,1,.3,1) forwards;}
/* 咪咪档案子菜单：完全沿用生活页二级吸顶下划线，标签较长时缩字号并允许横向滚动 */
.mimi-subs{gap:14px;}
.mimi-subs .subtab{font-size:12.5px;padding-left:2px;padding-right:2px;flex-shrink:0;}
/* --- 提示与状态 --- */
.tip-card{background:#fff;border:1px dashed #E0DFD6;border-radius:var(--r-lg);padding:14px;font-size:12.5px;line-height:1.7;color:var(--ink2);margin-top:4px;}
.loading-card{background:#fff;border-radius:var(--r-lg);padding:34px 20px;text-align:center;margin-bottom:12px;box-shadow:var(--shadow-card);}
.loading-card .ld-ico{font-size:34px;line-height:1;animation:pulse 1.2s ease-in-out infinite;}
.loading-card .ld-tx{font-size:13.5px;font-weight:700;margin-top:14px;color:var(--sub);line-height:1.6;}
.err-inline{background:#FFF2DE;border:1px solid #FFF2DE;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;color:#203146;margin-top:8px;}
.src-tag{display:inline-block;font-size:11.5px;font-weight:750;padding:2px 9px;border-radius:6px;margin-bottom:8px;background:#E9F4FF;color:var(--ink);letter-spacing:.3px;}
.sk{background:linear-gradient(90deg,#E9F4FF 25%,#E9F4FF 37%,#E9F4FF 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--r-lg);margin-bottom:12px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
/* --- 首页统计：合并横条 --- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:12px;background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow-card);overflow:hidden;}
.stat{background:transparent;border-radius:0;padding:16px 8px;text-align:center;border-right:1px solid #E9F4FF;transition:background .15s;}
.stat:last-child{border-right:0;}
.stat:active{background:#E9F4FF;}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.4px;}
.stat .k{font-size:11.5px;color:var(--ink3);margin-top:4px;font-weight:600;}
.stat .d{font-size:11px;color:var(--sub);margin-top:3px;font-weight:600;}
/* --- 我的页统计列表 --- */
.stat-list .stat-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px dashed #E9F4FF;}
.stat-list .stat-row:last-child{border-bottom:none;padding-bottom:2px;}
.stat-list .stat-row .v{min-width:56px;font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.stat-list .stat-row .k{font-size:13px;color:var(--ink2);font-weight:600;}
/* --- 首页时间线 --- */
.home-tl-wrap{background:#fff;border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-card);}
.home-tl-item{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;transition:background .15s;cursor:pointer;}
.home-tl-item:active{background:#E9F4FF;}
.home-tl-item:not(:last-child)::after{content:'';position:absolute;left:27px;bottom:-7px;width:1.5px;height:15px;background:#E9F4FF;}
.home-tl-text{flex:1;font-size:14px;font-weight:550;color:var(--ink);line-height:1.5;min-width:0;}
.home-tl-text .tm{color:var(--ink3);font-size:12px;font-weight:650;margin-right:8px;display:inline-block;min-width:44px;font-variant-numeric:tabular-nums;}
.home-tl-text .sub{color:var(--sub);font-size:12.5px;display:block;margin-top:2px;line-height:1.45;font-weight:450;}
.home-tl-arrow{color:var(--ink);font-size:16px;flex:none;opacity:.55;}
.home-tl-badge{font-size:11px;color:var(--ink);background:var(--accent-soft);padding:2px 8px;border-radius:6px;font-weight:700;flex:none;}
.home-tl-item.is-done .home-tl-text{color:var(--ink3);}
.home-tl-item.is-done{opacity:.6;}
.check{width:23px;height:23px;border-radius:50%;border:2px solid #DCE8F6;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;transition:.2s;background:#fff;}
.check.done{background:var(--accent);border-color:var(--accent);}
.check.done::after{content:'✓';}
/* --- 身体状态 --- */
.body-state-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.body-state-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 2px;border-radius:12px;background:#E9F4FF;border:1.5px solid transparent;cursor:pointer;font-size:11px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.2;transition:.15s;}
.body-state-item .bsi-icon{font-size:16px;line-height:1;}
.body-state-item .bsi-label{font-size:10px;font-weight:600;white-space:nowrap;}
.body-state-item.active{background:var(--pri);color:#fff;}
.body-state-item.active .bsi-label{color:#fff;font-weight:700;}
/* --- 任务卡 --- */
.task-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card);}
.task-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.task-title{font-size:14.5px;font-weight:750;}
.task-progress{font-size:12px;color:var(--sub);font-weight:650;}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #E9F4FF;cursor:pointer;}
.task-row:last-child{border:0;}
.task-check{width:22px;height:22px;border-radius:8px;border:2px solid #DCE8F6;background:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;}
.task-check.on{background:var(--pri);border-color:var(--ink);}
.task-label{flex:1;font-size:13.5px;font-weight:550;color:var(--ink2);}
.task-label.on{color:#2F4359;text-decoration:line-through;}
.task-count{font-size:12.5px;color:var(--sub);font-weight:650;}
/* --- 复习入口 --- */
.streak-badge{display:inline-flex;align-items:center;gap:3px;background:#FFF2DE;color:#203146;font-size:11.5px;font-weight:750;padding:3px 9px;border-radius:99px;}
/* --- 知识卡 --- */
.know-q{font-size:15.5px;font-weight:750;line-height:1.5;}
.know-a{font-size:13.5px;line-height:1.78;color:var(--ink2);margin-top:12px;padding-top:12px;border-top:1px dashed #E9F4FF;}
.know-key{margin-top:12px;background:#E9F4FF;border-left:3px solid var(--pri);padding:11px 13px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.75;color:var(--ink2);}
.know-body{display:none;margin-top:12px;}
.know.open .know-body{display:block;}
.know-cat{display:inline-block;font-size:12px;font-weight:700;color:var(--ink);background:#E9F4FF;padding:3px 9px;border-radius:6px;margin-bottom:10px;letter-spacing:.3px;}
/* --- 搜索 --- */
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin:8px 0 4px;}
.search-input{flex:1;border:0;outline:0;background:transparent;font-size:14px;padding:2px 0;font-family:inherit;}
/* --- 单词卡 --- */
.word-mini{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px;}
.word-mini.done{background:#E9F4FF;opacity:.65;border-style:dashed;}
.word-mini .wm-word{font-size:15px;font-weight:750;color:var(--ink);flex-shrink:0;}
.word-mini.done .wm-word{text-decoration:line-through;color:#2F4359;}
.word-mini .wm-cn{font-size:12px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.word-mini .wm-check{width:22px;height:22px;border-radius:50%;border:2px solid #DCE8F6;background:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;}
.word-mini .wm-check.on{background:var(--pri);border-color:var(--ink);}
.word-big{font-size:32px;font-weight:850;letter-spacing:-.8px;color:var(--ink);}
.word-ph{font-size:13px;color:var(--sub);margin-top:6px;}
.deck-chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;cursor:pointer;flex-shrink:0;min-width:130px;text-align:left;font-family:inherit;}
.deck-chip.on{background:var(--pri);color:#fff;border-color:var(--ink);}
.deck-chip .dc-name{font-size:13.5px;font-weight:750;}
.deck-chip .dc-meta{font-size:12px;opacity:.7;}
.progress-bar{height:8px;background:#E9F4FF;border-radius:99px;overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .4s;}
.load-more{border:0;background:#E9F4FF;color:var(--ink2);width:100%;padding:13px;border-radius:12px;font-size:13px;font-weight:650;cursor:pointer;margin-top:6px;font-family:inherit;}
/* --- 输入 --- */
.answer-input{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.7;resize:vertical;background:#E9F4FF;margin-top:6px;font-family:inherit;transition:border-color .15s,background .15s;}
.answer-input:focus{border-color:var(--ink);background:#fff;outline:none;}
/* --- 评分卡 --- */
.score-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;}
.score-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.score-num{font-size:34px;font-weight:850;color:var(--ink);letter-spacing:-1.5px;line-height:1;}
.score-label{font-size:12px;font-weight:700;color:var(--ink2);}
.score-row{margin-top:12px;padding-top:12px;border-top:1px dashed #E9F4FF;}
.score-row-title{font-size:12px;font-weight:750;margin-bottom:8px;color:var(--ink2);}
.score-extra{background:#E9F4FF;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.78;color:var(--ink2);}
.score-list{margin:0;padding-left:18px;}
.score-list li{font-size:13px;line-height:1.75;color:var(--ink2);}
.rate-row{display:flex;gap:8px;margin-top:14px;}
.rate-btn{flex:1;border:0;padding:12px 4px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.rate-btn.again{background:#FFECEC;color:#203146;}
.rate-btn.hard{background:#FFF2DE;color:#203146;}
.rate-btn.good{background:#E3F8F1;color:#203146;}
/* --- 行项 --- */
.h-task{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #E9F4FF;}
.h-task:last-child{border-bottom:none;padding-bottom:0;}
.h-task .body{flex:1;min-width:0;}
.h-t-name{font-size:14px;font-weight:550;}
.tag{font-size:12px;padding:3px 9px;border-radius:9px;background:#E9F4FF;color:var(--ink2);font-weight:550;}
.tag.on{background:var(--accent-soft);color:var(--ink);}
.progress{height:8px;border-radius:8px;background:#E9F4FF;overflow:hidden;margin:2px 0 9px;}
.progress .bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.row-between{display:flex;justify-content:space-between;align-items:center;}
/* --- 时间线（日历） --- */
.tl{position:relative;padding-left:24px;}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:#E9F4FF;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #DCE8F6;box-sizing:border-box;}
.tl-item.done::before{background:var(--accent);border-color:var(--accent);}
.tl-time{font-size:12px;color:var(--sub);margin-bottom:3px;font-weight:550;}
.tl-title{font-size:14px;font-weight:550;}
.tl-item.done .tl-title{text-decoration:line-through;color:var(--sub);}
.tl-desc{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.55;}
/* --- 日历 --- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .m{font-size:15px;font-weight:750;}
.cal-head span.nav{color:#3B4F65;font-size:17px;cursor:pointer;padding:0 6px;}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-week div{text-align:center;font-size:12px;color:var(--ink3);padding:4px 0;font-weight:550;}
.cal-grid div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;border-radius:10px;position:relative;color:var(--ink2);cursor:pointer;user-select:none;padding:2px 0;}
.cal-grid div.empty{visibility:hidden;cursor:default;}
.cal-grid div.sel{background:var(--blue-soft);color:var(--ink);font-weight:650;}
.cal-grid div.today{background:var(--blue);color:#fff;font-weight:750;}
.cal-grid div.has::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:.75;}
.cal-grid div.today.has::after{background:#fff;opacity:1;}
.cal-grid div.holiday{color:var(--ink);font-weight:750;}
.cal-grid div.holiday .holiday-name{font-size:8px;line-height:1;margin-top:1px;font-weight:500;color:var(--ink);}
.cal-grid div.today.holiday .holiday-name{color:#fff;}
/* --- 记账 --- */
.balance{background:linear-gradient(135deg,var(--pri-deep),var(--pri2));color:#fff;border-radius:var(--r-lg);padding:20px;margin-bottom:12px;}
.balance .lab{font-size:12px;opacity:.6;letter-spacing:1px;}
.balance .big{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.5px;}
.balance .foot{display:flex;gap:26px;margin-top:16px;font-size:12.5px;opacity:.9;}
.mic-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 20px;}
.mic{width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;background:var(--pri);font-size:40px;color:#fff;transition:.2s;box-shadow:0 16px 36px -14px rgba(52,133,214,.5);}
.mic.listening{animation:pulseMic 1.4s infinite;box-shadow:0 0 0 6px rgba(45,190,152,.18);}
@keyframes pulseMic{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.mic-hint{margin-top:16px;font-size:12.5px;color:var(--sub);text-align:center;padding:0 20px;line-height:1.6;}
.mic-actions{display:flex;gap:8px;margin-top:10px;max-width:320px;width:100%;}
.text-input-area{display:none;margin-top:10px;width:100%;}
.text-input-area.show{display:block;}
.text-input-area input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:13.5px;outline:none;margin-bottom:8px;background:#E9F4FF;}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E9F4FF;cursor:pointer;border-radius:8px;}
.tx:last-child{border-bottom:none;padding-bottom:0;}
.tx .ic{width:36px;height:36px;border-radius:11px;background:#E9F4FF;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;}
.tx .body{flex:1;min-width:0;}
.tx .amt{font-weight:650;font-size:14px;margin-left:6px;font-variant-numeric:tabular-nums;}
.tx .amt.inc{color:var(--ink);}
.tx .del-tx{width:24px;height:24px;border-radius:50%;border:none;background:var(--hot-soft);color:var(--ink);font-size:12px;cursor:pointer;flex:none;line-height:1;}
.cat-chip{font-size:12.5px;padding:6px 12px;border-radius:10px;background:#E9F4FF;color:var(--ink2);font-weight:550;cursor:pointer;border:none;font-family:inherit;margin:2px;display:inline-block;}
.cat-chip.active{background:var(--accent);color:#fff;}
.cat-chip.newcat{background:var(--blue-soft);color:var(--ink);}
/* --- 运动 --- */
.sport-timer{font-size:40px;font-weight:750;color:var(--ink);text-align:center;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:4px 0 2px;line-height:1.1;}
.sport-timer-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:4px;}
.sport-meta{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap;}
.sport-meta b{color:var(--ink);font-weight:750;}
.sport-done-badge{display:inline-block;margin-top:10px;background:var(--accent-soft);color:var(--ink);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;}
.week-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #E9F4FF;font-size:13px;}
.week-row:last-child{border-bottom:none;padding-bottom:0;}
.week-row .d{width:42px;flex:none;font-weight:650;color:var(--ink2);font-size:12px;}
.week-row .dt{width:44px;flex:none;color:#2F4359;font-size:11.5px;}
.week-row .a{flex:1;color:var(--ink);line-height:1.4;}
.week-row .t{font-size:12px;color:var(--sub);flex:none;}
.week-row.today{background:var(--accent-soft);border-radius:12px;padding:10px;border-bottom:none;margin:3px 0;}
.week-row.rest .a{color:var(--ink3);}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r-md);background:#E9F4FF;border:1.5px solid transparent;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--ink2);}
.opt-item .oi-ck{width:20px;height:20px;border-radius:50%;border:2px solid #DCE8F6;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;box-sizing:border-box;}
.opt-item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);}
.opt-item.active .oi-ck{background:var(--accent);border-color:var(--accent);}
.kv{display:flex;gap:10px;padding:7px 0;font-size:12.5px;line-height:1.6;border-bottom:1px dashed #E9F4FF;}
.kv:last-child{border-bottom:none;}
.kv .k{flex:none;width:60px;color:var(--sub);font-weight:550;}
.kv .v{flex:1;color:var(--ink2);}
.kv .v.hl{color:var(--ink);font-weight:650;}
.ex-item{padding:13px 0;border-bottom:1px solid #E9F4FF;}
.ex-item:last-child{border-bottom:none;padding-bottom:0;}
.ex-top{display:flex;align-items:flex-start;gap:10px;}
.ex-top .body{flex:1;min-width:0;}
.ex-top .code{flex:none;font-size:12px;font-weight:700;color:var(--ink);background:var(--accent-soft);padding:3px 8px;border-radius:8px;margin-top:2px;}
.ex-top .t-name{font-size:14px;font-weight:550;}
.ex-top .sets{font-size:12px;color:var(--sub);margin-top:3px;}
.ex-detail{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.75;background:#E9F4FF;padding:9px 12px;border-radius:10px;}
.ex-bottom{display:flex;align-items:center;gap:10px;margin-top:11px;}
.sets-dots{display:flex;gap:5px;}
.sets-dots i{width:9px;height:9px;border-radius:50%;background:#DCE8F6;display:block;transition:.2s;}
.sets-dots i.on{background:var(--accent);}
.sets-count{font-size:12.5px;color:var(--sub);font-weight:550;}
.cnt-btn{margin-left:auto;border:none;font-family:inherit;font-size:12px;font-weight:650;color:var(--ink);background:var(--accent-soft);padding:7px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;}
.cnt-btn:disabled{opacity:.55;cursor:default;color:var(--sub);background:#E9F4FF;}
.rest-inline{margin-top:11px;display:flex;align-items:center;gap:10px;background:#E9F4FF;padding:8px 12px;border-radius:11px;flex-wrap:wrap;}
.rest-inline .rest-lb{font-size:12.5px;color:var(--ink3);flex:1;min-width:60px;}
.rest-inline .rest-num-sm{font-size:16px;font-weight:750;color:var(--ink);min-width:36px;text-align:center;font-variant-numeric:tabular-nums;}
.rest-inline .rest-btn-sm{border:none;font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;background:var(--accent-soft);color:var(--ink);}
/* --- 衣橱 --- */
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px;border:2px dashed #DCE8F6;border-radius:var(--r-lg);padding:20px;text-align:center;color:#3E5065;font-size:12.5px;background:#fff;margin-bottom:12px;cursor:pointer;position:relative;}
.upload .plus{display:block;font-size:28px;color:#3B4F65;margin-bottom:6px;}
.upload input[type=file]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.upload img{max-width:100%;max-height:200px;border-radius:12px;margin-top:8px;display:block;}
.lib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.lib-item{position:relative;background:#E9F4FF;border-radius:var(--r-md);padding:10px;text-align:center;overflow:hidden;}
.lib-item .thumb{width:100%;height:110px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;}
.lib-item .thumb img{max-width:100%;max-height:100%;object-fit:contain;}
.lib-item .thumb .placeholder{font-size:32px;color:#3B4F65;}
.lib-item .n{font-size:12.5px;color:var(--ink);font-weight:650;margin-bottom:3px;}
.lib-item .s{font-size:11.5px;color:var(--sub);}
.lib-item .del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--hot-soft);color:var(--ink);font-size:12px;cursor:pointer;line-height:1;z-index:2;}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.cat-tab{font-size:12.5px;padding:5px 11px;border-radius:9px;background:#E9F4FF;color:var(--ink2);font-weight:550;cursor:pointer;border:none;font-family:inherit;}
.cat-tab.active{background:var(--pri);color:#fff;}
/* --- 表单行 --- */
.dim-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #E9F4FF;}
.dim-row:last-child{border-bottom:none;}
.dim-row .lb{flex:1;font-size:13px;color:var(--ink2);font-weight:550;}
.dim-row .unit{font-size:12px;color:var(--sub);flex:none;}
.dim-row input[type=number],.dim-row input[type=text],.dim-row input[type=date],.dim-row input[type=time],.dim-row select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:#fff;outline:none;flex:none;}
.dim-row input[type=text]{text-align:left;}
.mini-add{font-size:12.5px;padding:5px 11px;border-radius:9px;border:none;background:var(--pri);color:#fff;font-weight:650;cursor:pointer;font-family:inherit;white-space:nowrap;}
.mini-add.ghost{background:#E9F4FF;color:#203146;}
.body-group-title{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:1px;margin:14px 0 4px;padding-top:10px;border-top:1px dashed #E9F4FF;}
.body-group-title:first-child{margin-top:0;padding-top:0;border-top:none;}
/* --- 护肤 --- */
.profile-card{background:#fff;border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);}
.profile-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #E9F4FF;}
.profile-row:last-child{border-bottom:none;}
.profile-row .pr-lb{flex:none;width:56px;font-size:12.5px;color:var(--sub);font-weight:550;}
.profile-row .pr-opts{flex:1;display:flex;gap:6px;flex-wrap:wrap;}
.pr-opt{font-size:12.5px;padding:5px 11px;border-radius:9px;background:#E9F4FF;color:var(--ink2);font-weight:550;cursor:pointer;}
.pr-opt.active{background:var(--pink);color:#fff;}
.supp{display:flex;align-items:center;gap:13px;padding:13px 14px;background:#fff;border-radius:16px;margin-bottom:10px;transition:.2s;border:1px solid var(--line);}
.supp.taken{background:var(--pink-soft);}
.supp .e{width:40px;height:40px;border-radius:13px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
.supp.taken .e{background:#fff;}
.supp .body{flex:1;cursor:pointer;}
.supp .n{font-size:14px;font-weight:550;}
.supp.taken .n{color:var(--ink);text-decoration:line-through;}
.supp .s{font-size:12.5px;color:var(--sub);margin-top:3px;}
.supp .del{width:26px;height:26px;border-radius:50%;border:none;background:var(--hot-soft);color:var(--ink);font-size:14px;cursor:pointer;flex:none;}
.follow-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px;}
.follow-bar .btn{padding:6px 11px;font-size:12px;border-radius:9px;}
.follow-result{width:100%;}
.hero-card .follow-bar .btn.ghost{background:#fff;color:#121C2A;border-color:transparent;}
/* --- 悬浮按钮 --- */
.fab{position:absolute;right:8px;bottom:calc(104px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:18px;background:var(--pri);color:#fff;border:0;font-size:20px;cursor:pointer;box-shadow:0 12px 28px -12px rgba(52,133,214,.55);z-index:50;display:grid;place-items:center;transition:transform .15s,opacity .35s;opacity:.88;touch-action:none;user-select:none;}
.fab:active{transform:scale(.92);}
.fab.dragging{opacity:1 !important;transform:scale(1.1);}
.fab.dim{opacity:.28;}
/* --- 底部弹层 --- */
#sheet{position:absolute;inset:0;z-index:60;pointer-events:none;}
#sheet.open{pointer-events:auto;}
.sheet-mask{position:absolute;inset:0;background:rgba(20,22,30,.42);opacity:0;transition:opacity .28s;}
#sheet.open .sheet-mask{opacity:1;}
.sheet-body{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:88%;overflow-y:auto;}
.sheet-body::before{content:'';display:block;width:40px;height:4px;border-radius:99px;background:#E9F4FF;margin:0 auto 14px;}
#sheet.open .sheet-body{transform:translateY(0);}
.sheet-head{display:flex;gap:14px;align-items:center;margin-bottom:6px;}
.sheet-emoji{font-size:38px;}
.sheet-head h2{font-size:19px;margin:0 0 4px;letter-spacing:-.3px;}
/* --- Toast --- */
.toast{position:absolute;left:50%;bottom:160px;transform:translate(-50%,10px);background:rgba(25,27,34,.94);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
/* --- AI --- */
.ai-msg{padding:12px 14px;border-radius:16px;margin-bottom:10px;font-size:13.5px;line-height:1.75;}
.ai-msg.user{background:var(--pri);color:#fff;margin-left:32px;white-space:pre-wrap;border-radius:16px 16px 4px 16px;}
.ai-msg.bot{background:#E9F4FF;color:var(--ink);margin-right:32px;white-space:pre-wrap;border-radius:16px 16px 16px 4px;}
.ai-role-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.ai-role-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:650;cursor:pointer;color:var(--ink2);font-family:inherit;}
.ai-role-btn.on{background:var(--pri);color:#fff;border-color:var(--ink);}
.status-badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:750;flex-shrink:0;}
.status-badge.ok{background:var(--accent-soft);color:var(--ink);}
.status-badge.warn{background:#FFF2DE;color:#203146;}
select,input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;background:#E9F4FF;font-family:inherit;color:var(--ink);}
.link-btn{background:none;border:0;color:var(--ink2);font-size:12px;font-weight:650;cursor:pointer;padding:4px 8px;font-family:inherit;}
#ttsPlayer{display:none;}
/* --- 居中计时 --- */
.center-timer{position:absolute;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(20,22,30,.5);}
.center-timer.show{display:flex;}
.center-timer .box{background:#fff;border-radius:28px;padding:32px 32px 24px;text-align:center;max-width:320px;}
.center-timer .big{font-size:64px;font-weight:750;color:var(--ink);letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;}
.center-timer .txt{margin-top:14px;font-size:16px;color:var(--ink);font-weight:650;}
.center-timer .sub{margin-top:8px;font-size:12.5px;color:var(--sub);line-height:1.7;}
.center-timer .actions{display:flex;gap:8px;margin-top:20px;}
.center-timer .actions button{flex:1;border:0;font-family:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;}
.center-timer .actions .btn-skip{background:#E9F4FF;color:var(--ink2);}
.center-timer .actions .btn-ok{background:var(--pri);color:#fff;}
/* --- 导入导出 --- */
.import-option{padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-md);cursor:pointer;margin-bottom:10px;background:#fff;transition:.15s;}
.import-option:active{transform:scale(.98);background:#E9F4FF;}
.import-option.primary{border-color:var(--pri);background:#E9F4FF;}
.import-option .io-title{font-size:14px;font-weight:750;margin-bottom:4px;}
.import-option .io-desc{font-size:12px;color:var(--sub);line-height:1.5;}
.import-option.primary .io-title{color:var(--ink);}
.backup-warn{background:#FFECEC;border:1px solid #FFECEC;color:#203146;border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer;}
.backup-warn:active{background:#FFECEC;}
/* --- 产品库 --- */
.prod-lib-card{background:#fff;border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(25,27,34,.03);position:relative;}
.prod-lib-card.expired{opacity:.65;background:#E9F4FF;border-style:dashed;}
.prod-lib-card .plc-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.prod-lib-card .plc-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FFECEC,#FFECEC);display:grid;place-items:center;font-size:18px;flex-shrink:0;}
.prod-lib-card .plc-body{flex:1;min-width:0;}
.prod-lib-card .plc-name{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4;word-break:break-all;padding-right:24px;}
.prod-lib-card .plc-meta{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.55;}
.prod-lib-card .plc-badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:4px;margin-top:2px;}
.prod-lib-card .plc-badge.ok{background:var(--accent-soft);color:var(--ink);}
.prod-lib-card .plc-badge.warn{background:#FFF2DE;color:#203146;}
.prod-lib-card .plc-badge.danger{background:var(--hot-soft);color:var(--ink);}
.prod-lib-card .plc-badge.info{background:var(--blue-soft);color:var(--ink);}
.prod-lib-card .plc-del{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:none;background:var(--hot-soft);color:var(--ink);font-size:12px;cursor:pointer;line-height:1;}
/* --- 护肤流程 --- */
.routine-step{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed #E9F4FF;}
.routine-step:last-child{border-bottom:none;}
/* P51：切子菜单后的轻微淡入 + 选中胶囊脉冲，和主流 App 一致（只做透明度/缩放，不影响吸顶） */
@keyframes p51Fade{from{opacity:.72}to{opacity:1}}
@keyframes p51TabPulse{0%{transform:scale(.94);opacity:.7}100%{transform:scale(1);opacity:1}}
.p51-swap{animation:p51Fade .22s ease-out;}
.p51-swap .subtab.on{animation:p51TabPulse .24s ease-out;}
.routine-step .rs-num{width:24px;height:24px;border-radius:50%;background:var(--pink-soft);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;}
.routine-step .rs-body{flex:1;min-width:0;}
.routine-step .rs-title{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.4;}
.routine-step .rs-prod{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.55;}
.routine-step .rs-note{font-size:12.5px;color:#203146;margin-top:3px;line-height:1.55;background:#FFECEC;padding:4px 8px;border-radius:6px;display:inline-block;}
.routine-step .rs-days{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:var(--ink);flex-shrink:0;margin-top:1px;}
.routine-step .rs-days.warn{background:#FFF2DE;color:#203146;}
.routine-step .rs-days.danger{background:var(--hot-soft);color:var(--ink);}
#fatal-error{display:none;padding:20px;color:#203146;background:#FFECEC;font-size:14px;line-height:1.6;word-break:break-all;}.p55-lazy{content-visibility:auto;contain-intrinsic-size:auto 72px;}#netBanner{display:none;position:absolute;top:0;left:0;right:0;z-index:9998;background:#FFF2DE;color:#203146;font-size:12.5px;padding:8px 12px;text-align:center;border-bottom:1px solid #F0D9AE;}
.timeline-divider{display:flex;align-items:center;gap:8px;margin:14px 4px 8px;font-size:12.5px;color:var(--sub);font-weight:600;cursor:pointer;}
.timeline-divider::before,.timeline-divider::after{content:'';flex:1;height:1px;background:#E9F4FF;}
.timeline-divider:active{opacity:0.7;}
/* --- 空状态 --- */
.empty-state{text-align:center;padding:36px 20px;background:#fff;border-radius:var(--r-lg);border:1px dashed #DCE8F6;margin-bottom:12px;}
.empty-state .es-icon{font-size:44px;line-height:1;margin-bottom:12px;opacity:0.85;}
.empty-state .es-title{font-size:15px;font-weight:750;color:var(--ink2);margin-bottom:6px;}
.empty-state .es-desc{font-size:12.5px;color:var(--sub);line-height:1.6;}
.sheet-form-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #E9F4FF;}
.sheet-form-row .lb{width:56px;font-size:13px;color:var(--ink2);font-weight:600;flex:none;}
.sheet-form-row input[type=text],.sheet-form-row input[type=date],.sheet-form-row input[type=time],.sheet-form-row textarea{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;font-weight:500;background:#E9F4FF;outline:none;}
.sheet-form-row textarea{min-height:60px;resize:vertical;}
.svg-icon{width:18px;height:18px;vertical-align:-3px;fill:currentColor;margin-right:4px;}


/* ================= V3 增补组件 ================= */
.top-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:#121C2A;cursor:pointer;flex-shrink:0;padding:0;box-shadow:0 1px 3px rgba(25,27,34,.05);}
.top-btn:active{transform:scale(.93);}

/* 复习卡样式（P48 起世界·今日不再使用） */
.rv-card{background:linear-gradient(135deg,var(--pri-deep),var(--pri2));color:#fff;border-radius:20px;padding:17px 18px;margin-bottom:14px;box-shadow:0 14px 30px -18px rgba(52,133,214,.7);}
.rv-card.empty{background:#fff;color:#121C2A;border:1px solid var(--line);box-shadow:0 2px 8px rgba(25,27,34,.04);}
.rv-top{display:flex;justify-content:space-between;align-items:flex-start;}
.rv-k{font-size:12px;letter-spacing:1.2px;font-weight:700;opacity:.82;}
.rv-card.empty .rv-k{color:var(--sub);opacity:1;}
.rv-v{font-size:23px;font-weight:850;margin-top:6px;letter-spacing:-.4px;}
.rv-ico{font-size:22px;opacity:.85;}
.rv-sub{font-size:12.5px;line-height:1.65;opacity:.85;margin-top:8px;}
.rv-card.empty .rv-sub{color:var(--sub);opacity:1;}
.rv-nums{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.rv-nums span{font-size:12px;font-weight:650;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;}
.rv-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.rv-btn{flex:1;min-width:118px;background:#fff;color:#121C2A;border:0;border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:750;font-family:inherit;cursor:pointer;}
.rv-btn:active{transform:scale(.98);}

/* 全局搜索 */
.srch-wrap{padding:2px 0 10px;}
.srch-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.srch-title{font-size:17px;font-weight:800;}
.srch-input{width:100%;border:1px solid var(--line);background:#E9F4FF;border-radius:14px;padding:13px 15px;font-size:15px;font-family:inherit;outline:none;}
.srch-input:focus{border-color:var(--pri);background:#fff;}
.srch-tip{font-size:13px;color:var(--sub);text-align:center;padding:26px 0;line-height:1.7;}
.srch-sec{font-size:12px;font-weight:750;color:var(--sub);letter-spacing:.6px;margin:16px 0 4px;}
.srch-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #FFF2DE;cursor:pointer;}
.srch-row:last-child{border-bottom:0;}
.srch-row .t{font-size:14px;font-weight:700;line-height:1.45;}
.srch-row .d{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5;}
.srch-row .i{width:30px;height:30px;border-radius:9px;background:#E9F4FF;display:grid;place-items:center;font-size:14px;flex-shrink:0;}

/* 记账报表 */
.rep-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rep-kpi > div{background:#E9F4FF;border-radius:14px;padding:13px 14px;}
.rep-kpi .k{font-size:12px;color:var(--sub);font-weight:600;}
.rep-kpi .v{font-size:20px;font-weight:850;margin-top:5px;letter-spacing:-.3px;}
.rep-bar{height:8px;border-radius:99px;background:#E9F4FF;overflow:hidden;margin-top:6px;}
.rep-bar > i{display:block;height:100%;border-radius:99px;background:var(--pri);}
.rep-line{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:2px;}
.rep-delta{font-size:12px;font-weight:750;padding:2px 8px;border-radius:99px;}

/* 运动趋势 */
.trend{display:flex;align-items:flex-end;gap:7px;height:104px;padding:6px 2px 0;}
.trend > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px;}
.trend b{display:block;width:100%;background:#6FB0EC;border-radius:6px 6px 3px 3px;min-height:3px;}
.trend b.hot{background:var(--pri);}
.trend .lb{font-size:10px;color:var(--sub);}

/* 速查表 */
.q-table{width:100%;border-collapse:collapse;font-size:13px;}
.q-table th,.q-table td{padding:9px 6px;border-bottom:1px solid #E9F4FF;text-align:left;vertical-align:top;line-height:1.6;}
.q-table th{font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.4px;}

/* 成分卡 */
.ing-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#fff;}
.ing-h{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ing-n{font-size:15px;font-weight:800;}
.ing-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#E9F4FF;color:#121C2A;flex-shrink:0;}
.ing-row{font-size:12.5px;line-height:1.72;color:#121C2A;margin-top:7px;}

/* 护肤打卡 */
.sk-steps{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.sk-step{border:1px solid var(--line);background:#E9F4FF;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:650;color:#121C2A;cursor:pointer;font-family:inherit;}
.sk-step.on{background:#E3F8F1;border-color:#E3F8F1;color:#203146;}

/* 设置行 */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #FFF2DE;}
.set-row:last-child{border-bottom:0;}
.set-lab{font-size:14px;font-weight:650;}
.set-hint{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;}
.seg{display:flex;gap:4px;background:#FFF2DE;padding:3px;border-radius:11px;flex-shrink:0;}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:650;color:#121C2A;font-family:inherit;cursor:pointer;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(25,27,34,.1);}

/* 今日一题 */
.quiz-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#E9F4FF;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:#121C2A;font-family:inherit;cursor:pointer;margin-bottom:8px;}
.quiz-opt:active{transform:scale(.99);}
.quiz-opt.right{background:#E3F8F1;border-color:#E3F8F1;color:#203146;font-weight:700;}
.quiz-opt.wrong{background:#FFECEC;border-color:#FFECEC;color:#203146;font-weight:700;}

/* 离线缓存标记 */
.offline-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#203146;background:#FFF2DE;padding:2px 7px;border-radius:6px;}

/* --- 养成：重新养一遍自己 --- */
.grow-hero{background:linear-gradient(135deg,var(--pri-deep),var(--pri2));border-radius:20px;padding:18px 16px 16px;color:#fff;position:relative;overflow:hidden;}
.grow-hero .glow{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);}
.grow-top{display:flex;gap:14px;align-items:center;position:relative;}
.grow-ava{width:96px;height:96px;flex-shrink:0;background:rgba(255,255,255,.16);border-radius:24px;display:flex;align-items:center;justify-content:center;}
.grow-ava svg{width:84px;height:84px;}

<script>
const _errs = [];
window.onerror = function(msg, url, line, col){
  _errs.push({ msg, url, line, col, t: Date.now() });
  try { window.__errLog.add('onerror', msg, url + ':' + line + ':' + col); } catch(e){}
  console.error('[onerror]', msg, line, col);
  var el = document.getElementById('fatal-error');
  if (el){
    el.style.display = 'block';
    el.textContent = '脚本错误: ' + msg + ' @' + line + ':' + col +
                     '（共 ' + _errs.length + ' 个，详见控制台）';
  }
  return false;
};
window.addEventListener('error', e => { console.error('Error:', e.message); try { window.__errLog.add('error', e.message, e.filename || ''); } catch(_){} });
window.addEventListener('unhandledrejection', e => { console.error('Promise:', e.reason); try { window.__errLog.add('promise', (e.reason && e.reason.message) || e.reason); } catch(_){} });

window.onWidgetCheckin = function(key, done) {
    try {
        if (key.startsWith('todo_')) {
            const payloadStr = key.substring(5);
            try {
                const payload = JSON.parse(decodeURIComponent(payloadStr));
                const item = (getManualTodos()[payload.date] || []).find(x => (x.time || '') === (payload.time || '') && x.title === payload.title);
                if (item) { 
                    const m = getTodoStatusMap(); 
                    const k = getTodoKey(payload.date, item); 
                    if (done) m[k] = true; else delete m[k]; 
                    saveTodoStatusMap(m); 
                }
            } catch(err) { console.error('parse todo error', err); }
        } else { 
            setCheck(key, done); 
        }
        render({ keepScroll: true }); 
        syncToNativeWidget();
    } catch (e) { console.error('onWidgetCheckin error:', e); }
};

window.mergeNativeWidgetCheckins = function(){
    try {
        /* ★ 正在选图/读图/AI 识别时，绝不能整页重绘：render() 会替换
           <input type=file> 和预览节点，让刚选中的照片「消失」。 */
        if (window._photoBusy) return;
        if (!window.AndroidBridge || !AndroidBridge.getWidgetTimelineData) return;
        const raw = AndroidBridge.getWidgetTimelineData();
        const items = JSON.parse(raw || '[]');
        if (!Array.isArray(items)) return;
        const checks = getChecks();
        const todoMap = getTodoStatusMap();
        let changed = false;
        items.forEach(item => {
            if (!item || !item.key || String(item.key).startsWith('dummy_')) return;
            if (String(item.key).startsWith('todo_')) {
                try {
                    const payload = JSON.parse(decodeURIComponent(String(item.key).slice(5)));
                    const list = getManualTodos()[payload.date] || [];
                    const target = list.find(x => (x.time || '') === (payload.time || '') && x.title === payload.title);
                    if (target) {
                        const k = getTodoKey(payload.date, target);
                        if (item.done){ if (!todoMap[k]){ todoMap[k] = true; changed = true; } }
                        else if (todoMap[k]){ delete todoMap[k]; changed = true; }
                    }
                } catch(err) { console.warn('widget todo merge skipped', err); }
            } else {
                const k = String(item.key);
                if (item.done){ if (!checks[k]){ checks[k] = true; changed = true; } }
                else if (checks[k]){ delete checks[k]; changed = true; }
            }
        });
        /* 原实现对每个 item 都无条件 changed=true，只要小组件有打卡记录，
           每次回前台必 render 一次 —— 这正是选完照片后「界面跳一下」的来源。 */
        if (changed) { saveChecks(checks); saveTodoStatusMap(todoMap); render({ keepScroll:true }); }
    } catch(e) { console.warn('mergeNativeWidgetCheckins failed', e); }
};

window.jumpFromNative = function(route) {
    try {
        if (route === 'money') { state.tab = 'life'; state.lifeSub = 'money'; state.moneySub = 'record'; render(); }
        else if (route === 'study') { state.tab = 'study'; state.studySub = 'today'; render(); }
        else if (route === 'care_skin') { state.tab = 'life'; state.lifeSub = 'care'; state.careSub = 'skin'; render(); }
        else if (route === 'care_supp') { state.tab = 'life'; state.lifeSub = 'care'; state.careSub = 'supp'; render(); }
        else if (route === 'sport') { state.tab = 'life'; state.lifeSub = 'sport'; state.sportSub = 'plan'; render(); }
        else if (route === 'calendar') { state.tab = 'life'; state.lifeSub = 'calendar'; render(); }
        else { state.tab = 'home'; render(); }
    } catch (e) { console.error('jumpFromNative error:', e); }
};

function syncToNativeWidget() {
    try {
        if (window.AndroidBridge && window.AndroidBridge.syncWidgetData) {
            const t = todayStr(); const checks = getChecks();
            const manualTodos = (getManualTodos()[t] || []).slice();
            const ov = getOverride(new Date()); const ovMap = { swim:'游泳', reduced:'减量训练', period:'经期休息', leave:'请假', rest:'休息' };
            const plan = currentPlan(); let sportText = plan.label; if (ov && ovMap[ov]) sportText = ovMap[ov];
            const showProtein = (!ov) || ov === 'swim' || ov === 'reduced';
            const fixedItems = [
                { time:'07:40', text:'起床 - 晨间 90/90 呼吸', checkKey: `home_${t}_wake`, icon: '🌅' }, { time:'07:45', text:'护肤', checkKey: `home_${t}_skin_am`, icon: '🧴' },
                { time:'07:50', text:'早饭（记得吃补剂）', checkKey: `home_${t}_breakfast`, icon: '🥣' }, { time:'08:00', text:'上班 / 通勤', checkKey: `home_${t}_commute`, icon: '💼' },
                { time:'12:00', text:'中饭（记得吃补剂）', checkKey: `home_${t}_lunch`, icon: '🍱' }, { time:'12:30', text:'学习', checkKey: `home_${t}_study`, icon: '📚' },
                { time:'18:00', text:'晚饭（记得吃补剂）', checkKey: `home_${t}_dinner`, icon: '🍲' }, { time:'19:30', text: sportText, checkKey: `home_${t}_sport`, icon: '🏃' },
                { time:'22:00', text:'洗漱（护肤）', checkKey: `home_${t}_skin_pm`, icon: '🐱' }, { time:'22:30', text:'睡前 90/90 呼吸', checkKey: `home_${t}_breathe`, icon: '🌙' }
            ];
            if (showProtein) fixedItems.push({ time:'20:30', text:'吃蛋白粉', checkKey: `home_${t}_protein`, icon: '🥛' });
            const todoItems = manualTodos.map(mt => ({ time: mt.time || '99:99', text: mt.title, key: 'todo_' + encodeURIComponent(JSON.stringify({ date: t, time: mt.time, title: mt.title })), done: !!getTodoStatusMap()[getTodoKey(t, mt)], icon: '📝' }));
            const allTimeline = fixedItems.map(it => ({ time: it.time, text: it.text, icon: it.icon, key: it.checkKey, done: !!checks[it.checkKey] }));
            const finalTimeline = [...allTimeline, ...todoItems];
// 【修复】未完成在前，已完成在后
finalTimeline.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (a.time || '99:99').localeCompare(b.time || '99:99');
});
            if (window.AndroidBridge.syncTimelineData) window.AndroidBridge.syncTimelineData(JSON.stringify(finalTimeline));
            const tasks = LearnStore.getTodayTasks(); const doneTasks = tasks.filter(x => x.done).length; const studyText = `今日学习：${doneTasks}/${tasks.length}`;
            const monthTx = transactions.filter(x => x.date.startsWith(t.slice(0,7))); const monthExp = monthTx.filter(x => x.type === 'expense').reduce((s,x) => s + x.amount, 0); const expenseText = `本月支出：¥${monthExp.toFixed(0)}`;
            window.AndroidBridge.syncWidgetData(studyText, expenseText);
        }
    } catch (e) { console.error('syncToNativeWidget error:', e); }
}

const DAY = Math.floor((Date.now() + 8*3600*1000) / 86400000);
const WEEK = Math.floor(DAY / 7);
const DAILY_WORD_COUNT = 3, DAILY_VALVE_COUNT = 5, REVIEW_TARGET = 5, PAGE_SIZE = 50;

function bjDate(){ return new Date(Date.now() + 8*3600*1000); }
function todayStr(){ const d = bjDate(); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function prevDayStr(){ const d = new Date(Date.now()-86400000+8*3600*1000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtShort(d){ return (d.getMonth()+1)+'/'+d.getDate(); }

const LS = {
  get(k,d){ try { const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); } catch(e){ return d; } },
  set(k,v){
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch(e){
      if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)){
        console.warn('[LS] 存储已满:', k);
        try { toast('本地存储已满，部分数据可能未保存'); } catch(_){}
      } else {
        console.warn('[LS] set 失败:', k, e);
      }
    }
  },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ============ 动作库关联外部文件 ============
const APP_EXERCISES = window.__EXERCISES_DATA || window.EXERCISES || {};

function mkEx(code, sets, reps, load){ 
  return { 
    code, 
    sets, 
    reps, 
    dose: reps, 
    load, 
    ...(APP_EXERCISES[code] || {name:code,purpose:'',how:'',breath:'',target:'',detail:'',mistakes:'',equipment:''}) 
  }; 
}
function getPlanDetail(weekPhase, dow) {
  const plan = { warmup: [], exercises: [], stretch: [], tips: [] };
  plan.warmup = [mkEx('P1 90/90 呼吸', 1, '5次', '自重'), mkEx('P2 下巴轻收', 1, '8次', '自重'), mkEx('P3 墙面滑手', 1, '8次', '自重'), mkEx('S2 臂桥', 1, '8次', '自重')];
  plan.stretch = [mkEx('P1 90/90 呼吸', 1, '5次', '自重')];

function pickWhyTopics(n){
  const cats = Object.keys(WHY_TOPICS);
  const used = LS.get('why-used-words', []) || [];
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 300){
    const cat = cats[Math.floor(Math.random() * cats.length)];
    const arr = WHY_TOPICS[cat].filter(w => used.indexOf(w) < 0 && out.indexOf(w) < 0);
    if (!arr.length) continue;
    out.push(arr[Math.floor(Math.random() * arr.length)]);
  }
  if (out.length) LS.set('why-used-words', used.concat(out).slice(-80));
  return out;
}

async function fetch60s(path, timeout){
  let lastErr = null;
  for (const host of API_60S_HOSTS){
    try { return await S60.get(host + path, timeout); }
    catch(e){ lastErr = e; console.warn('[60s] 源不可用：' + host, e.message); }

const S60 = {
  _chain: Promise.resolve(),
  _last: 0,
  get(url, timeout){
    const t = timeout || 9000;
    const run = async () => {
      const wait = this._last + 1100 - Date.now();
      if (wait > 0) await sleepMs(wait);
      let lastErr = null;
      for (let attempt = 0; attempt < 3; attempt++){
        try {
          this._last = Date.now();
          return await raceTimeout(fetchJson(url, t), t + 2000);
        } catch(e){
          lastErr = e;
          const msg = String((e && e.message) || e);
          if (attempt >= 2) break;
          const limited = /429|请求过于频繁|429/.test(msg);
          await sleepMs(limited ? 2400 * (attempt + 1) : 900);
        }
      }
      throw lastErr || new Error('60s 请求失败');
    };
    const p = this._chain.then(run, run);
    this._chain = p.catch(() => {});
    return p;
  }
};
