  const g = c.garment || {}; const t = getSizeType(c.cat); const rows = [];
  const add = (label, val, bv, soft, hard) => { if (!val || !bv) return; const e = val - bv; rows.push({ label, e, fit: fitEase(e, soft, hard) }); };
  if (t === 'cloth'){
    add('胸围', g.bust, body.bust, 2, 6); add('肩宽', body.shoulder && g.shoulder ? g.shoulder : 0, body.shoulder, 1.5, 3.5);
    add('下摆/腰围', g.waist, body.waist, 4, 10); add('袖长', g.sleeve, (body.armLength||0)*0.85, 3, 5);
  } else if (t === 'pants'){
    add('腰围', g.waist, body.waist, 2, 5); add('臀围', g.hip, body.hip, 2.5, 6);
    add('大腿围', g.thigh, body.thigh, 2, 6); add('裤长', g.length, body.inseam, 3, 5);
  } else if (t === 'shoes'){
    add('脚长', g.footLength, body.footLength, 0.4, 0.9); add('脚宽', g.footWidth, body.footWidth, 0.2, 0.6);
  }
  if (!rows.length) return null;
  let score = 100;
  rows.forEach(r => { score -= (r.fit.k === 'tight' || r.fit.k === 'loose') ? 14 : ((r.fit.k === 'slight-tight' || r.fit.k === 'slight-loose') ? 5 : 0); });
  return { rows, score: Math.max(0, score) };
}
function bodyFitReport(){
  const sh = calcShape();
  const whr = (body.waist / body.hip).toFixed(2);
  const legRatio = body.height ? Math.round(body.legLength / body.height * 100) : 0;
  const topTips = { '梨形':'上身选亮色、有肩部设计感的款式；下身深色直筒，避开紧包臀。', '倒三角型':'避开垫肩/泡泡袖，V 领和落肩更柔和；下装可放量平衡。', '沙漏型':'收腰、V 领、合身剪裁最能突出腰线。', '矩形':'用腰带、荷叶边、A 字下摆制造曲线。' }[sh.name] || '按肩腰臀比例选择合身版型。';
  const lowerTips = (body.hip - body.shoulder >= 6) ? '下装：高腰直筒/微喇，臀围留 2–6cm 松量最舒服。' : '下装：高腰 + 短上衣可拉长比例，裤长参考内腿长 ' + body.inseam + 'cm。';
  const scored = clothes.map(c => ({ c, f: garmentFitScore(c) })).filter(x => x.f);
  const best = scored.slice().sort((a,b) => b.f.score - a.f.score).slice(0, 3);
  const risky = scored.filter(x => x.f.rows.some(r => r.fit.k === 'tight')).slice(0, 2);
  const line = x => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px dashed #E9F4FF;"><span style="color:#121C2A;">${esc(x.c.name || (CATEGORIES[x.c.cat]||{}).label || '单品')}</span><span style="color:${x.f.score>=80?'#2DBE98':'#E9A03C'};font-weight:700;">${x.f.score} 分</span></div>`;
  return `<div class="card" style="border:2px solid var(--purple);background:#E9F4FF;">
    <div style="font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:8px;">👗 体型与穿衣报告</div>
    <div style="font-size:13px;line-height:1.8;color:#121C2A;">
      <div><b>${esc(sh.name)}</b> · ${esc(sh.desc)} · 腰臀比 ${whr} · 腿长约占身高 ${legRatio}%</div>
      <div style="margin-top:6px;">上衣：${esc(topTips)}</div>
      <div>下装：${esc(lowerTips)}</div>
      <div style="margin-top:6px;color:var(--sub);font-size:12px;">参考尺寸：胸 ${body.bust} / 腰 ${body.waist} / 臀 ${body.hip} / 肩 ${body.shoulder} / 臂长 ${body.armLength} / 内腿长 ${body.inseam} cm</div>
    </div>
    ${best.length ? `<div style="margin-top:12px;font-size:12.5px;font-weight:750;color:var(--ink);">衣橱里最合身的 ${best.length} 件</div>${best.map(line).join('')}` : '<div style="margin-top:12px;font-size:12px;color:var(--sub);">去衣橱录入几件衣服的实际尺寸，这里会排出合身榜。</div>'}
    ${risky.length ? `<div style="margin-top:10px;font-size:12px;font-weight:750;color:#203146;">⚠️ 可能偏紧，试穿留意</div>${risky.map(line).join('')}` : ''}
    <button class="btn ghost wide" style="margin-top:12px;" data-act="gotoCloset">去衣橱 →</button>
  </div>`;
}
function fitEase(ease, soft, hard){ if (ease < -hard) return { k:'tight', t:'偏紧', color:'#EC6A6A', bg:'#FFECEC' }; if (ease < -soft) return { k:'slight-tight', t:'略紧', color:'#E9A03C', bg:'#FFF2DE' }; if (ease <= soft) return { k:'ok', t:'合身', color:'#2DBE98', bg:'#E3F8F1' }; if (ease <= hard) return { k:'slight-loose', t:'略松', color:'#3485D6', bg:'#E9F4FF' }; return { k:'loose', t:'偏松', color:'#3485D6', bg:'#E9F4FF' }; }
function analyzeGarment(){ 
  const cat = state.closetCat || 'top'; 
  const sizeType = getSizeType(cat); 
  if (sizeType === 'free') return null; 
  const g = state.garmentDraft || {}; 
  const rows = [], suggestions = []; 
  const shape = calcShape(); 
  
  if (sizeType === 'cloth'){ 
    if (g.bust){ const e = g.bust - body.bust; rows.push({ key:'bust', label:'胸围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,6) }); } 
    if (g.shoulder){ const d = body.shoulder - g.shoulder; rows.push({ key:'shoulder', label:'肩宽差', value:d>0?`身体宽 ${d.toFixed(1)} cm`:`衣服宽 ${(-d).toFixed(1)} cm`, fit:fitEase(d,1.5,3.5) }); } 
    if (g.length){ const bodyLen = body.height * 0.37; const e = g.length - bodyLen; rows.push({ key:'length', label:'衣长 vs 身高', value:`衣长 ${g.length}cm · 参考 ${bodyLen.toFixed(0)}cm`, fit:fitEase(e,-5,10) }); } 
    if (g.sleeve){ const refSleeve = body.armLength * 0.85; const e = g.sleeve - refSleeve; rows.push({ key:'sleeve', label:'袖长', value:`袖长 ${g.sleeve}cm · 参考 ${refSleeve.toFixed(0)}cm`, fit:fitEase(e,-3,5) }); } 
    if (g.waist && cat === 'coat'){ const e = g.waist - body.waist; rows.push({ key:'waist', label:'腰围松量（收腰款）', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,4,10) }); } 
    if (shape.name === '梨形') suggestions.push('梨形：上半身穿亮色、有设计感的款式，下半身选深色简洁剪裁。'); 
    if (shape.name === '倒三角型') suggestions.push('倒三角：避免垫肩、泡泡袖，下半身可选阔腿裤/A字裙平衡。'); 
    if (shape.name === '沙漏型') suggestions.push('沙漏：适合收腰、V领、合身剪裁，突出腰线。'); 
    if (shape.name === '矩形') suggestions.push('矩形：可用腰带、荷叶边、A字裙制造曲线感。'); 
    if (rows.filter(r=>r.fit.k==='tight').length) suggestions.push('肩宽/胸围偏紧：建议选大一号，或换落肩/宽松版型。'); 
  } 
  if (sizeType === 'pants'){ 
    if (g.waist){ const e = g.waist - body.waist; rows.push({ key:'waist', label:'腰围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,5) }); } 
    if (g.hip){ const e = g.hip - body.hip; rows.push({ key:'hip', label:'臀围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2.5,6) }); } 
    if (g.length){ const ref = body.inseam; const e = g.length - ref; rows.push({ key:'length', label:'裤长 vs 内腿长', value:`裤长 ${g.length}cm · 内腿 ${ref}cm`, fit:fitEase(e,-3,5) }); } 
    if (g.thigh){ const e = g.thigh - body.thigh; rows.push({ key:'thigh', label:'大腿围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,6) }); } 
    if (shape.name === '梨形') suggestions.push('梨形：选高腰、直筒或微喇裤，避免过紧的臀部。'); 
    if (shape.name === '倒三角型') suggestions.push('倒三角：选阔腿裤、喇叭裤平衡比例。'); 
    if (shape.name === '矩形') suggestions.push('矩形：选高腰裤 + 短上衣制造比例。'); 
    if (rows.filter(r=>r.fit.k==='tight').length) suggestions.push('臀围偏紧：建议选大一码或弹力面料。'); 
  } 
  if (sizeType === 'shoes'){ 
    if (g.footLength){ const e = g.footLength - body.footLength; rows.push({ key:'footLength', label:'脚长松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,0.4,0.9) }); } 
    if (g.footWidth){ const e = g.footWidth - body.footWidth; rows.push({ key:'footWidth', label:'脚宽松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,0.2,0.6) }); } 
    suggestions.push('选鞋建议：下午/晚上试穿（脚会略微膨胀），脚趾前留 0.5-1cm 活动空间。'); 
  } 
  // 新增维度：领围 / 下摆 / 袖肥 / 膝围 / 裤脚，都用身体数据做对照
  if (sizeType === 'cloth'){
    if (g.neck && body.neck){ const e = g.neck - body.neck; rows.push({ key:'neck', label:'领围松量', value:`领围 ${g.neck}cm · 颈围 ${body.neck}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 1.5, 3.5) }); }
    if (g.hem && body.hip){ const e = g.hem - body.hip; rows.push({ key:'hem', label:'下摆 vs 臀围', value:`下摆 ${g.hem}cm · 臀围 ${body.hip}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 4, 10) }); }
    if (g.armhole && body.upperArm){ const e = g.armhole - body.upperArm; rows.push({ key:'armhole', label:'袖肥松量', value:`袖肥 ${g.armhole}cm · 上臂 ${body.upperArm}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 2, 5) }); }
  }
  if (sizeType === 'pants'){
    if (g.knee && body.calf){ const ref = Number((body.calf * 1.15).toFixed(1)); const e = g.knee - ref; rows.push({ key:'knee', label:'膝围松量', value:`膝围 ${g.knee}cm · 参考 ${ref}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 2, 5) }); }
    if (g.cuff && body.ankle){ const e = g.cuff - body.ankle; rows.push({ key:'cuff', label:'裤脚 vs 踝围', value:`裤脚 ${g.cuff}cm · 踝围 ${body.ankle}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 2, 6) }); }
  }
  const hardTight = rows.filter(r => r.fit.k === 'tight' || r.fit.k === 'loose').length; 
  const slightCount = rows.filter(r => r.fit.k === 'slight-tight' || r.fit.k === 'slight-loose').length; 
  const score = Math.max(0, 100 - hardTight * 8 - slightCount * 3); 
  return { rows, suggestions, score, sizeType }; 
}

function cnToNumber(str){ if (str == null) return NaN; const s = String(str).trim(); if (!s) return NaN; if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s); const map = { '零':0, '〇':0, '一':1, '二':2, '两':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9 }; if (s.length === 1){ if (map[s] !== undefined) return map[s]; if (/^\d$/.test(s)) return parseInt(s); return NaN; } if (s === '十') return 10; if (/^十[一二三四五六七八九]$/.test(s)) return 10 + map[s[1]]; if (/^[一二三四五六七八九]十$/.test(s)) return map[s[0]] * 10; if (/^[一二三四五六七八九]十[一二三四五六七八九]$/.test(s)) return map[s[0]] * 10 + map[s[2]]; let result = 0; for (const ch of s){ let d; if (map[ch] !== undefined) d = map[ch]; else if (/^\d$/.test(ch)) d = parseInt(ch); else return NaN; result = result * 10 + d; } return result; }
function round2(n){ return Math.round(n * 100) / 100; }
function parseChineseAmount(text){ if (text == null) return NaN; let s = String(text).replace(/快/g, '块').replace(/园/g, '元').replace(/圓/g, '元'); const numP = '(\\d+(?:\\.\\d+)?|[零〇一二两三四五六七八九十]+)'; let m = s.match(new RegExp(numP + '\\s*[块元]\\s*' + numP + '\\s*[毛角]\\s*' + numP + '\\s*分?')); if (m){ const y = cnToNumber(m[1]), j = cnToNumber(m[2]), f = cnToNumber(m[3]); if (!isNaN(y) && !isNaN(j) && !isNaN(f)) return round2(y + j/10 + f/100); } m = s.match(new RegExp(numP + '\\s*[毛角]\\s*' + numP + '\\s*分?')); if (m){ const j = cnToNumber(m[1]), f = cnToNumber(m[2]); if (!isNaN(j) && !isNaN(f)) return round2(j/10 + f/100); } m = s.match(new RegExp(numP + '\\s*[块元]\\s*' + numP + '\\s*[毛角]')); if (m){ const y = cnToNumber(m[1]), j = cnToNumber(m[2]); if (!isNaN(y) && !isNaN(j)) return round2(y + j/10); } m = s.match(new RegExp(numP + '\\s*[块元]\\s*' + numP)); if (m){ const y = cnToNumber(m[1]); const raw = String(m[2]); let sub; if (/^\d+(\.\d+)?$/.test(raw)){ sub = parseFloat(raw); if (/\./.test(raw)) return round2(y + sub); const digits = raw.replace(/\D/g, '').length; if (digits === 1) return round2(y + sub/10); if (digits === 2) return round2(y + sub/100); return round2(y + sub); } else { sub = cnToNumber(raw); if (!isNaN(sub)){ if (sub < 10) return round2(y + sub/10); if (sub < 100) return round2(y + sub/100); return round2(y + sub); } } } m = s.match(new RegExp(numP + '\\s*[块元]')); if (m){ const y = cnToNumber(m[1]); if (!isNaN(y)) return round2(y); } m = s.match(new RegExp(numP + '\\s*[毛角]')); if (m){ const j = cnToNumber(m[1]); if (!isNaN(j)) return round2(j/10); } m = s.match(/(\d+(?:\.\d+)?)/); if (m) return round2(parseFloat(m[1])); m = s.match(/([零〇一二两三四五六七八九十]+)/); if (m){ const v = cnToNumber(m[1]); if (!isNaN(v)) return round2(v); } return NaN; }
function parseTransactionText(text){ const t = String(text || '').trim(); const amount = parseChineseAmount(t); let incomeScore = 0, expenseScore = 0; INCOME_HINTS.forEach(re => { if (re.test(t)) incomeScore++; }); EXPENSE_HINTS.forEach(re => { if (re.test(t)) expenseScore++; }); let type = incomeScore > expenseScore ? 'income' : 'expense'; let category = type === 'income' ? '其他收入' : '其他'; const dict = type === 'income' ? INCOME_CATS : EXPENSE_CATS; for (const [cat, re] of dict) { if (re.test(t)) { category = cat; break; } } const customObj = LS.get('app_h_customCats', { expense: [], income: [] }); const customs = (customObj && Array.isArray(customObj[type])) ? customObj[type] : []; for (const c of customs){ if (c && t.includes(c)){ category = c; break; } } let account = '现金'; for (let i = 0; i < ACCOUNT_HINTS.length; i++){ if (ACCOUNT_HINTS[i].test(t)) { account = ACCOUNT_LIST[i]; break; } } return { type, amount: isNaN(amount) ? 0 : amount, category, account, note: t }; }
function getCatList(type){ const base = (type === 'income' ? INCOME_CATS : EXPENSE_CATS).map(x => x[0]); const customObj = LS.get('app_h_customCats', { expense: [], income: [] }); const custom = (customObj && Array.isArray(customObj[type])) ? customObj[type] : []; custom.forEach(c => { if (!base.includes(c)) base.push(c); }); base.push(type === 'income' ? '其他收入' : '其他'); return base; }
function csvEscape(v){ const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function getRangeTransactions(){ const today = todayStr(), ym = today.slice(0,7), list = transactions; if (state.exportRange === 'month') return list.filter(t => t.date.startsWith(ym)); if (state.exportRange === 'lastMonth'){ const d = new Date(); d.setMonth(d.getMonth() - 1); const lym = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; return list.filter(t => t.date.startsWith(lym)); } if (state.exportRange === '3months'){ const c = new Date(); c.setMonth(c.getMonth() - 2); const cut = `${c.getFullYear()}-${pad(c.getMonth()+1)}-01`; return list.filter(t => t.date >= cut); } return list; }

/* ===== P45：AI 返回文本提取 + 稳健 JSON 解析 + 流程结构归一化 =====
   推理型模型（glm-4.7-flash / doubao-seed-2-1-pro 等）常把答案放进
   reasoning_content，或在 JSON 前后夹思考过程、说明文字、markdown 代码块；
   旧版只取 message.content + 一次 indexOf/lastIndexOf 截取会直接失败。*/
function AI_extractMessageText(d){
  try {
    const m = d && d.choices && d.choices[0] && d.choices[0].message;
    if (!m) return '';
    const flat = v => {
      if (typeof v === 'string') return v;
      if (Array.isArray(v)) return v.map(x => typeof x === 'string' ? x : String((x && (x.text || x.content)) || '')).join('\n');
      if (v && typeof v === 'object') return String(v.text || v.content || '');
      return '';
    };
    let t = flat(m.content);
    const r = flat(m.reasoning_content || m.reasoning || m.reasoningContent || m.text);
    if (!t.trim()) t = r;
    else if (t.indexOf('{') < 0 && t.indexOf('[') < 0 && r) t = t + '\n' + r;
    return t;
  } catch(e){ return ''; }
}
function AI_extractJSONObject(text){
  if (!text) return null;
  if (typeof text === 'object') return text;
  let s = String(text).trim();
  s = s.replace(/```(?:json|JSON)?/g, '').replace(/```/g, '');
  const found = [];
  const scan = (open, close) => {
    for (let i = 0; i < s.length; i++){
      if (s[i] !== open) continue;
      let depth = 0, inStr = false, esc = false;
      for (let j = i; j < s.length; j++){
        const ch = s[j];
        if (inStr){ if (esc) esc = false; else if (ch === '\\') esc = true; else if (ch === '"') inStr = false; continue; }
        if (ch === '"') inStr = true;
        else if (ch === open) depth++;
        else if (ch === close){ depth--; if (depth === 0){ found.push(s.slice(i, j + 1)); i = j; break; } }
      }
    }
  };
  scan('{', '}'); scan('[', ']');

function toneShades(hex){
  const n = parseInt(String(hex).slice(1), 16);
  let r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  let h = 0, sat = 0;
  if (d){
    sat = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (mx === g) h = ((b - r) / d + 2);
    else h = ((r - g) / d + 4);
    h /= 6;
  }
  const css = (ss, ll) => 'hsl(' + Math.round(h * 360) + ',' + Math.round(ss * 100) + '%,' + Math.round(ll * 100) + '%)';
  return { p:hex, p2:css(Math.min(1, sat), Math.min(0.78, l + 0.13)),
           d:css(Math.min(1, sat * 1.02), Math.max(0.24, l - 0.11)),
           s:css(Math.min(0.75, sat * 0.72), 0.955) };
}

const COGNITION_SUBS = ['general','logic','express','news','recommend','sentences'];
const COGNITION_LABELS = { general:'知识', logic:'逻辑', express:'表达', news:'今日世界', recommend:'推荐', sentences:'句子' };
async function studyView(){
  const sub = state.studySub;
  const testSubs = ['wrong','weekly','alltest'];
  const inTest = testSubs.includes(sub);
  const inCognition = COGNITION_SUBS.includes(sub);
  if (inCognition) state.cognitionSub = sub;   /* 下次点「认知」回到上次的二级页 */
  /* 一级用生活页同款胶囊 .subtabs，二级用生活页同款吸顶下划线 .subtabs-secondary */
  const subs = [{ id:'today', label:'今日', tone:'blue' },{ id:'english', label:'英语', tone:'indigo' },{ id:'valve', label:'专业', tone:'cyan' },{ id:'cognition', label:'认知', tone:'purple' },{ id:'test', label:'测试', tone:'amber' }];
  let content = '';
  try {
    if (sub === 'today') content = todaySection();
    else if (sub === 'english') content = await englishSection();
    else if (sub === 'valve') content = valveSection();
    else if (sub === 'general') content = await generalSection();
    else if (sub === 'logic') content = logicSection();
    else if (sub === 'express') content = await expressSection();
    else if (sub === 'news') content = await newsSection();
    else if (sub === 'recommend') content = await recommendSection();
    else if (sub === 'sentences') content = cognitionSentenceSection();
    else if (sub === 'wrong') content = testBackBar('错题本') + wrongBookSection();
    else if (sub === 'weekly') content = testBackBar('周测') + weeklyTestSection();
    else if (sub === 'alltest') content = testBackBar('总测') + allTestSection();
    else if (sub === 'test') content = testHub();
  } catch(e){ content = `<div class="tip-card">加载失败：${esc(e.message)}</div>`; }
  const mainBar = `<div class="subtabs">${subs.map(x => `<button class="subtab ${((inTest && x.id === 'test') || (inCognition && x.id === 'cognition') || x.id === sub) ? 'on' : ''}"${subToneStyle(x.tone)} data-act="studySub" data-sub="${x.id}">${x.label}</button>`).join('')}</div>`;
  const secBar = inCognition ? `<div class="subtabs-secondary">${COGNITION_SUBS.map(id => `<button class="subtab ${sub===id?'on':''}" data-act="cognitionSub" data-sub="${id}">${COGNITION_LABELS[id]}</button>`).join('')}</div>` : '';
  return `<div class="hero-sm"><h1>世界</h1></div>${mainBar}${secBar}<div>${content}</div>`;
}

function grammarQuizInner(){
  const start = (DAY * 5) % GRAMMAR_QUIZ.length;
  const qs = [];
  for (let i = 0; i < 5; i++) qs.push(GRAMMAR_QUIZ[(start + i) % GRAMMAR_QUIZ.length]);
  const saved = LS.get('grammar-ans:' + todayStr(), null);
  const answers = Array.isArray(saved) ? saved : qs.map(() => -1);
  const answered = answers.filter(a => a >= 0).length;
  const right = qs.filter((q, i) => answers[i] === q.a).length;
  const body = qs.map((q, qi) => {
    const picked = answers[qi];
    const done = picked >= 0;
    return `<div style="padding:12px 0;${qi < qs.length-1?'border-bottom:1px dashed #E9F4FF;':''}">
      <div style="font-size:11px;color:var(--sub);font-weight:700;margin-bottom:5px;">第 ${qi+1} 题</div>
      <div style="font-size:13.5px;font-weight:650;line-height:1.6;color:#121C2A;">${esc(q.q)}</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px;">${q.o.map((o, oi) => {
        let bg = '#E9F4FF', bd = '#E9F4FF', fg = '#3485D6';

function savePeriodRecord(start, end, editingId){

/* P44：'yyyy-MM-dd' 交给 new Date() 会按 UTC 午夜解析，东八区当天 0–8 点会整整差一天 */
function parseLocalDate(v){
  if (v instanceof Date) return v;

function computePeriodForecast(){

    for (let i=1;i<log.length;i++){ const g = Math.round((parseLocalDate(log[i].start) - parseLocalDate(log[i-1].start))/86400000); if (g>0 && g<120) gaps.push(g); }

    if (pls.length){ pls.sort(function(x,y){ return x-y; }); periodLen = pls[Math.floor((pls.length-1)/2)]; }
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const last = log.length ? log[log.length-1] : null;
  let inRecorded = false;
  if (last){ const s = parseLocalDate(last.start); if (last.end){ const e = parseLocalDate(last.end); inRecorded = (today>=s && today<=e); } else { const diff = Math.round((today - s)/86400000); inRecorded = (diff>=0 && diff<=periodLen-1); } }

  else if (daysToNext === null) status = '还没有记录';

}

let _cropState = null;
function cropParams(){
  const c = _cropState; if (!c) return null;
  const base = Math.min(c.iw, c.ih);
  const size = Math.max(24, base / c.z);
  return { sx: (c.iw - size) * c.px / 100, sy: (c.ih - size) * c.py / 100, size };
}
function drawCropPreview(){
  const cv = document.getElementById('cropCanvas');
  if (!cv || !_cropState) return;
  const p = cropParams(); const ctx = cv.getContext('2d');
  ctx.fillStyle = '#FFF2DE'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(_cropState.img, p.sx, p.sy, p.size, p.size, 0, 0, cv.width, cv.height);
}
function openClothCrop(dataUrl){

function confirmClothCrop(){
  if (!_cropState) return;
  const cv = document.createElement('canvas'); cv.width = cv.height = 480;

function shrinkImage(dataUrl, maxSide, quality){
  return new Promise(resolve => {
    let done = false;
    const guard = setTimeout(() => finish(null), 15000);
    function finish(v){ if (done) return; done = true; clearTimeout(guard); resolve(v); }
    try {
      const img = new Image();
      img.onload = () => { try {
        const s = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        finish(c.toDataURL('image/jpeg', quality || 0.72));
      } catch(e){ finish(null); } };
      img.onerror = () => finish(null);
      img.src = dataUrl;
    } catch(e){ finish(null); }
  });
}

function nativePostJson(url, obj, timeout, headers){
  return new Promise((resolve, reject) => {
    if (!window.AndroidHttp || typeof window.AndroidHttp.httpPostJson !== 'function'){ reject(new Error('原生桥不可用')); return; }
    window.__nativeHttpCbs = window.__nativeHttpCbs || {};
    const id = 'h' + (window.__nativeHttpSeq = (window.__nativeHttpSeq || 0) + 1);
    const ms = timeout || 30000;
    const timer = setTimeout(() => { delete window.__nativeHttpCbs[id]; reject(new Error('AI 请求超时')); }, ms + 3000);
    window.__nativeHttpCbs[id] = res => {
      clearTimeout(timer); delete window.__nativeHttpCbs[id];
      const j = nativeBridgeObj(res);
      if (!j){ reject(new Error('原生桥返回异常')); return; }
      if (!j.ok){ let why = ''; try { const b = JSON.parse(j.body || '{}'); why = (b.error && (b.error.message || b.error.code)) || b.message || ''; } catch(er){ why = String(j.body || '').slice(0,120); } if (!why) why = String(j.error || ''); const err = new Error('HTTP ' + (j.status || 0) + (why ? ' · ' + String(why).slice(0,140) : '')); err.isHttpError = true; reject(err); return; }
      resolve(j.body);
    };
    try { window.AndroidHttp.httpPostJson(url, JSON.stringify(obj), JSON.stringify(headers || {}), id); }
    catch(e){ clearTimeout(timer); delete window.__nativeHttpCbs[id]; reject(e); }
  });
}
function hasNativePost(){ return !!(window.AndroidHttp && typeof window.AndroidHttp.httpPostJson === 'function'); }
async function aiPostJSON(url, body, timeout, apiKey){
  /* P55：断网时立即返回，不再空等几十秒 */
  if (navigator.onLine === false) throw new Error('当前离线，联网后再试');
  const headers = { 'Content-Type':'application/json' };
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  const t = timeout || 60000;
  if (hasNativePost()){
    try {
      const raw = await nativePostJson(url, body, t, headers);
      try { return JSON.parse(raw); }
      catch(pe){ throw new Error('AI 返回不是 JSON：' + String(raw || '').slice(0,120)); }
    } catch(e){
      // 只有「桥本身不可用」才降级到 WebView fetch。
      // 以前 401 / 超时 / 解析异常都会被当成桥失败再发一次，用户看到的是双倍耗时和莫名的失败。
      if (!e || e.message !== '原生桥不可用') throw e;
      console.warn('[AI] 原生桥不可用，改用 WebView fetch');
    }
  }
  const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), t);
  try {
    const r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body), signal: controller.signal });
    if (!r.ok){ let why = ''; try { why = (await r.text()).slice(0,140); } catch(er){} throw new Error('HTTP ' + r.status + (why ? ' · ' + why : '')); }
    return await r.json();
  } finally { clearTimeout(timer); }
}
/* ===== AI 请求全局排队（P34）：防止护肤流程 / 拍照识别 / 表达评分并发打满 QPS =====
   免费模型普遍有「每分钟请求数」限制，之前各页面各发各的，容易连续撞 429。
   现在所有 AI 请求串行执行，且两次之间至少隔 1.6 秒；遇到 429 再自动退避重试。 */
function AI_isRateLimit(e){
  const t = String((e && e.message) || e || '');
  return /HTTP 429|请求过于频繁|限流|QPS|rate.?limit|quota|too many requests|并发|1302|1305/i.test(t);
}
const AI_Q = { _chain: Promise.resolve(), _last: 0, _minGap: 1600 };
function aiPostQueued(url, body, timeout, apiKey){
  const run = async () => {
    const wait = AI_Q._last + AI_Q._minGap - Date.now();
    if (wait > 0) await sleepMs(wait);
    let lastErr = null;
    for (let i = 0; i < 3; i++){
      try { AI_Q._last = Date.now(); return await aiPostJSON(url, body, timeout, apiKey); }
      catch(e){
        lastErr = e;
        if (!AI_isRateLimit(e) || i >= 2) break;   /* 401 / 超时 / 网络错误不重试，直接换 Key */
        await sleepMs(2500 * (i + 1));             /* 限流：等 2.5s、5s 再试 */
      }
    }
    throw lastErr || new Error('AI 请求失败');
  };
  const p = AI_Q._chain.then(run, run);
  AI_Q._chain = p.catch(() => {});
  return p;
}

/* 让 AI 联网检索该产品的公开全成分表，而不是凭模型记忆编 */
async function AI_searchProductIngredients(name, catLabel){
  const sys = '你是化妆品成分资料检索助手。必须联网检索该产品的官方或权威公开全成分表（INCI）。只输出一行成分名称，用中文逗号分隔；不要解释、不要编号、不要 Markdown、不要来源链接、不要编造。若联网后确实找不到该产品的成分表，只输出「查无结果」四个字。';
  const usr = '请检索这个产品在中国市场销售版本的全成分表，按成分表原顺序输出（最多 40 个）：\n产品名：' + name + '\n品类：' + (catLabel || '未知');
  const d = await AI.request('chat', (m, c) => Object.assign({
    model:m, temperature:0.1, max_tokens:1200,
    messages:[{ role:'system', content:sys }, { role:'user', content:usr }]
  }, AI_searchExtras(c && c.provider)), 40000);
  const out = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
  if (!out || /查无结果|未找到|没有找到|无法查|not found/i.test(out)) return null;
  const ing = cleanIngredients(String(out)
    .replace(/\[\d+\]|【\d+】|\(\s*来源[^)]*\)|https?:\/\/\S+/g, '')
    .replace(/^\s*(?:根据|经检索|检索结果|全成分|成分表)[^：:\n]*[：:]\s*/m, ''));
  return ing && ing.length >= 4 ? ing : null;
}

/* 把 AI 返回的成分字段清洗成可直接放进输入框的一行文本 */
function cleanIngredients(v){
  if (Array.isArray(v)) v = v.join('，');
  if (v == null) return '';
  let s = String(v).trim();
  if (!s || s === 'null' || s === 'undefined' || s === '无' || s === '未识别') return '';
  s = s.replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '')
       .replace(/^\s*(全)?成分(表)?\s*[:：]\s*/i, '')
       .replace(/^\s*ingredients(Guess)?\s*[:：]\s*/i, '')
       .replace(/^["'「『]|["'」』]$/g, '')
       .replace(/[\r\n]+/g, '，')
       .replace(/[；;、|]+/g, '，')
       .replace(/，{2,}/g, '，')
       .replace(/^，+|，+$/g, '')
       .trim();
  return s.slice(0, 500);
}
/* 视觉模型输出过长被截断、JSON 不完整时，尽量把 name / ingredients  salvage 出来 */
function salvageProductJSON(txt){
  if (!txt) return null;
  const out = {};
  const str = k => {
    const m = new RegExp('"' + k + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"').exec(txt);
    if (m){ try { return JSON.parse('"' + m[1] + '"'); } catch(e){ return m[1]; } }
    const cut = new RegExp('"' + k + '"\\s*:\\s*"([^"]*)').exec(txt);  /* 成分表太长被截断，没有闭合引号 */
    return cut ? cut[1].replace(/[,\s]+$/, '') : '';
  };
  out.name = str('name');
  out.majorCat = str('majorCat');
  out.ingredients = str('ingredients');
  out.ingredientsGuess = str('ingredientsGuess');
  const n = /"shelfLifeMonths"\s*:\s*(\d+)/.exec(txt);
  if (n) out.shelfLifeMonths = Number(n[1]);
  return (out.name || out.ingredients || out.ingredientsGuess) ? out : null;
}

/* ===== P36：AI 流程结果按「产品库真实大类」强制校正 =====
   AI 常把产品塞进不对应的步骤（面霜写成洁面、精华写成爽肤水、面霜写成乳液）。
   这里丢弃虚构/不可用产品，重建步骤名与顺序，保证「步骤名 = 产品真实品类」。 */
const ROUTINE_STEP_LABEL = {
  makeupRemover:'卸妆', cleanser:'洁面', toner:'爽肤水', serum:'精华',
  lotion:'乳液', cream:'面霜', sunscreen:'防晒', mask:'面膜',
  exfoliant:'去角质', other:'其他护理'
};
const ROUTINE_SORT = { makeupRemover:0, cleanser:1, toner:2, mask:3, exfoliant:4, serum:5, lotion:6, cream:7, sunscreen:8, other:9 };
function usableSkinProducts(){ return getProductLibrary().filter(p => p.openedDate && !isProductExpired(p)); }
/* ===== P46：早间 / 晚间标准流程框架 =====
   以前流程只从「已开封未过期」产品里挑，缺的品类整步消失，看不出今天少了什么。
   现在把「早间该做什么 / 晚间该做什么」做成独立骨架，用来核对覆盖率并标出缺口；
   缺口回查整个产品库：已开封未排到 / 未开封库存 / 已过期，不只是手上这一批。*/
function routineFramework(skinKey){
  const AM = [
    { key:'cleanser', label:'洁面', must:true, why:'洗掉夜间代谢物和枕巾油脂，给后续打底' },
    { key:'toner', label:'爽肤水 / 化妆水', must:false, why:'补水软化角质，赶时间可省略' },
    { key:'serum', label:'精华（抗氧化）', must:false, why:'早间优先 VC / 烟酰胺，和防晒一起抗光老化' },
    { key:'moisture', label:'保湿（乳液或面霜）', must:true, why:'锁水维持屏障，干皮建议面霜' },
    { key:'sunscreen', label:'防晒', must:true, why:'早间不可省；用了 A醇 / 酸类更要严格防晒' }
  ];
  const PM = [
    { key:'makeupRemover', label:'卸妆', must:false, why:'当天涂了防晒 / 彩妆才需要，之后仍要洁面' },
    { key:'cleanser', label:'洁面', must:true, why:'清掉一天污垢与防晒残留' },
    { key:'toner', label:'爽肤水 / 化妆水', must:false, why:'二次调理，可省略' },
    { key:'weekly', label:'周护理（去角质 / 面膜）', must:false, why:'每周 1–2 次，别和 A醇同晚叠加' },
    { key:'serum', label:'精华（修复 / 抗老）', must:false, why:'A醇、胜肽、B5、神经酰胺这类放夜间' },
    { key:'moisture', label:'保湿（乳液或面霜）', must:true, why:'夜间修护收尾' }
  ];
  const tune = (arr, fn) => arr.map(x => Object.assign({}, x, fn(x) || {}));
  if (skinKey === 'severe') return {
    am: tune(AM, x => x.key === 'serum'
      ? { label:'精华（仅舒缓修护）', why:'严重期暂停 VC / 酸类 / 烟酰胺，只用温和修护' }
      : x.key === 'sunscreen' ? { why:'优先物理防晒，减少刺激' } : {}),
    pm: tune(PM, x => (x.key === 'weekly' || x.key === 'makeupRemover')
      ? { must:false, why:'严重期暂停，等皮肤稳定再恢复' }
      : x.key === 'serum' ? { label:'精华（仅舒缓修护）', why:'只用 B5 / 神经酰胺类，避开活性成分' } : {})
  };
  if (skinKey === 'acne') return {
    am: tune(AM, x => x.key === 'serum' ? { label:'精华（避开破口）', why:'壬二酸 / 烟酰胺点涂痘痘区，别全脸厚涂' } : {}),
    pm: tune(PM, x => x.key === 'serum' ? { label:'精华（避开 A醇）', why:'痘痘期先不用 A醇，以抗炎修护为主' } : {})
  };
  return { am:AM, pm:PM };
}
function routineGapKeys(key){
  if (key === 'moisture') return ['lotion','cream'];
  if (key === 'weekly') return ['mask','exfoliant'];
  return [key];
}
function analyzeRoutineGaps(routine, skinKey){
  const fw = routineFramework(skinKey || 'stable');
  const lib = getProductLibrary();
  const usable = usableSkinProducts();
  const sealed = lib.filter(p => !p.openedDate && !isProductExpired(p));
  const gone = lib.filter(p => isProductExpired(p));
  const names = arr => arr.slice(0, 2).map(p => String(p.name || '')).filter(Boolean);
  const scan = (steps, rows, part) => {
    /* 早间的「库存回查」不提示夜间专用成分（A醇 / 酸类等），
       否则「已开封但今天没排到：视黄醇夜间精华」会被误读成早间可补这一步。*/
    const pool = arr => part === 'am' ? arr.filter(p => !nightOnlyReason(p)) : arr;
    const cats = (rows || []).map(r => (r && r.product && r.product.majorCat) || 'other');
    const filled = steps.map(step => {
      const keys = routineGapKeys(step.key);
      return {
        step:step, done:keys.some(k => cats.indexOf(k) >= 0),
        inStock:names(pool(usable.filter(p => keys.indexOf(p.majorCat || 'other') >= 0))),
        canOpen:names(pool(sealed.filter(p => keys.indexOf(p.majorCat || 'other') >= 0))),
        expired:names(pool(gone.filter(p => keys.indexOf(p.majorCat || 'other') >= 0)))
      };
    });
    return { total:steps.length, done:filled.filter(x => x.done).length, items:filled.filter(x => !x.done) };
  };
  const am = scan(fw.am, routine && routine.morning, 'am'), pm = scan(fw.pm, routine && routine.night, 'pm');
  return { am:am, pm:pm, mustMissing:am.items.concat(pm.items).filter(x => x.step.must).length };
}
function renderRoutineGap(x, idx){
  const st = x.step;
  let hint = '产品库里还没有这一类，建议补充';
  if (x.inStock && x.inStock.length) hint = '已开封但今天没排到：' + x.inStock.join('、') + '（可手动补上这一步）';
  else if (x.canOpen && x.canOpen.length) hint = '未开封库存：' + x.canOpen.join('、') + '（开封后可加入）';
  else if (x.expired && x.expired.length) hint = '已过期：' + x.expired.join('、') + '（建议更换）';
  return `<div class="routine-gap" style="display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px dashed #E6EEF9;">
    <span class="rs-num" style="background:#EDF3FA;color:#2F4359;">${idx+1}</span>
    <div style="flex:1;min-width:0;">
      <div style="font-size:12.5px;font-weight:700;color:#121C2A;">${esc(st.label)} <span style="font-size:10.5px;font-weight:700;color:${st.must?'#A32E2E':'#2F4359'};background:${st.must?'#FFECEC':'#EDF3FA'};padding:1px 6px;border-radius:5px;margin-left:4px;">${st.must?'必需 · 待补':'可选 · 待补'}</span></div>
      <div style="font-size:11.5px;color:#2A3C50;line-height:1.55;margin-top:2px;">${esc(st.why)}</div>
      <div style="font-size:11.5px;color:#2F4359;line-height:1.55;margin-top:2px;">↳ ${esc(hint)}</div>
    </div></div>`;
}
/* ===== P51：流程永远按「标准步骤骨架」展示，已有产品填进对应步骤 =====
   以前是「先列已有产品，再把待补步骤追加在后面」：产品库里只有 1 件面霜时，
   这件面霜就成了「第 1 步」，看起来像先抹面霜再洗脸。
   现在固定按 洁面 → 水 → 精华 → 保湿 → 防晒（晚间同理）逐格渲染：
   该格有可用产品就填产品卡（含天数角标 / 夜间成分标记），没有就显示「待补」+ 库存回查。
   同一格有多件时主推第一件，其余列为「可替换」；不属于骨架的产品放到末尾「其它可用产品」。*/
function renderRoutineByFramework(rows, gapsPart, skinKey, part){
  const steps = routineFramework(skinKey)[part];
  const items = (gapsPart && gapsPart.items) || [];
  const used = {};
  /* 双保险：即使上游数据异常，夜间专用成分也绝不出现在早间流程里 */
  const src = (part === 'am')
    ? (rows || []).filter(function(r){ return !r || !r.product || !nightOnlyReason(r.product); })
    : (rows || []);
  let html = '';
  steps.forEach(function(st, i){
    const keys = routineGapKeys(st.key);
    const hits = src.filter(function(r){ return r && r.product && keys.indexOf(r.product.majorCat || 'other') >= 0; });
    if (hits.length){
      const main = hits[0];
      used[String(main.product.id)] = true;
      const alt = hits.slice(1).map(function(r){ return r.product && r.product.name; }).filter(Boolean);
      const row = Object.assign({}, main, { step:st.label, note:alt.length ? ('可替换：' + alt.join('、')) : (main.note || '') });
      html += renderRoutineStep(row, i);
      hits.slice(1).forEach(function(r){ used[String(r.product.id)] = true; });
    } else {
      const gap = items.filter(function(x){ return x.step && x.step.key === st.key; })[0];
      html += renderRoutineGap(gap || { step:st, inStock:[], canOpen:[], expired:[] }, i);
    }
  });
  const rest = src.filter(function(r){ return r && r.product && !used[String(r.product.id)]; });
  if (rest.length){
    html += '<div style="font-size:11px;color:#2F4359;padding:9px 0 2px;">＋ 其它可用产品（不在标准步骤里，按需自行安排）</div>';
    rest.forEach(function(r, j){ html += renderRoutineStep(r, steps.length + j); });
  }
  return html;
}

function resolveAIProductStrict(name, usable){
  if (!name) return null;
  const raw = String(name).trim();
  const num = /^#(\d+)$/.exec(raw);
  if (num) return usable[Number(num[1]) - 1] || null;
  const norm = x => String(x == null ? '' : x).replace(/\s+/g, '').toLowerCase();
  let hit = usable.find(p => String(p.id) === raw) || usable.find(p => norm(p.name) === norm(raw));
  if (hit) return hit;
  /* 只接受「AI 文本完整包含某产品全名」这一种安全匹配，避免短词误配到别的产品 */
  const nraw = norm(raw);
  hit = usable.filter(p => norm(p.name).length >= 5 && nraw.indexOf(norm(p.name)) >= 0)
              .sort((a,b) => String(b.name).length - String(a.name).length)[0];
  return hit || null;
}
function sanitizeAIRoutine(aiRoutine){
  const usable = usableSkinProducts();
  const stat = { dropped:0, corrected:0, added:0, valid:0, unused:[], total:usable.length };
  const seen = {};
  const build = (arr, part) => {
    const out = [];
    (Array.isArray(arr) ? arr : []).forEach(r => {
      r = r || {};
      const p = resolveAIProductStrict(r.product || r.productName || '', usable);
      if (!p){ stat.dropped++; return; }
      const major = p.majorCat || 'other';
      if (part === 'am' && (major === 'makeupRemover' || major === 'exfoliant')){ stat.dropped++; return; }
      if (part === 'pm' && major === 'sunscreen'){ stat.dropped++; return; }
      const key = String(p.id) + '|' + part;
      if (seen[key]) return;
      const label = ROUTINE_STEP_LABEL[major] || ROUTINE_STEP_LABEL.other;
      const wrongStep = !!(r.step && String(r.step).indexOf(label) < 0);
      if (wrongStep) stat.corrected++;
      seen[key] = true;
      stat.valid++;
      /* AI 连品类都判断错时，它给的用法提示同样不可信（例如把面霜写成「加水乳化清洗」），直接不留 */
      out.push({ step:label, product:p, productName:p.name, note:wrongStep ? '' : (r.note || '') });
    });
    const order = k => (ROUTINE_SORT[k] === undefined ? 9 : ROUTINE_SORT[k]);
    out.sort((a,b) => order(a.product.majorCat || 'other') - order(b.product.majorCat || 'other'));
    return out;
  };
  const morning = build(aiRoutine && aiRoutine.morning, 'am');
  const night = build(aiRoutine && aiRoutine.night, 'pm');
  /* AI 常漏掉基础步骤（尤其把防晒放到晚间被剔除后，白天就完全没有防晒了）。
     只补洁面 / 防晒 / 卸妆这三类不会互相冲突的基础品类，其他品类交给 AI 轮换。 */
  const ensureBasic = (arr, major, atEnd) => {
    if (arr.some(x => (x.product.majorCat || 'other') === major)) return false;
    const cand = usable.find(p => (p.majorCat || 'other') === major);
    if (!cand) return false;
    const item = { step:ROUTINE_STEP_LABEL[major], product:cand, productName:cand.name, note:'' };
    if (atEnd) arr.push(item); else arr.unshift(item);
    return true;
  };
  if (ensureBasic(morning, 'cleanser', false)) stat.added++;
  if (ensureBasic(morning, 'sunscreen', true)) stat.added++;
  if (ensureBasic(night, 'cleanser', false)) stat.added++;
  if (ensureBasic(night, 'makeupRemover', false)) stat.added++;
  const usedIds = {};
  morning.concat(night).forEach(r => { usedIds[r.product.id] = true; });
  stat.unused = usable.filter(p => !usedIds[p.id]).map(p => p.name);
  return enforceNightOnly({ morning:morning, night:night, empty:(!morning.length && !night.length), stat:stat });
}
function buildRoutineFromAI(aiRoutine){
  const r = sanitizeAIRoutine(aiRoutine);
  /* AI 一条有效产品都没给（全是虚构名）时，直接用本地算法，不要只靠补齐的 2 个基础步骤凑数 */
  if (r.stat.valid === 0 || r.empty){
    const local = generateRoutine(todayStr(), skinState);
    local.stat = r.stat; local.fallback = true;
    return local;
  }
  return r;
}

let _aiRoutineLastTs = 0;
async function aiRecommendRoutine(){
  if (state.aiSkincareLoading) return;
  if (!AI.enabled()){
    state.aiRoutineMsg = { text:'请先在「我的 → 设置 → AI 助手」填好 API Key。本地算法生成的流程仍可正常使用。', err:true };
    render({ keepScroll:true }); return;
  }
  const allLib = getProductLibrary();
  const lib = allLib.filter(p => p.openedDate && !isProductExpired(p));
  const sealedLib = allLib.filter(p => !p.openedDate && !isProductExpired(p));
  if (!lib.length){
    state.aiRoutineMsg = { text:'产品库里还没有「已开封且未过期」的产品，先去产品库添加。', err:true };
    render({ keepScroll:true }); return;
  }
  /* 30 秒冷却：连点「AI 重新安排」是撞限流最常见的原因 */
  const wait = 30000 - (Date.now() - _aiRoutineLastTs);
  if (wait > 0){
    state.aiRoutineMsg = { text:'⏳ 刚请求过，请等 ' + Math.ceil(wait/1000) + ' 秒再点。\n今天已经生成过的流程会一直沿用，不需要重复请求，这样不会撞接口限流。', err:true };
    render({ keepScroll:true }); return;
  }
  _aiRoutineLastTs = Date.now();
  state.aiSkincareLoading = true;
  state.aiRoutineMsg = { text:'🤖 正在请求 AI 安排今日流程…（请求已排队，遇到限流会自动重试）', err:false };
  render({ keepScroll:true });
  try {
    const result = await AI.recommendRoutine(skinState, profile, lib, sealedLib);
    if (result && (result.morning || result.night)){
      saveAIRoutine(todayStr(), result);
      state.aiRoutineMsg = { text:'✓ AI 已生成今日流程，今天会一直沿用，不用重复点「AI 重新安排」。', err:false };
      toast('🤖 AI 已生成今日流程');
    } else {
      const raw = String(AI._lastRoutineRaw || '');
      const hint = !raw.trim() ? '模型这次没有返回内容（常见于推理型模型把输出放在思考字段，或 max_tokens 用尽）。'
        : raw.indexOf('{') < 0 ? '模型返回的是说明文字而不是 JSON。'
        : '模型返回的 JSON 里没有 morning / night 流程字段。';
      state.aiRoutineMsg = { text:'AI 返回格式异常，已保留原来的推荐流程。\n' + hint
        + (raw ? '\n（返回片段：' + raw.slice(0, 140) + '）' : '')
        + '\n可稍后重试，或直接点「用本地算法」照常护肤。', err:true };
    }
  } catch(e){
    const raw = String((e && e.message) || e || '');
    const limited = AI_isRateLimit(e) || /接口被限流/.test(raw);
    state.aiRoutineMsg = {
      text: limited
        ? '⏳ 接口被限流了：已自动排队重试 3 次仍没通过。请等 1 分钟再点「AI 重新安排」；今天的护肤流程不受影响，可以直接照着做。\n（' + raw.slice(0, 180) + '）'
        : '✗ AI 推荐失败：' + raw.slice(0, 220) + '\n本地算法生成的流程仍可正常使用。',
      err:true
    };
  } finally {
    state.aiSkincareLoading = false;
    render({ keepScroll:true });
  }
}

    },

function exprStats(){
  const hist = LS.get('expr-history', []);
  const scores = hist.map(h => h.score).filter(s => typeof s === 'number');
  let weekDays = 0, monthDays = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(Date.now() - i * 86400000); if (LS.get('expr-done:' + localDateStr(d), false)) weekDays++; }
  for (let i = 0; i < 30; i++){ const d = new Date(Date.now() - i * 86400000); if (LS.get('expr-done:' + localDateStr(d), false)) monthDays++; }
  return { weekDays, monthDays, avg: scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0, best: scores.length ? Math.max.apply(null, scores) : 0, count: scores.length };
}

/* 今日素材（今日诗词 + 每日一言）的加载逻辑抽出来，供「认知 → 句子」页共用 */
function ensureExprMaterials(){
  // 今日诗词：按天缓存——同一天内固定，第二天自动换新的
  if (!state.passageData || state.passageDay !== DAY){
    const pc = CacheStore.load('passage-d' + DAY);
    if (pc){ state.passageData = pc; state.passageDay = DAY; }
    else if (!state.passageLoading){
      state.passageLoading = true;
      fetchJson('https://v1.jinrishici.com/all.json', 6000).then(d => {
        state.passageData = { title: d.origin || d.author || '今日诗词', text: d.content };
        state.passageDay = DAY; state.passageLoading = false;
        CacheStore.save('passage-d' + DAY, state.passageData);
        const el = document.getElementById('exprPassage');
        if (el) el.outerHTML = exprPassageCard();
      }).catch(() => {
        state.passageData = { title: '获取失败', text: '请检查网络' };
        state.passageDay = DAY; state.passageLoading = false;
        const el = document.getElementById('exprPassage');
        if (el) el.outerHTML = exprPassageCard();
      });
    }
  }
  // 每日一言
  if (!state.yiyanData && !state.yiyanLoading){
    const cached = CacheStore.load('yiyan');
    if (cached && !CacheStore.shouldRefresh('yiyan')){
      state.yiyanData = cached;
    } else {
      state.yiyanLoading = true;
      fetchJson('https://v1.hitokoto.cn/', 5000).then(d => {
        state.yiyanData = { text: d.hitokoto, from: d.from || d.from_who || '' };
        state.yiyanLoading = false; CacheStore.save('yiyan', state.yiyanData);
        const el = document.getElementById('exprYiyan');
        if (el) el.outerHTML = exprYiyanCard();
      }).catch(async e => {
        try {
          const p = await raceTimeout(fetchJson('https://v1.jinrishici.com/all.json', 6000), 7000);
          if (p && p.content){
            state.yiyanData = { text: p.content, from: (p.origin || '') + (p.author ? ' · ' + p.author : '') };
            state.yiyanLoading = false; CacheStore.save('yiyan', state.yiyanData);
            const el = document.getElementById('exprYiyan');
            if (el) el.outerHTML = exprYiyanCard();
            return;
          }
        } catch(e2){}
        state.yiyanData = { error: friendlyErr(e) }; state.yiyanLoading = false;
        const el = document.getElementById('exprYiyan');
        if (el) el.outerHTML = exprYiyanCard();
      });
    }
  }
}

async function fetchPodcasts(term, limit){
  // 双源链：iTunes 播客目录 → 网易云播客搜索（fetch 失败会自动走原生桥，两源至少一个可达）
  try {
    const d = await raceTimeout(fetchJson('https://itunes.apple.com/search?term=' + encodeURIComponent(term) + '&media=podcast&country=cn&limit=' + limit, 9000), 11000);
    const list = d && Array.isArray(d.results) ? d.results : [];
    if (list.length) return list.map(r => ({ 
      name: r.collectionName || r.trackName || '', 
      author: r.artistName || '', 
      category: r.primaryGenreName || '', 
      count: r.trackCount || 0, 
      cover: (r.artworkUrl100 || '').replace('http://', 'https://')
    }));
  } catch(e){ console.warn('iTunes 播客源失败', e); }
  const d2 = await raceTimeout(fetchJson('https://music.163.com/api/search/get?s=' + encodeURIComponent(term) + '&type=1009&limit=' + limit, 9000), 11000);
  const list2 = d2 && d2.result && Array.isArray(d2.result.djRadios) ? d2.result.djRadios : [];
  if (!list2.length) throw new Error('无内容');

/* 抓取逻辑（与旧版一致：缓存 7 天 → 串行抓取 → 二轮重试），返回 {html, ck} */
async function recBodyHTML(cat, offset){
  const catEmoji = { '科学':'🔬','历史':'🏛️','人物':'👤','文化':'🏮','电影':'🎬','电视':'📺','纪录片':'🎞️','书':'📖','播客':'🎙️','APP':'📱' };
  if (cat === '电影' || cat === '电视'){
    const eps = cat === '电影' ? [['movie','本周口碑电影榜']] : [['tv_chinese','本周华语剧集榜'],['tv_global','本周全球剧集榜']];
    const ck = recCacheKey(cat, offset);
    let groups = CacheStore.loadFresh(ck, 7);
    if (!groups){
      const tryFetch = async () => {
        const rs = [];
        for (const ep of eps){
          try { rs.push({ label: ep[1], list: await fetchDoubanWeekly(ep[0]) }); } catch(e){ console.warn('榜单接口失败：' + ep[0], e); }
          if (eps.length > 1) await new Promise(r => setTimeout(r, 1200));
        }
        return rs;
      };
      groups = await tryFetch();
      if (!groups.length){ await new Promise(r => setTimeout(r, 3000)); groups = await tryFetch(); }
      if (groups.length) CacheStore.save(ck, groups);
    }
    if (!groups || !groups.length) return { html: recErrorCard('获取榜单失败，请检查网络后重试', 'refreshRecList'), ck };
    return { html: recRenderDouban(cat, groups), ck };
  }
  if (cat === '播客'){
    const term = PODCAST_TERMS[(WEEK + offset) % PODCAST_TERMS.length];
    const ck = recCacheKey(cat, offset);
    let list = CacheStore.loadFresh(ck, 7);
    if (!list){ try { list = await fetchPodcasts(term, 8); CacheStore.save(ck, list); } catch(e){ console.warn('播客接口失败', e); } }
    if (!list || !list.length) return { html: recErrorCard('获取播客失败，请检查网络后重试', 'refreshRec'), ck };
    return { html: recRenderPodcast(term, list), ck };
  }
  if (cat === 'APP'){
    const page = (DAY + offset) % 3;
    const ck = recCacheKey(cat, offset);
    let list = CacheStore.loadFresh(ck, 7);
    if (!list){ try { list = await fetchAppArticles(10, page); CacheStore.save(ck, list); } catch(e){ console.warn('应用推荐接口失败', e); } }
    if (!list || !list.length) return { html: recErrorCard('获取应用推荐失败，请检查网络后重试', 'refreshRec'), ck };
    return { html: recRenderApp(list), ck };
  }
  const topics = DISCOVER_TOPICS[cat] || [];
  const startIdx = topics.length ? (DAY + offset) % topics.length : 0;
  const ck = recCacheKey(cat, offset);
  let item = CacheStore.loadFresh(ck, 7);
  if (!item){
    for (let t = 0; t < Math.min(4, topics.length) && !item; t++){
      if (t > 0) await new Promise(r => setTimeout(r, 1500));
      const topic = topics[(startIdx + t) % topics.length];
      try {
        item = await raceTimeout(fetchBaikeItem(topic), 9000);
        if (item) CacheStore.save(ck, item);
      } catch(e){ console.warn('百科接口失败：' + topic, e); }
    }
  }
  if (!item) return { html: recErrorCard('获取失败，请检查网络后重试', 'refreshRec'), ck };
  return { html: recRenderBaike(cat, item), ck };
}
async function recommendSection(){

  }

/* 药品搜索：只切换卡片显隐，不整页重绘，输入过程中不丢焦点、不打断输入法 */
function applyMedSearch(v){

/* ===== P34 咪咪档案：驱虫/疫苗、化毛周期、猫用药箱、自定义提醒 ===== */
function defaultMimi(){ return { id:'cat1', name:'咪咪', birthday:'', note:'', care:[], hairball:[], meds:[], reminders:[], history:[] }; }
function normalizeMimi(v){
  const b = defaultMimi();
  if (!v || typeof v !== 'object') return b;
  return { id:v.id||'cat1', name:v.name||b.name, birthday:v.birthday||'', note:v.note||'',
    care:Array.isArray(v.care)?v.care:[], hairball:Array.isArray(v.hairball)?v.hairball:[],
    meds:Array.isArray(v.meds)?v.meds:[], reminders:Array.isArray(v.reminders)?v.reminders:[],
    history:Array.isArray(v.history)?v.history:[] };
}
/* P44 多猫：对外仍是 getMimi()/setMimi() 单对象接口，旧单猫数据自动迁移成第 1 只 */
function getMimiList(){
  try {
    const list = LS.get('app_mimi_list', null);
    if (Array.isArray(list) && list.length) return list.map(normalizeMimi);
    return [normalizeMimi(LS.get('app_mimi', null))];
  } catch(e){ return [defaultMimi()]; }
}
function saveMimiList(list){ LS.set('app_mimi_list', list || []); }
function activeMimiId(){ try { const list = getMimiList(); const id = LS.get('app_mimi_active',''); return (id && list.some(x => x.id === id)) ? id : list[0].id; } catch(e){ return 'cat1'; } }
function getMimi(){ const list = getMimiList(), id = activeMimiId(); return list.find(x => x.id === id) || list[0]; }
function setMimi(d){
  const list = getMimiList(), id = d.id || activeMimiId();
  const nd = normalizeMimi(d); nd.id = id;
  const i = list.findIndex(x => x.id === id);
  if (i >= 0) list[i] = nd; else list.push(nd);
  saveMimiList(list); LS.set('app_mimi_active', id);
  LS.set('app_mimi', nd);   /* 兼容旧备份与直接读 app_mimi 的地方 */
}
function mimiPushHistory(d, text){
  if (!Array.isArray(d.history)) d.history = [];
  d.history.unshift({ t: Date.now(), date: todayStr(), text: String(text||'') });
  d.history = d.history.slice(0, 50);
}
/* 按原计划顺延：晚做几天不会把整个周期永久推后 */
function mimiAdvance(lastDate, everyDays){
  const n = Math.max(1, Math.floor(Number(everyDays) || 0));
  let base = lastDate || todayStr(), next = mimiNextDate(base, n), guard = 0;
  while (next && mimiDaysUntil(next) <= 0 && guard++ < 400){ base = next; next = mimiNextDate(base, n); }
  return base;
}
function mimiNextDate(last, days){
  const n = Number(days);
  if (!last || !n || n <= 0) return '';
  const a = new Date(last + 'T00:00:00');
  if (isNaN(a.getTime())) return '';
  a.setDate(a.getDate() + n);
  return localDateStr(a);
}
function mimiDaysUntil(dateStr){
  if (!dateStr) return null;
  const a = new Date(dateStr + 'T00:00:00');
  if (isNaN(a.getTime())) return null;
  const b = new Date(todayStr() + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function mimiDueText(next, remindDays){
  const l = mimiDaysUntil(next);
  if (l === null) return { text:'填上次日期 + 周期后自动算', color:'#2F4359' };
  if (l < 0) return { text:'已逾期 '+(-l)+' 天', color:'#EC6A6A' };
  if (l === 0) return { text:'就是今天', color:'#EC6A6A' };
  if (l <= (Number(remindDays)||0)) return { text:'还有 '+l+' 天 · 🔔 该准备啦', color:'#E9A03C' };
  return { text:'还有 '+l+' 天', color:'#2DBE98' };
}
function mimiDueList(){
  const list = getMimiList(), multi = list.length > 1, out = [];
  list.forEach(function(d){
    const tag = multi ? '[' + d.name + ']' : '';
    d.care.forEach(x => { const n = mimiNextDate(x.lastDate, x.everyDays), l = mimiDaysUntil(n); if (l !== null && l <= 0) out.push(tag + (x.type||'') + '：' + (x.name||'') + '（' + (l<0?'逾期 '+(-l)+' 天':'就是今天') + '）'); });
    d.hairball.forEach(x => { const n = mimiNextDate(x.lastDate, x.everyDays), l = mimiDaysUntil(n); if (l !== null && l <= (Number(x.remindDays)||0)) out.push(tag + '化毛：' + (x.name||'化毛产品') + '（' + (l<0?'逾期 '+(-l)+' 天':l===0?'今天该喂':'还有 '+l+' 天，该准备') + '）'); });
    d.meds.forEach(x => { const l = expiryDaysLeft(x.expiry); if (l !== null && l <= 30) out.push(tag + '药箱：' + (x.name||'') + (l<0?' 已过期 '+(-l)+' 天':' 剩 '+l+' 天到期')); });
    d.reminders.forEach(x => { if (x.done) return; const l = mimiDaysUntil(x.date); if (l !== null && l <= 0) out.push(tag + (x.title||'提醒') + '（' + (l<0?'逾期 '+(-l)+' 天':'就是今天') + '）'); });
  });
  return out;
}

async function handleToolsAction(act, t, e){
  if (act === 'toolsSub'){ state.toolsSub = t.dataset.sub; render(); return true; }
  if (act === 'toolsHome'){ state.toolsSub = 'home'; render(); return true; }
  if (act === 'mimiSub'){ state.mimiSub = t.dataset.sub || 'profile'; render(); return true; }
  if (act === 'medSearchClear'){ const mi = document.getElementById('medSearch'); if (mi) mi.value = ''; applyMedSearch(''); return true; }
  if (act === 'saveNote'){
    const ta = document.getElementById('noteInput'); const tg = document.getElementById('noteTags');
    const text = (ta && ta.value || '').trim();
    const tags = (tg && tg.value || '').trim().split(/\s+/).filter(Boolean);
    const photos = (state.noteDraftPhotos || []).map(function(p){ return { path:p }; });
    if (!text && !photos.length){ toast('写点什么或加张照片吧'); return true; }
    const notes = getNotes();
    notes.push({ id:'n'+Date.now(), ts:Date.now(), date:todayStr(), text:text, tags:tags, photos:photos });
    setNotes(notes); state.noteDraftPhotos = [];
    toast('已保存 📝'); render(); return true;
  }
  if (act === 'delNote'){
    const id = t.dataset.id; if (!confirm('删除这条随手记？')) return true;
    setNotes(getNotes().filter(function(n){ return n.id !== id; }));
    render(); return true;
  }
  if (act === 'delNoteDraftImg'){
    const i = Number(t.dataset.i); if (state.noteDraftPhotos) state.noteDraftPhotos.splice(i,1); render({ keepScroll:true }); return true;
  }
  if (act === 'noteFilterTag'){
    const tag = t.dataset.tag; state.noteFilterTag = (state.noteFilterTag === tag) ? '' : tag; render(); return true;
  }
  return false;
}

/* P52：通用问答界面已由「AI 陪聊」取代，保留原渲染函数仅为兼容旧备份数据 */

/* ===== P53：AI 模拟真人陪聊 =====
   界面里不写死任何角色台词：开场白、回复长度、语气、情绪应对、长期记忆全部由模型生成。
   复用 AI.request('chat') 的多 Key 轮询 / 模型候选 / 限流排队，不另建一套配置。
   每个人设独立会话；聊天记录、人设、记住的事进备份。 */
/* P54 记忆分层：近期原话 / 更早的前情 / 长期事实，三层都进模型上下文。
   这些是上限而不是目标值：短聊依然只发几句，聊久了才逐步用满。 */
const CMP_MEMORY = {
  recentMax: 80,          /* 近期原话最多 80 条（原 30） */
  recentChars: 16000,     /* 近期原话约 16000 字（原 6000） */
  keepMax: 600,           /* 本机每人设最多留 600 条（原 120） */
  keepChars: 240000,      /* 每人设文字预算，避免撑爆 localStorage */

function companionWindowStart(msgs, scale){
  const k = Math.max(0.25, Math.min(1, Number(scale) || 1));

  for (; i >= 0 && count < maxMsgs; i--){
    const m = a[i];
    if (!m || m.error) continue;
    const len = String(m.text || m.content || '').slice(0, 1200).length;
    if (len > budget && count) break;
    budget -= len; count++;

function companionArchiveRange(msgs, cur){

  const idx = a.findIndex(m => m && String(m.id || '') === String(cur.uptoId));

    if (state.tab !== 'tools' || state.toolsSub !== 'ai' || getCompanionProfile().persona !== key || getCompanionMsgs().length) return;
    const gs = getCompanionGreetings();
    gs[key] = { text:text, ts:Date.now() };
    setCompanionGreetings(gs);
    companionPaint();
  } catch(e){ /* 静默：宁可没有开场白，也不要假装有话说 */ }
}
/* 像真人一样自然记住聊过的事：每 3 轮提炼一次稳定事实，用户仍可在页面上删。
   只挑长期事实，不记临时情绪；失败静默，不打断聊天。 */
async function companionDigest(){
  if (!AI.enabled() || state.cmpDigesting) return null;
  state.cmpDigesting = true;
  try { return await companionDigestInner(); } finally { state.cmpDigesting = false; }
}
async function companionDigestInner(){
  const msgs = getCompanionMsgs();
  const turns = msgs.filter(m => m && m.role === 'user').length;
  const prof = getCompanionProfile();
  if (!turns || turns % 3 !== 0 || Number(prof.digestAt || 0) === turns) return null;
  const per = companionPersona(prof);
  const tail = msgs.slice(-20).map(m =>
    (m.role === 'user' ? 'TA：' : per.name + '：') + String(m.text || m.content || '').slice(0, 300)
  ).join('\n');
  try {
    const d = await AI.request('chat', model => ({
      model: model, temperature: 0.2, max_tokens: 260,
      messages: [
        { role:'system', content:'【记忆提炼】从对话里挑出值得长期记住的、关于 TA 的稳定事实：称呼、身边的人或宠物、工作或学业、长期偏好、忌讳、正在推进的事、重要日期。只记稳定事实，不要记临时情绪、不要记闲聊内容、不要记你自己说的话。只输出 JSON 数组，例如 ["叫我小雨","养了只猫叫咪咪"]；没有就输出 []。' },
        { role:'user', content: tail }
      ]
    }), 15000);
    const obj = AI_extractJSONObject(AI_extractMessageText(d));
    const arr = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.items) ? obj.items : []);
    const add = arr.map(x => String(x || '').trim()).filter(x => x && x.length <= 60).slice(0, 8);
    const p = getCompanionProfile();
    const merged = (p.memories || []).slice();
    add.forEach(x => { if (!merged.some(y => y === x || y.indexOf(x) >= 0 || x.indexOf(y) >= 0)) merged.push(x); });
    p.memories = merged.slice(-CMP_MEMORY.memMax);
    p.digestAt = turns;
    setCompanionProfile(p);
    return add;
  } catch(e){ return null; }
}
/* 滚动前情：把被挤出近期原话的旧对话压成一小段，按人设独立保存。
   攒够一批才请求一次，失败静默；后台跑，不拖慢当前这句回复。 */
async function companionSummarize(){
  if (!AI.enabled() || state.cmpSummarizing) return null;
  const msgs = getCompanionMsgs(), prof = getCompanionProfile();
  const all = getCompanionSummaries(), key = companionKey(prof);
  const cur = all[key] || { text:'', uptoId:'' };
  const r = companionArchiveRange(msgs, cur);
  const chunk = msgs.slice(r.start, r.end).filter(m => m && !m.error);
  if (chunk.length < CMP_MEMORY.archiveBatch) return null;
  state.cmpSummarizing = true;
  try {
    const per = companionPersona(prof);
    const lines = chunk.map(m =>
      (m.role === 'user' ? 'TA：' : per.name + '：') + String(m.text || m.content || '').slice(0, 400)
    ).join('\n');
    const d = await AI.request('chat', model => ({
      model: model, temperature: 0.2, max_tokens: CMP_MEMORY.summaryTokens,
      messages: [
        { role:'system', content:'【对话归档】把更早的旧对话压成一份「前情摘要」，供以后接着聊时回忆。保留：聊过的重要话题和结论、TA 提到的人和事、反复出现的称呼和口头禅、当时没说完的事、你们约定过的事。不要写流水账、不要写建议、不要写套话、不要编造没出现过的事。用简洁的中文要点写，最多 900 字，只输出摘要本身。' +
          (r.text ? '\n【已有的旧摘要，请合并进去、去重、保留仍然重要的部分】\n' + r.text : '') },
        { role:'user', content: lines }
      ]
    }), 20000);
    const text = companionClean(AI_extractMessageText(d)).slice(0, CMP_MEMORY.summaryMax);
    if (!text) return null;
    const last = msgs[r.end - 1];
    all[key] = { text:text, uptoId:(last && String(last.id || '')) || '', ts:Date.now(), msgs:msgs.length };
    setCompanionSummaries(all);
    return text;
  } catch(e){ return null; }
  finally { state.cmpSummarizing = false; }
}

/* 对方「正在输入」时你还能继续发：每条用户消息带回答标记，
   本轮只认领当时已发出的，后发的由下一轮接住，不会被末尾的回复盖掉。 */
function companionHasPending(){
  return getCompanionMsgs().some(m => m && m.role === 'user' && m.answered === false);
}
function companionTakePending(){
  const a = getCompanionMsgs(); let n = 0;
  a.forEach(m => { if (m && m.role === 'user' && m.answered === false){ m.answered = true; n++; } });
  if (n) setCompanionMsgs(a);
  return n;
}
async function companionGenerate(){
  if (state.cmpBusy || !companionHasPending()) return false;
  companionTakePending();
  const prof = getCompanionProfile();
  state.cmpBusy = true;
  companionPaint();
  let ok = false;
  try {
    const reply = await companionReply(getCompanionMsgs(), prof);
    if (!reply){ toast('这次没收到回复，点 ↻ 再试一次'); return false; }
    const list = getCompanionMsgs();
    list.push({ id:'c' + Date.now(), role:'bot', text:reply, ts:Date.now(), persona:prof.persona });
    setCompanionMsgs(list);
    ok = true;
    companionDigest().catch(function(){});   /* 后台记，不拖慢这一句回复 */
    companionSummarize().catch(function(){}); /* 更早的旧对话后台慢慢压成前情 */
  } catch(e){
    const list = getCompanionMsgs();
    list.push({ id:'c' + Date.now(), role:'bot', text:'没连上：' + String((e && e.message) || '未知错误').slice(0, 180), ts:Date.now(), persona:prof.persona, error:true });
    setCompanionMsgs(list);
  } finally {
    state.cmpBusy = false;
    companionPaint();
  }
  return ok;
}
async function companionDrain(){
  let guard = 0;
  while (guard++ < 4 && companionHasPending() && AI.enabled()){
    const ok = await companionGenerate();
    if (!ok) break;
  }
}
async function companionSend(text){
  const q = String(text || '').trim();
  if (!q) return;
  if (!AI.enabled()){ toast('请先在「我的 → AI 设置」填 API Key'); return; }
  const prof = getCompanionProfile();
  const msgs = getCompanionMsgs();
  msgs.push({ id:'c' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), role:'user', text:q.slice(0, 600), ts:Date.now(), persona:prof.persona, answered:false });
  setCompanionMsgs(msgs);
  const inp = document.getElementById('cmpInput');
  if (inp){ inp.value = ''; inp.focus(); }
  if (state.cmpBusy){ companionPaint(); return; }   /* 排队，等当前这句回完一起接住 */
  await companionDrain();
}

async function handleCompanionAction(act, t, e){
  if (act === 'speak') return false;           /* 交给全局朗读处理 */
  if (act === 'cmpPersona'){
    const id = t.dataset.id;
    if (!COMPANION_PERSONAS.some(p => p.id === id)) return true;
    const p = getCompanionProfile(); p.persona = id;
    setCompanionProfile(p); state.cmpEdit = false; state.cmpShowCount = 0; render(); return true;
  }
  if (act === 'cmpEditCustom'){ state.cmpEdit = !state.cmpEdit; render({ keepScroll:true }); return true; }
  if (act === 'cmpCancelCustom'){ state.cmpEdit = false; render({ keepScroll:true }); return true; }
  if (act === 'cmpSaveCustom'){
    const g = id => { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
    const p = getCompanionProfile();
    p.customNick = g('cmpNick'); p.customDesc = g('cmpDesc');
    p.customStyle = g('cmpStyle'); p.callMe = g('cmpCall');
    p.persona = 'custom';
    setCompanionProfile(p); state.cmpEdit = false;
    toast('人设已保存 ✨'); render(); return true;
  }
  if (act === 'cmpSend'){
    const el = document.getElementById('cmpInput');
    await companionSend(el ? el.value : ''); return true;
  }
  if (act === 'cmpQuick'){ await companionSend(t.dataset.text || ''); return true; }
  if (act === 'cmpRegen'){
    if (state.cmpBusy) return true;
    const list = getCompanionMsgs();
    while (list.length && list[list.length - 1].role !== 'user') list.pop();
    if (!list.length){ toast('还没有可以重发的话'); return true; }
    list[list.length - 1].answered = false;
    setCompanionMsgs(list);
    await companionDrain(); return true;
  }
  if (act === 'cmpNew'){
    if (!getCompanionMsgs().length) return true;
    if (!confirm('开始新话题？当前这段聊天会清掉，记住的事和人设都保留。')) return true;
    setCompanionMsgs([]);
    state.cmpShowCount = 0;
    try {
      const k = getCompanionProfile().persona;
      if (state.cmpGreetTried) delete state.cmpGreetTried[k];
      const gs = getCompanionGreetings(); delete gs[k]; setCompanionGreetings(gs);
      const sums = getCompanionSummaries(); delete sums[k]; setCompanionSummaries(sums);
    } catch(e){}
    toast('新话题 ✨'); render(); return true;
  }
  if (act === 'cmpAddMemory'){
    const el = document.getElementById('cmpMemInput');
    const v = el ? String(el.value || '').trim() : '';
    if (!v){ toast('先写点要记住的事'); return true; }
    const p = getCompanionProfile();
    p.memories.push(v.slice(0, 60)); p.memories = p.memories.slice(-CMP_MEMORY.memMax);
    setCompanionProfile(p); render({ keepScroll:true }); toast('记住啦 🧠'); return true;
  }
  if (act === 'cmpMore'){
    state.cmpShowCount = Math.max(CMP_RENDER_LIMIT, Number(state.cmpShowCount || 0)) + CMP_RENDER_LIMIT;
    companionPaint();
    const box = document.getElementById('cmpBox');
    if (box) box.scrollTop = 0;
    return true;
  }
  if (act === 'cmpClearSummary'){
    if (!confirm('清掉更早的前情摘要？近期聊天和记住的事都保留。')) return true;
    const sums = getCompanionSummaries(), key = getCompanionProfile().persona, msgs = getCompanionMsgs();
    const end = companionWindowStart(msgs);
    sums[key] = { text:'', uptoId:(end > 0 && msgs[end - 1]) ? String(msgs[end - 1].id || '') : '', ts:Date.now(), msgs:msgs.length };
    setCompanionSummaries(sums);
    toast('前情已清除'); render({ keepScroll:true }); return true;
  }
  if (act === 'cmpDelMemory'){
    const p = getCompanionProfile();
    p.memories.splice(Number(t.dataset.i), 1);
    setCompanionProfile(p); render({ keepScroll:true }); return true;
  }
  return false;
}

  }

  if (act === 'addMimiHairball'){
    const d = getMimi();
    const hLast = tv('mhLast')||todayStr(); if (hLast > todayStr()){ toast('上次喂的日期不能晚于今天'); return true; }
    d.hairball.push({ id:newId('h'), name:tv('mhName')||'化毛产品', everyDays:Math.min(3650,Math.max(1,Math.floor(tn('mhEvery'))||3)), remindDays:Math.min(365,Math.max(0,Math.floor(tn('mhRemind')))), lastDate:hLast });
    setMimi(d); toast('✓ 化毛计划已保存'); render(); return true;
  }
  if (act === 'mimiHairballDone'){
    const d = getMimi(), x = d.hairball.find(y => y.id === t.dataset.id);
    if (x){
      x.lastDate = mimiAdvance(x.lastDate, x.everyDays);
      mimiPushHistory(d, '化毛 · ' + (x.name||'化毛产品') + '（下次 ' + (mimiNextDate(x.lastDate, x.everyDays)||'—') + '）');
      setMimi(d); toast('✓ 已喂过，按原周期顺延'); render({keepScroll:true});
    }
    return true;
  }
  if (act === 'delMimiHairball'){ if (!confirm('删除这个化毛计划？')) return true; const d = getMimi(); d.hairball = d.hairball.filter(y => y.id !== t.dataset.id); setMimi(d); render({keepScroll:true}); return true; }
  if (act === 'addMimiMed'){

    d.meds.push({ id:newId('mm'), name, dose:tv('mmDose'), symptom:tv('mmSymptom'), stock:tv('mmStock')===''?null:Math.max(0,Math.floor(tn('mmStock'))), expiry:exp });

  }
  if (act === 'mimiMedStock'){
    const d = getMimi(), x = d.meds.find(y => y.id === t.dataset.id);
    if (x){ x.stock = Math.max(0, (Number(x.stock)||0) + Number(t.dataset.d||0)); setMimi(d); render({keepScroll:true}); }
    return true;
  }
  if (act === 'delMimiMed'){ if (!confirm('从咪咪药箱删除？')) return true; const d = getMimi(); d.meds = d.meds.filter(y => y.id !== t.dataset.id); setMimi(d); render({keepScroll:true}); return true; }
  if (act === 'addMimiReminder'){
    const title = tv('mrTitle'); if (!title){ toast('写一下要提醒什么'); return true; }
    const d = getMimi();
    d.reminders.push({ id:newId('r'), title, date:tv('mrDate')||todayStr(), everyDays:Math.min(3650,Math.max(0,Math.floor(tn('mrEvery')))), note:tv('mrNote'), done:false });
    setMimi(d); toast('✓ 提醒已添加'); render(); return true;
  }
  if (act === 'toggleMimiReminder'){
    const d = getMimi(), x = d.reminders.find(y => y.id === t.dataset.id);
    if (x){
      if (x.done){ x.done = false; }
      else if (Number(x.everyDays) > 0){ x.date = mimiNextDate(x.date || todayStr(), x.everyDays); let g=0; while (x.date && mimiDaysUntil(x.date) <= 0 && g++ < 400) x.date = mimiNextDate(x.date, x.everyDays); x.done = false; mimiPushHistory(d, x.title||'提醒'); toast('✓ 已排到下次：' + x.date); }
      else { x.done = true; mimiPushHistory(d, x.title||'提醒'); }
      setMimi(d); render({keepScroll:true});
    }
    return true;
  }
  if (act === 'delMimiReminder'){ if (!confirm('删除这条提醒？')) return true; const d = getMimi(); d.reminders = d.reminders.filter(y => y.id !== t.dataset.id); setMimi(d); render({keepScroll:true}); return true; }
  return false;
}

const SearchIndex = {
  ready:false,
  async ensure(){
    if (this.ready) return;
    await Promise.all(SEED.DECKS.map(d => DeckLoader.load(d.id).catch(() => [])));
    this.ready = true;
  }
};
function openSearchSheet(){
  state.searchQuery = '';
  openSheet(`<div class="srch-wrap"><div class="srch-head"><div class="srch-title">全局搜索</div><button class="sheet-x" data-act="closeSheet">✕</button></div><input class="srch-input" id="globalSearch" placeholder="单词 / 专业知识 / 账本 / 待办" autocomplete="off"><div id="globalSearchRes" class="srch-res"><div class="srch-tip">输入关键词，一次搜遍所有内容</div></div></div>`);
  SearchIndex.ensure().then(() => { const el = document.getElementById('globalSearch'); if (el && el.value) runGlobalSearch(el.value); });
  setTimeout(() => { const el = document.getElementById('globalSearch'); if (el) el.focus(); }, 220);
}
function runGlobalSearch(raw){
  const q = String(raw || '').trim().toLowerCase();
  const box = document.getElementById('globalSearchRes');
  if (!box) return;
  if (!q){ box.innerHTML = '<div class="srch-tip">输入关键词，一次搜遍所有内容</div>'; return; }
  const hit = (s) => String(s || '').toLowerCase().includes(q);
  const secs = [];
  const rows = (arr) => arr.join('');

  const words = [];
  SEED.DECKS.forEach(d => {
    (DeckLoader.get(d.id) || []).forEach(w => {
      if (words.length >= 8) return;
      if (hit(w.w) || hit(w.cn)) words.push(`<div class="srch-row" data-act="searchJump" data-kind="word" data-q="${esc(w.w)}"><div class="i">📗</div><div><div class="t">${esc(w.w)}</div><div class="d">${esc(w.cn||'')} · ${esc(d.name||'')}</div></div></div>`);
    });
  });
  if (words.length) secs.push(`<div class="srch-sec">单词 · ${words.length}</div>${rows(words)}`);

  const knows = [];
  SEED.VALVE_ALL.forEach(v => {
    if (knows.length >= 8) return;
    if (hit(v.q) || hit(v.a)) knows.push(`<div class="srch-row" data-act="searchJump" data-kind="know" data-q="${esc(v.q)}"><div class="i">🔧</div><div><div class="t">${esc(v.q)}</div><div class="d">${esc(String(v.a||'').slice(0,60))}… · ${esc(v.cat||'')}</div></div></div>`);
  });
  if (knows.length) secs.push(`<div class="srch-sec">专业知识 · ${knows.length}</div>${rows(knows)}`);

  const txs = [];
  (transactions || []).forEach(t => {
    if (txs.length >= 8) return;
    if (hit(t.note) || hit(t.category)) txs.push(`<div class="srch-row" data-act="searchJump" data-kind="tx" data-q="${esc(t.note||t.category||'')}"><div class="i">💰</div><div><div class="t">${esc(t.note || t.category)} · ${t.type==='income'?'+':'-'}¥${Number(t.amount).toFixed(2)}</div><div class="d">${esc(t.date)} ${esc(t.time||'')} · ${esc(t.category||'')}</div></div></div>`);
  });
  if (txs.length) secs.push(`<div class="srch-sec">账本 · ${txs.length}</div>${rows(txs)}`);

  let todos = [];
  try {
    if (!Object.keys(state.calendarData || {}).length) buildCalendarFromPlans();
    todos = getAllTodoItems().filter(it => hit(it.title) || hit(it.desc)).slice(0, 8).map(it => `<div class="srch-row" data-act="searchJump" data-kind="todo" data-q="${esc(it.date)}"><div class="i">📅</div><div><div class="t">${esc(it.title)}</div><div class="d">${esc(it.date)} ${esc(it.time||'')}${it.done?' · 已完成':''}</div></div></div>`);
  } catch(e){}
  if (todos.length) secs.push(`<div class="srch-sec">待办 · ${todos.length}</div>${rows(todos)}`);

  box.innerHTML = secs.length ? secs.join('') : `<div class="srch-tip">没有找到「${esc(raw.trim())}」<br>换个关键词试试</div>`;
}
function searchJump(kind, q){
  closeSheet();
  if (kind === 'word'){ state.tab = 'study'; state.studySub = 'english'; state.englishSub = 'learned'; state.englishPage = 1; toast('已跳到英语 · 已学列表'); }
  else if (kind === 'know'){ state.tab = 'study'; state.studySub = 'valve'; state.searchQuery = q; state.valveCat = '全部'; }
  else if (kind === 'tx'){ state.tab = 'life'; state.lifeSub = 'money'; state.moneySub = 'book'; }

}

/* ---------- D. 记账月度报表 ---------- */
function monthKeyOf(offset){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + offset);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1);
}
function monthDays(ym){
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function moneyReportPane(){
  const CAT_COLORS = ['#2567B5','#3485D6','#5A9AE0','#83B9EE','#AED2F6','#2DBE98','#E9A03C','#EC6A6A'];
  const calc = (ym) => {
    const list = (transactions || []).filter(t => String(t.date || '').startsWith(ym));
    const exp = list.filter(t => t.type === 'expense');
    const inc = list.filter(t => t.type === 'income');
    const expSum = exp.reduce((s, t) => s + Number(t.amount || 0), 0);
    const incSum = inc.reduce((s, t) => s + Number(t.amount || 0), 0);
    const byCat = {};
    exp.forEach(t => { const c = t.category || '其他'; byCat[c] = (byCat[c] || 0) + Number(t.amount || 0); });
    const arr = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const biggest = exp.slice().sort((a, b) => Number(b.amount) - Number(a.amount))[0] || null;
    return { list, expSum, incSum, arr, biggest, count: list.length };
  };
  const ym = monthKeyOf(0), pv = monthKeyOf(-1);
  const A = calc(ym), B = calc(pv);
  const maxV = A.arr.length ? A.arr[0][1] : 1;
  const delta = A.expSum - B.expSum;
  const deltaPct = B.expSum > 0 ? (delta / B.expSum * 100) : null;
  const deltaColor = delta > 0 ? 'var(--hot)' : (delta < 0 ? 'var(--ok)' : 'var(--sub)');
  const deltaBg = delta > 0 ? '#FFECEC' : (delta < 0 ? '#E3F8F1' : '#FFF2DE');
  const avg = A.expSum / Math.max(1, new Date().getDate());
  const catHtml = A.arr.length ? A.arr.slice(0, 9).map(([k, v], i) => `
    <div style="margin-bottom:13px;">
      <div class="rep-line"><span style="font-weight:650;">${esc(k)}</span><span><b>¥${v.toFixed(0)}</b> <span style="color:var(--sub);font-size:12px;">${(v / (A.expSum || 1) * 100).toFixed(0)}%</span></span></div>
      <div class="rep-bar"><i style="width:${(v / maxV * 100).toFixed(1)}%;background:${CAT_COLORS[i % CAT_COLORS.length]}"></i></div>
    </div>`).join('') : '<p class="tip">本月还没有支出记录</p>';

  const bars = [];
  for (let i = 5; i >= 0; i--){
    const k = monthKeyOf(-i);
    const v = calc(k).expSum;
    bars.push({ k, v });
  }
  const barMax = Math.max(...bars.map(b => b.v), 1);
  const trendHtml = `<div class="trend">${bars.map((b, i) => `<div><b class="${i === bars.length - 1 ? 'hot' : ''}" style="height:${Math.max(3, b.v / barMax * 100)}%"></b><span class="lb" style="font-size:10px;color:var(--sub);">${b.k.slice(5)}月</span></div>`).join('')}</div>`;

  return `<div class="card">
    <div class="row-between" style="margin-bottom:12px;"><div style="font-size:15px;font-weight:800;">${ym.replace('-', ' 年 ')} 月</div>
      ${deltaPct === null ? '<span class="rep-delta" style="background:#FFF2DE;color:var(--sub);">上月无数据</span>' : `<span class="rep-delta" style="background:${deltaBg};color:${deltaColor};">${delta >= 0 ? '↑' : '↓'} ${Math.abs(deltaPct).toFixed(0)}% 环比</span>`}
    </div>
    <div class="rep-kpi">
      <div><div class="k">支出</div><div class="v" style="color:#121C2A;">¥${A.expSum.toFixed(0)}</div></div>
      <div><div class="k">收入</div><div class="v" style="color:#203146;">¥${A.incSum.toFixed(0)}</div></div>
      <div><div class="k">结余</div><div class="v" style="color:var(--ink);">¥${(A.incSum - A.expSum).toFixed(0)}</div></div>

/* ---------- E. 自动备份 ---------- */
const AutoBackup = {
  KEY:'auto-backups',
  /* 原生可用时，备份真正写到文件（不再只躺在 localStorage 里，
     清缓存不会连备份一起消失） */
  nativeOk(){ try { return !!(window.AndroidBridge && typeof AndroidBridge.listBackupFiles === 'function'); } catch(e){ return false; } },
  list(){
    if (this.nativeOk()){
      try {
        const arr = JSON.parse(AndroidBridge.listBackupFiles() || '[]');
        if (Array.isArray(arr) && arr.length){
          return arr.map(f => ({ t: f.t, size: f.size, name: f.name, file: true }))
                    .sort((a, b) => b.t - a.t);
        }
      } catch(e){}
    }
    const v = LS.get(this.KEY, []);
    return (Array.isArray(v) ? v : []).map(x => ({ t: x.t, size: x.size, data: x.data, file: false }));
  },
  run(force){
    try {
      if (!force && !getSettings().autoBackup) return false;
      const last = HealthStore.load('autoBackupLast', 0);
      if (!force && last && (Date.now() - last) < 6.5 * 86400000) return false;
      const data = buildBackupData();
      const json = JSON.stringify(data);
      /* P56：全量备份可能比较大，别再因为体积直接放弃整次自动备份；
         文件版 / 下载版写完整数据，只有 localStorage 里的副本做瘦身。 */
      const d = new Date();
      let savedFile = false;
      if (this.nativeOk()){
        try {
          const name = 'daily-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate())
                     + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
          savedFile = !!AndroidBridge.saveBackupFile(json, name);
        } catch(e){ console.warn('写备份文件失败', e); }
      }
      /* P44：私有目录的文件卸载即被系统清掉，再往公共下载文件夹写一份，
         换机/重装后用户能从「下载」里把记录导回来（与现有导出走同一个原生接口）。 */
      try {
        const pubLast = HealthStore.load('autoBackupPublicLast', 0);
        if ((force || !pubLast || (Date.now() - pubLast) >= 6.5 * 86400000)
            && window.AndroidFile && typeof AndroidFile.saveFile === 'function'){
          const pubName = '日常健康_自动备份_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '.json';
          AndroidFile.saveFile(json, pubName, 'application/json');
          HealthStore.save('autoBackupPublicLast', Date.now());
        }
      } catch(e){ console.warn('写公共备份失败', e); }
      // localStorage 只留最近 2 份瘦身副本，避免把 5MB 配额撑爆
      let savedLocal = false;
      try {
        const slim = p56SlimBackup(data);
        const slimJson = JSON.stringify(slim);
        if (slimJson.length <= 2600000){
          const arr = LS.get(this.KEY, []);
          const next = Array.isArray(arr) ? arr : [];
          next.unshift({ t: Date.now(), size: slimJson.length, data: slim });
          LS.set(this.KEY, next.slice(0, 2));
          savedLocal = true;
        }
      } catch(e){ console.warn('本机备份副本写入失败', e); }
      HealthStore.save('autoBackupLast', Date.now());
      return savedFile || savedLocal || this.nativeOk();
    } catch(e){ console.warn('自动备份失败', e); return false; }
  },
  /* 读出一份备份的原始 JSON 字符串 */
  read(item){
    if (!item) return '';
    if (item.file){
      try { return AndroidBridge.readBackupFile(item.name) || ''; } catch(e){ return ''; }
    }
    return item.data ? JSON.stringify(item.data) : '';
  },
  del(item){
    if (item && item.file && this.nativeOk()){
      try { AndroidBridge.deleteBackupFile(item.name); return true; } catch(e){}
    }
    return false;
  }
};

function getPRs(){ const v = HealthStore.load('sportPR', []); return Array.isArray(v) ? v : []; }

function rangeStat(a, b){
  const all = getSportSessions();
  let days = 0, sets = 0, mins = 0;
  Object.keys(all).forEach(d => {
    const ts = new Date(d + 'T00:00:00').getTime();
    if (ts < a || ts > b) return;
    const s = all[d] || {};
    const cnt = Object.values(s.sets || {}).reduce((x, y) => x + (Array.isArray(y) ? y.length : 0), 0);
    if (cnt > 0 || s.endTs) days++;
    sets += cnt;
    if (s.startTs && s.endTs) mins += Math.max(0, (s.endTs - s.startTs - (s.pausedTotal || 0)) / 60000);
  });
  return { days, sets, mins };
}
function weekRange(offset){
  const end = new Date(); end.setHours(23, 59, 59, 999); end.setDate(end.getDate() - offset * 7);
  const start = new Date(end); start.setDate(start.getDate() - 6); start.setHours(0, 0, 0, 0);
  return [start.getTime(), end.getTime()];
}

function todayQuizCard(){
  const q = THINK_QUIZ[DAY % THINK_QUIZ.length];
  const saved = LS.get('think-quiz:' + todayStr(), null);
  const opts = q.o.map((o, i) => {
    let cls = '';
    if (saved !== null && saved !== undefined){
      if (i === q.a) cls = 'right';
      else if (i === saved) cls = 'wrong';
    }
    return `<button class="quiz-opt ${cls}" data-act="quizAnswer" data-i="${i}" data-a="${q.a}">${String.fromCharCode(65 + i)}. ${esc(o)}</button>`;
  }).join('');
  return `<div class="sec-title" style="margin-top:24px;">🧩 今日一题 <span class="muted">思维判断题</span></div>
  <div class="card"><div class="know-q" style="font-size:15px;">${esc(q.q)}</div><div style="margin-top:12px;">${opts}</div>${saved !== null && saved !== undefined ? `<div style="margin-top:4px;padding:11px 13px;background:#E9F4FF;border-radius:12px;font-size:12.5px;line-height:1.7;color:#121C2A;"><b>为什么：</b>${esc(q.why)}</div>` : ''}</div>`;
}
