<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#F5F6FA">
<title>日常 · 健康生活</title>
<script src="./data/decks.js"></script>
<script src="./data/valve.js"></script>
<script src="./data/exercise.js"></script>
<script src="./data/thinking.js"></script>
<script src="./data/scenes.js"></script>
<script src="./data/learn-extra.js"></script>
<script src="./data/exanim.js"></script>
<script src="./data/grow-shop.js"></script>
<style>
.swipe-wrapper { position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 2px; }
.swipe-content { display: flex; align-items: center; gap: 10px; padding: 10px 0; background: #fff; transition: transform 0.3s ease; position: relative; z-index: 2; width: 100%; box-sizing: border-box;}
.swipe-content.active { transform: translateX(-70px); }
.swipe-delete { position: absolute; right: 0; top: 0; bottom: 0; width: 70px; background: #EF5B4A; color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; z-index: 1; cursor: pointer; border-radius: 0 8px 8px 0;}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in {
  animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
/* ================= 纸墨设计系统 ================= */
:root{
  /* 墨色（主操作色） */
  --brand:#2563EB; --brand2:#4F83F7; --pri:#2563EB; --pri2:#4F83F7; --pri-soft:#EAF1FF;
  /* 语义色 */
  --sub:#8A8D98; --ok:#0E9F6E; --warn:#B45309; --err:#DC2626;
  /* 珊瑚青（完成/正向） */
  --accent:#12A08A; --accent2:#3FBFA8; --accent-soft:#E4F5F0;
  --hot:#EF5B4A; --hot2:#FFA36B; --hot-soft:#FDEEEA;
  --purple:#2563EB; --purple2:#4F83F7; --purple-soft:#EEF2F8;
  --blue:#2563EB; --blue2:#60A5FA; --blue-soft:#EAF1FF;
  --pink:#E85D8A; --pink2:#FFA1C4; --pink-soft:#FDEFF4;
  /* 灰阶 */
  --ink:#191B22; --ink2:#575A66; --ink3:#9B9EA8;
  --line:rgba(25,27,34,.08);
  /* 圆角与阴影 */
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow-card:0 1px 2px rgba(25,27,34,.03), 0 14px 34px -26px rgba(25,27,34,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","OPPO Sans","Microsoft YaHei",sans-serif;background:#E6E9F0;color:var(--ink);display:flex;justify-content:center;min-height:100dvh;overflow:hidden;}
.phone{position:relative;width:100%;max-width:460px;height:100dvh;background:#F5F6FA;display:flex;flex-direction:column;overflow:hidden;}
/* --- 顶栏 --- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.2px;color:var(--ink);}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 4px rgba(37,99,235,.15);}
.top-right{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);}
.top-weather{display:flex;align-items:center;gap:4px;font-weight:600;background:#fff;padding:5px 11px;border-radius:99px;box-shadow:0 1px 4px rgba(25,27,34,.05);border:1px solid var(--line);}
/* --- 内容滚动区 --- */
#view{flex:1;overflow-y:auto;padding:2px 16px 122px;overscroll-behavior:contain;}
#view::-webkit-scrollbar{width:0;}
/* --- 底部导航：悬浮胶囊 --- */
.tabbar{flex-shrink:0;display:flex;margin:0 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:7px 6px;box-shadow:0 18px 44px -20px rgba(25,27,34,.35);}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border-radius:18px;cursor:pointer;color:#A6A9B3;font-size:10.5px;font-weight:600;letter-spacing:.3px;font-family:inherit;transition:color .18s;}
.tab-icon{width:24px;height:24px;display:grid;place-items:center;transition:transform .18s;line-height:1;}
.tab-icon svg{width:23px;height:23px;display:block;}
.tab:active .tab-icon{transform:scale(.86);}
.tab.on{color:var(--pri);font-weight:750;}
.tab.on .tab-icon{transform:translateY(-1px);}
/* --- 卡片 --- */
.card{background:#fff;border-radius:var(--r-lg);padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--shadow-card);}
.card.done{background:#F3F6FB;border-style:dashed;opacity:.72;}
/* 深色数据卡（词库/知识/测试等头部） */
.hero-card{background:linear-gradient(135deg,#1D4ED8,#3B82F6);color:#fff;border:1px solid rgba(255,255,255,.08);}
.hero-card .btn{background:#fff;color:#1D4ED8;}
/* --- 页面标题 --- */
.hero{padding:4px 4px 14px;}
.hero-k{font-size:12px;color:var(--ink3);font-weight:700;letter-spacing:1.5px;margin-bottom:7px;}
.hero h1{font-size:26px;margin:0;letter-spacing:-.6px;font-weight:850;}
.hero-sm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 12px;}
.hero-sm h1{font-size:26px;margin:0;letter-spacing:-.6px;font-weight:850;}
.hero-sm .meta{font-size:12px;color:var(--ink2);font-weight:600;flex-shrink:0;background:#fff;padding:5px 12px;border-radius:99px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(25,27,34,.04);}
/* --- 分区标题：小字间距标签 --- */
.sec-title{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:1.5px;margin:18px 6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sec-title .muted{font-weight:600;font-size:12px;letter-spacing:0;display:flex;align-items:center;gap:6px;}
.muted{color:var(--sub);}
.tip{color:var(--sub);font-size:12.5px;line-height:1.65;}
.foot-note{text-align:center;font-size:12px;color:#A9B1C0;padding:16px 0 4px;letter-spacing:.5px;}
/* --- 按钮 --- */
.btn{border:0;border-radius:13px;padding:11px 18px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--pri);color:#fff;box-shadow:0 10px 24px -14px rgba(37,99,235,.55);}
.btn.wide{width:100%;margin-top:6px;}
.btn.ghost{background:#EEF2F8;color:var(--ink2);padding:8px 14px;font-size:13px;}
.btn.danger{background:#FDF0EE;color:#DC2626;padding:8px 14px;font-size:13px;}
.btn-primary{width:100%;border:none;font-family:inherit;font-size:15px;font-weight:650;color:#fff;padding:15px;border-radius:var(--r-md);cursor:pointer;background:var(--pri);box-shadow:0 10px 24px -14px rgba(37,99,235,.55);margin-top:4px;}
.btn-ghost-h{width:100%;border:none;font-family:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:var(--r-md);cursor:pointer;background:var(--accent-soft);color:var(--accent);}
/* --- 标签组 --- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px;padding:6px 16px 12px;flex-wrap:nowrap;}
.chips::-webkit-scrollbar{display:none;}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink2);padding:8px 15px;border-radius:99px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:inherit;transition:background .15s,color .15s;}
.chip.on{background:var(--pri);color:#fff;border-color:var(--ink);}
/* --- 主分段：吸顶胶囊标签 --- */
.subtabs{position:sticky;top:0;z-index:8;display:flex;gap:8px;margin:0 -16px 14px;padding:10px 16px 12px;background:rgba(245,246,250,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow-x:auto;flex-wrap:nowrap;box-shadow:0 1px 0 var(--line);}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{border:0;background:#fff;padding:9px 16px;border-radius:99px;font-size:15px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:background .15s,color .15s;box-shadow:0 1px 3px rgba(25,27,34,.06);}
.subtab.on{background:var(--pri);color:#fff;font-weight:700;box-shadow:0 8px 18px -8px rgba(37,99,235,.55);}
/* --- 二级分段：下划线 --- */
.subtabs-secondary{display:flex;gap:16px;margin:6px 4px 14px;border-bottom:1px solid var(--line);padding-bottom:0;background:transparent;border-radius:0;border-top:none;border-left:none;border-right:none;overflow-x:auto;}
.subtabs-secondary::-webkit-scrollbar{display:none;}
.subtabs-secondary .subtab{padding:8px 4px 11px;font-size:14px;color:var(--ink3);font-weight:500;position:relative;background:none;box-shadow:none;}
.subtabs-secondary .subtab.on{background:transparent;color:var(--pri);font-weight:800;}
.subtabs-secondary .subtab.on::after{content:'';position:absolute;bottom:-1px;left:10%;width:80%;height:2.5px;background:var(--pri);border-radius:2px;}
/* --- 工具箱：宫格图标首页 --- */
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:2px;}
.tool-cell{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 15px 15px;box-shadow:var(--shadow-card);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:2px;transition:transform .12s,box-shadow .15s;}
.tool-cell:active{transform:scale(.97);box-shadow:0 8px 20px -12px rgba(25,27,34,.4);}
.tool-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--tbg);color:var(--tc);margin-bottom:10px;}
.tool-name{font-size:15.5px;font-weight:800;color:var(--ink);letter-spacing:.2px;}
.tool-desc{font-size:11.5px;color:var(--sub);line-height:1.45;}
.tool-badge{position:absolute;top:13px;right:13px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--tc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.tool-bar{display:flex;align-items:center;gap:12px;padding:2px 4px 12px;}
.tool-back{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px 7px 12px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;box-shadow:0 1px 3px rgba(25,27,34,.05);display:inline-flex;align-items:center;gap:2px;}
.tool-back:active{transform:scale(.96);}
.tool-cur{font-size:16px;font-weight:800;color:var(--ink);}
.tool-page{animation:fadeInUp .28s cubic-bezier(.16,1,.3,1) forwards;}
/* --- 提示与状态 --- */
.tip-card{background:#fff;border:1px dashed #E0DFD6;border-radius:var(--r-lg);padding:14px;font-size:12.5px;line-height:1.7;color:var(--ink2);margin-top:4px;}
.loading-card{background:#fff;border-radius:var(--r-lg);padding:34px 20px;text-align:center;margin-bottom:12px;box-shadow:var(--shadow-card);}
.loading-card .ld-ico{font-size:34px;line-height:1;animation:pulse 1.2s ease-in-out infinite;}
.loading-card .ld-tx{font-size:13.5px;font-weight:700;margin-top:14px;color:var(--sub);line-height:1.6;}
.err-inline{background:#FFF6E5;border:1px solid #F3E3B4;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;color:#92400E;margin-top:8px;}
.src-tag{display:inline-block;font-size:11.5px;font-weight:750;padding:2px 9px;border-radius:6px;margin-bottom:8px;background:#EEF2F8;color:var(--ink);letter-spacing:.3px;}
.sk{background:linear-gradient(90deg,#E9EDF4 25%,#F5F8FC 37%,#E9EDF4 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--r-lg);margin-bottom:12px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
/* --- 首页统计：合并横条 --- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:12px;background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow-card);overflow:hidden;}
.stat{background:transparent;border-radius:0;padding:16px 8px;text-align:center;border-right:1px solid #EEF2F8;transition:background .15s;}
.stat:last-child{border-right:0;}
.stat:active{background:#F3F6FB;}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.4px;}
.stat .k{font-size:11.5px;color:var(--ink3);margin-top:4px;font-weight:600;}
.stat .d{font-size:11px;color:var(--sub);margin-top:3px;font-weight:600;}
/* --- 我的页统计列表 --- */
.stat-list .stat-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px dashed #ECEFF5;}
.stat-list .stat-row:last-child{border-bottom:none;padding-bottom:2px;}
.stat-list .stat-row .v{min-width:56px;font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.stat-list .stat-row .k{font-size:13px;color:var(--ink2);font-weight:600;}
/* --- 首页时间线 --- */
.home-tl-wrap{background:#fff;border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-card);}
.home-tl-item{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;transition:background .15s;cursor:pointer;}
.home-tl-item:active{background:#F3F6FB;}
.home-tl-item:not(:last-child)::after{content:'';position:absolute;left:27px;bottom:-7px;width:1.5px;height:15px;background:#E6EAF1;}
.home-tl-text{flex:1;font-size:14px;font-weight:550;color:var(--ink);line-height:1.5;min-width:0;}
.home-tl-text .tm{color:var(--ink3);font-size:12px;font-weight:650;margin-right:8px;display:inline-block;min-width:44px;font-variant-numeric:tabular-nums;}
.home-tl-text .sub{color:var(--sub);font-size:12.5px;display:block;margin-top:2px;line-height:1.45;font-weight:450;}
.home-tl-arrow{color:var(--accent);font-size:16px;flex:none;opacity:.55;}
.home-tl-badge{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;font-weight:700;flex:none;}
.home-tl-item.is-done .home-tl-text{color:var(--ink3);}
.home-tl-item.is-done{opacity:.6;}
.check{width:23px;height:23px;border-radius:50%;border:2px solid #D9DFE9;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;transition:.2s;background:#fff;}
.check.done{background:var(--accent);border-color:var(--accent);}
.check.done::after{content:'✓';}
/* --- 身体状态 --- */
.body-state-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.body-state-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 2px;border-radius:12px;background:#F3F6FB;border:1.5px solid transparent;cursor:pointer;font-size:11px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.2;transition:.15s;}
.body-state-item .bsi-icon{font-size:16px;line-height:1;}
.body-state-item .bsi-label{font-size:10px;font-weight:600;white-space:nowrap;}
.body-state-item.active{background:var(--pri);color:#fff;}
.body-state-item.active .bsi-label{color:#fff;font-weight:700;}
/* --- 任务卡 --- */
.task-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card);}
.task-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.task-title{font-size:14.5px;font-weight:750;}
.task-progress{font-size:12px;color:var(--sub);font-weight:650;}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #ECEFF5;cursor:pointer;}
.task-row:last-child{border:0;}
.task-check{width:22px;height:22px;border-radius:8px;border:2px solid #D9DFE9;background:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;}
.task-check.on{background:var(--pri);border-color:var(--ink);}
.task-label{flex:1;font-size:13.5px;font-weight:550;color:var(--ink2);}
.task-label.on{color:#A9B1C0;text-decoration:line-through;}
.task-count{font-size:12.5px;color:var(--sub);font-weight:650;}
/* --- 复习入口 --- */
.review-entry{background:#FFF8E8;border:1px solid #F0E2B8;border-radius:var(--r-lg);padding:16px;margin-bottom:14px;}
.review-entry .r-title{font-size:13.5px;font-weight:750;color:#92400E;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.review-entry .r-meta{font-size:12px;color:#A16207;line-height:1.7;margin-bottom:10px;}
.streak-badge{display:inline-flex;align-items:center;gap:3px;background:#FFF3D6;color:#92400E;font-size:11.5px;font-weight:750;padding:3px 9px;border-radius:99px;}
/* --- 知识卡 --- */
.know-q{font-size:15.5px;font-weight:750;line-height:1.5;}
.know-a{font-size:13.5px;line-height:1.78;color:var(--ink2);margin-top:12px;padding-top:12px;border-top:1px dashed #ECEFF5;}
.know-key{margin-top:12px;background:#F3F6FB;border-left:3px solid var(--pri);padding:11px 13px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.75;color:var(--ink2);}
.know-body{display:none;margin-top:12px;}
.know.open .know-body{display:block;}
.know-cat{display:inline-block;font-size:12px;font-weight:700;color:var(--ink);background:#EEF2F8;padding:3px 9px;border-radius:6px;margin-bottom:10px;letter-spacing:.3px;}
/* --- 搜索 --- */
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin:8px 0 4px;}
.search-input{flex:1;border:0;outline:0;background:transparent;font-size:14px;padding:2px 0;font-family:inherit;}
/* --- 单词卡 --- */
.word-mini{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px;}
.word-mini.done{background:#F3F6FB;opacity:.65;border-style:dashed;}
.word-mini .wm-word{font-size:15px;font-weight:750;color:var(--ink);flex-shrink:0;}
.word-mini.done .wm-word{text-decoration:line-through;color:#A9B1C0;}
.word-mini .wm-cn{font-size:12px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.word-mini .wm-check{width:22px;height:22px;border-radius:50%;border:2px solid #D9DFE9;background:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;}
.word-mini .wm-check.on{background:var(--pri);border-color:var(--ink);}
.word-big{font-size:32px;font-weight:850;letter-spacing:-.8px;color:var(--ink);}
.word-ph{font-size:13px;color:var(--sub);margin-top:6px;}
.deck-chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;cursor:pointer;flex-shrink:0;min-width:130px;text-align:left;font-family:inherit;}
.deck-chip.on{background:var(--pri);color:#fff;border-color:var(--ink);}
.deck-chip .dc-name{font-size:13.5px;font-weight:750;}
.deck-chip .dc-meta{font-size:12px;opacity:.7;}
.progress-bar{height:8px;background:#E9EDF4;border-radius:99px;overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .4s;}
.load-more{border:0;background:#EEF2F8;color:var(--ink2);width:100%;padding:13px;border-radius:12px;font-size:13px;font-weight:650;cursor:pointer;margin-top:6px;font-family:inherit;}
/* --- 输入 --- */
.answer-input{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.7;resize:vertical;background:#F7F9FC;margin-top:6px;font-family:inherit;transition:border-color .15s,background .15s;}
.answer-input:focus{border-color:var(--ink);background:#fff;outline:none;}
/* --- 评分卡 --- */
.score-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;}
.score-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.score-num{font-size:34px;font-weight:850;color:var(--ink);letter-spacing:-1.5px;line-height:1;}
.score-label{font-size:12px;font-weight:700;color:var(--ink2);}
.score-row{margin-top:12px;padding-top:12px;border-top:1px dashed #ECEFF5;}
.score-row-title{font-size:12px;font-weight:750;margin-bottom:8px;color:var(--ink2);}
.score-extra{background:#F3F6FB;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.78;color:var(--ink2);}
.score-list{margin:0;padding-left:18px;}
.score-list li{font-size:13px;line-height:1.75;color:var(--ink2);}
.rate-row{display:flex;gap:8px;margin-top:14px;}
.rate-btn{flex:1;border:0;padding:12px 4px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.rate-btn.again{background:#FDF0EE;color:#DC2626;}
.rate-btn.hard{background:#FFF6E5;color:#B45309;}
.rate-btn.good{background:#E4F5F0;color:#0E9F6E;}
/* --- 行项 --- */
.h-task{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #EEF2F8;}
.h-task:last-child{border-bottom:none;padding-bottom:0;}
.h-task .body{flex:1;min-width:0;}
.h-t-name{font-size:14px;font-weight:550;}
.tag{font-size:12px;padding:3px 9px;border-radius:9px;background:#EEF2F8;color:var(--ink2);font-weight:550;}
.tag.on{background:var(--accent-soft);color:var(--accent);}
.progress{height:8px;border-radius:8px;background:#E9EDF4;overflow:hidden;margin:2px 0 9px;}
.progress .bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.row-between{display:flex;justify-content:space-between;align-items:center;}
/* --- 时间线（日历） --- */
.tl{position:relative;padding-left:24px;}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:#E6EAF1;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #D9DFE9;box-sizing:border-box;}
.tl-item.done::before{background:var(--accent);border-color:var(--accent);}
.tl-time{font-size:12px;color:var(--sub);margin-bottom:3px;font-weight:550;}
.tl-title{font-size:14px;font-weight:550;}
.tl-item.done .tl-title{text-decoration:line-through;color:var(--sub);}
.tl-desc{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.55;}
/* --- 日历 --- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .m{font-size:15px;font-weight:750;}
.cal-head span.nav{color:#B9C0D0;font-size:17px;cursor:pointer;padding:0 6px;}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-week div{text-align:center;font-size:12px;color:var(--ink3);padding:4px 0;font-weight:550;}
.cal-grid div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;border-radius:10px;position:relative;color:var(--ink2);cursor:pointer;user-select:none;padding:2px 0;}
.cal-grid div.empty{visibility:hidden;cursor:default;}
.cal-grid div.sel{background:var(--blue-soft);color:var(--blue);font-weight:650;}
.cal-grid div.today{background:var(--blue);color:#fff;font-weight:750;}
.cal-grid div.has::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:.75;}
.cal-grid div.today.has::after{background:#fff;opacity:1;}
.cal-grid div.holiday{color:var(--hot);font-weight:750;}
.cal-grid div.holiday .holiday-name{font-size:8px;line-height:1;margin-top:1px;font-weight:500;color:var(--hot);}
.cal-grid div.today.holiday .holiday-name{color:#fff;}
/* --- 记账 --- */
.balance{background:linear-gradient(135deg,#1D4ED8,#3B82F6);color:#fff;border-radius:var(--r-lg);padding:20px;margin-bottom:12px;}
.balance .lab{font-size:12px;opacity:.6;letter-spacing:1px;}
.balance .big{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.5px;}
.balance .foot{display:flex;gap:26px;margin-top:16px;font-size:12.5px;opacity:.9;}
.mic-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 20px;}
.mic{width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;background:var(--pri);font-size:40px;color:#fff;transition:.2s;box-shadow:0 16px 36px -14px rgba(37,99,235,.5);}
.mic.listening{animation:pulseMic 1.4s infinite;box-shadow:0 0 0 6px rgba(18,160,138,.18);}
@keyframes pulseMic{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.mic-hint{margin-top:16px;font-size:12.5px;color:var(--sub);text-align:center;padding:0 20px;line-height:1.6;}
.mic-actions{display:flex;gap:8px;margin-top:10px;max-width:320px;width:100%;}
.text-input-area{display:none;margin-top:10px;width:100%;}
.text-input-area.show{display:block;}
.text-input-area input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:13.5px;outline:none;margin-bottom:8px;background:#F7F9FC;}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEF2F8;cursor:pointer;border-radius:8px;}
.tx:last-child{border-bottom:none;padding-bottom:0;}
.tx .ic{width:36px;height:36px;border-radius:11px;background:#F1F4F9;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;}
.tx .body{flex:1;min-width:0;}
.tx .amt{font-weight:650;font-size:14px;margin-left:6px;font-variant-numeric:tabular-nums;}
.tx .amt.inc{color:var(--accent);}
.tx .del-tx{width:24px;height:24px;border-radius:50%;border:none;background:var(--hot-soft);color:var(--hot);font-size:12px;cursor:pointer;flex:none;line-height:1;}
.cat-chip{font-size:12.5px;padding:6px 12px;border-radius:10px;background:#EEF2F8;color:var(--ink2);font-weight:550;cursor:pointer;border:none;font-family:inherit;margin:2px;display:inline-block;}
.cat-chip.active{background:var(--accent);color:#fff;}
.cat-chip.newcat{background:var(--blue-soft);color:var(--blue);}
/* --- 运动 --- */
.sport-timer{font-size:40px;font-weight:750;color:var(--ink);text-align:center;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:4px 0 2px;line-height:1.1;}
.sport-timer-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:4px;}
.sport-meta{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap;}
.sport-meta b{color:var(--ink);font-weight:750;}
.sport-done-badge{display:inline-block;margin-top:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;}
.week-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #EEF2F8;font-size:13px;}
.week-row:last-child{border-bottom:none;padding-bottom:0;}
.week-row .d{width:42px;flex:none;font-weight:650;color:var(--ink2);font-size:12px;}
.week-row .dt{width:44px;flex:none;color:#A9B1C0;font-size:11.5px;}
.week-row .a{flex:1;color:var(--ink);line-height:1.4;}
.week-row .t{font-size:12px;color:var(--sub);flex:none;}
.week-row.today{background:var(--accent-soft);border-radius:12px;padding:10px;border-bottom:none;margin:3px 0;}
.week-row.rest .a{color:var(--ink3);}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r-md);background:#F3F6FB;border:1.5px solid transparent;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--ink2);}
.opt-item .oi-ck{width:20px;height:20px;border-radius:50%;border:2px solid #D9DFE9;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;box-sizing:border-box;}
.opt-item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.opt-item.active .oi-ck{background:var(--accent);border-color:var(--accent);}
.kv{display:flex;gap:10px;padding:7px 0;font-size:12.5px;line-height:1.6;border-bottom:1px dashed #EEF2F8;}
.kv:last-child{border-bottom:none;}
.kv .k{flex:none;width:60px;color:var(--sub);font-weight:550;}
.kv .v{flex:1;color:var(--ink2);}
.kv .v.hl{color:var(--accent);font-weight:650;}
.ex-item{padding:13px 0;border-bottom:1px solid #EEF2F8;}
.ex-item:last-child{border-bottom:none;padding-bottom:0;}
.ex-top{display:flex;align-items:flex-start;gap:10px;}
.ex-top .body{flex:1;min-width:0;}
.ex-top .code{flex:none;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:8px;margin-top:2px;}
.ex-top .t-name{font-size:14px;font-weight:550;}
.ex-top .sets{font-size:12px;color:var(--sub);margin-top:3px;}
.ex-detail{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.75;background:#F3F6FB;padding:9px 12px;border-radius:10px;}
.ex-bottom{display:flex;align-items:center;gap:10px;margin-top:11px;}
.sets-dots{display:flex;gap:5px;}
.sets-dots i{width:9px;height:9px;border-radius:50%;background:#D9DFE9;display:block;transition:.2s;}
.sets-dots i.on{background:var(--accent);}
.sets-count{font-size:12.5px;color:var(--sub);font-weight:550;}
.cnt-btn{margin-left:auto;border:none;font-family:inherit;font-size:12px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:7px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;}
.cnt-btn:disabled{opacity:.55;cursor:default;color:var(--sub);background:#EEF2F8;}
.rest-inline{margin-top:11px;display:flex;align-items:center;gap:10px;background:#F3F6FB;padding:8px 12px;border-radius:11px;flex-wrap:wrap;}
.rest-inline .rest-lb{font-size:12.5px;color:var(--ink3);flex:1;min-width:60px;}
.rest-inline .rest-num-sm{font-size:16px;font-weight:750;color:var(--accent);min-width:36px;text-align:center;font-variant-numeric:tabular-nums;}
.rest-inline .rest-btn-sm{border:none;font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;background:var(--accent-soft);color:var(--accent);}
/* --- 衣橱 --- */
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px;border:2px dashed #D9DFE9;border-radius:var(--r-lg);padding:20px;text-align:center;color:#A6A9B3;font-size:12.5px;background:#fff;margin-bottom:12px;cursor:pointer;position:relative;}
.upload .plus{display:block;font-size:28px;color:#B9C2D0;margin-bottom:6px;}
.upload input[type=file]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.upload img{max-width:100%;max-height:200px;border-radius:12px;margin-top:8px;display:block;}
.lib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.lib-item{position:relative;background:#F3F6FB;border-radius:var(--r-md);padding:10px;text-align:center;overflow:hidden;}
.lib-item .thumb{width:100%;height:110px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;}
.lib-item .thumb img{max-width:100%;max-height:100%;object-fit:contain;}
.lib-item .thumb .placeholder{font-size:32px;color:#B9C2D0;}
.lib-item .n{font-size:12.5px;color:var(--ink);font-weight:650;margin-bottom:3px;}
.lib-item .s{font-size:11.5px;color:var(--sub);}
.lib-item .del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--hot-soft);color:var(--hot);font-size:12px;cursor:pointer;line-height:1;z-index:2;}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.cat-tab{font-size:12.5px;padding:5px 11px;border-radius:9px;background:#EEF2F8;color:var(--ink2);font-weight:550;cursor:pointer;border:none;font-family:inherit;}
.cat-tab.active{background:var(--pri);color:#fff;}
/* --- 表单行 --- */
.dim-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #EEF2F8;}
.dim-row:last-child{border-bottom:none;}
.dim-row .lb{flex:1;font-size:13px;color:var(--ink2);font-weight:550;}
.dim-row .unit{font-size:12px;color:var(--sub);flex:none;}
.dim-row input[type=number],.dim-row input[type=text],.dim-row input[type=date],.dim-row input[type=time],.dim-row select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:#fff;outline:none;flex:none;}
.dim-row input[type=text]{text-align:left;}
.mini-add{font-size:12.5px;padding:5px 11px;border-radius:9px;border:none;background:var(--pri);color:#fff;font-weight:650;cursor:pointer;font-family:inherit;white-space:nowrap;}
.mini-add.ghost{background:#EEF2F8;color:var(--ink2);}
.body-group-title{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:1px;margin:14px 0 4px;padding-top:10px;border-top:1px dashed #ECEFF5;}
.body-group-title:first-child{margin-top:0;padding-top:0;border-top:none;}
/* --- 护肤 --- */
.profile-card{background:#fff;border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);}
.profile-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #EEF2F8;}
.profile-row:last-child{border-bottom:none;}
.profile-row .pr-lb{flex:none;width:56px;font-size:12.5px;color:var(--sub);font-weight:550;}
.profile-row .pr-opts{flex:1;display:flex;gap:6px;flex-wrap:wrap;}
.pr-opt{font-size:12.5px;padding:5px 11px;border-radius:9px;background:#EEF2F8;color:var(--ink2);font-weight:550;cursor:pointer;}
.pr-opt.active{background:var(--pink);color:#fff;}
.supp{display:flex;align-items:center;gap:13px;padding:13px 14px;background:#fff;border-radius:16px;margin-bottom:10px;transition:.2s;border:1px solid var(--line);}
.supp.taken{background:var(--pink-soft);}
.supp .e{width:40px;height:40px;border-radius:13px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
.supp.taken .e{background:#fff;}
.supp .body{flex:1;cursor:pointer;}
.supp .n{font-size:14px;font-weight:550;}
.supp.taken .n{color:var(--pink);text-decoration:line-through;}
.supp .s{font-size:12.5px;color:var(--sub);margin-top:3px;}
.supp .del{width:26px;height:26px;border-radius:50%;border:none;background:var(--hot-soft);color:var(--hot);font-size:14px;cursor:pointer;flex:none;}
.follow-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px;}
.follow-bar .btn{padding:6px 11px;font-size:12px;border-radius:9px;}
.follow-result{width:100%;}
.hero-card .follow-bar .btn.ghost{background:#fff;color:#1D4ED8;border-color:transparent;}
/* --- 悬浮按钮 --- */
.fab{position:absolute;right:8px;bottom:calc(104px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:18px;background:var(--pri);color:#fff;border:0;font-size:20px;cursor:pointer;box-shadow:0 12px 28px -12px rgba(37,99,235,.55);z-index:50;display:grid;place-items:center;transition:transform .15s,opacity .35s;opacity:.88;touch-action:none;user-select:none;}
.fab:active{transform:scale(.92);}
.fab.dragging{opacity:1 !important;transform:scale(1.1);}
.fab.dim{opacity:.28;}
/* --- 底部弹层 --- */
#sheet{position:absolute;inset:0;z-index:60;pointer-events:none;}
#sheet.open{pointer-events:auto;}
.sheet-mask{position:absolute;inset:0;background:rgba(20,22,30,.42);opacity:0;transition:opacity .28s;}
#sheet.open .sheet-mask{opacity:1;}
.sheet-body{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:88%;overflow-y:auto;}
.sheet-body::before{content:'';display:block;width:40px;height:4px;border-radius:99px;background:#E6EAF1;margin:0 auto 14px;}
#sheet.open .sheet-body{transform:translateY(0);}
.sheet-head{display:flex;gap:14px;align-items:center;margin-bottom:6px;}
.sheet-emoji{font-size:38px;}
.sheet-head h2{font-size:19px;margin:0 0 4px;letter-spacing:-.3px;}
/* --- Toast --- */
.toast{position:absolute;left:50%;bottom:160px;transform:translate(-50%,10px);background:rgba(25,27,34,.94);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
/* --- AI --- */
.ai-msg{padding:12px 14px;border-radius:16px;margin-bottom:10px;font-size:13.5px;line-height:1.75;}
.ai-msg.user{background:var(--pri);color:#fff;margin-left:32px;white-space:pre-wrap;border-radius:16px 16px 4px 16px;}
.ai-msg.bot{background:#EEF2F8;color:var(--ink);margin-right:32px;white-space:pre-wrap;border-radius:16px 16px 16px 4px;}
.ai-role-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.ai-role-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:650;cursor:pointer;color:var(--ink2);font-family:inherit;}
.ai-role-btn.on{background:var(--pri);color:#fff;border-color:var(--ink);}
.status-badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:750;flex-shrink:0;}
.status-badge.ok{background:var(--accent-soft);color:var(--accent);}
.status-badge.warn{background:#FFF6E5;color:#B45309;}
select,input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;background:#F7F9FC;font-family:inherit;color:var(--ink);}
.link-btn{background:none;border:0;color:var(--ink2);font-size:12px;font-weight:650;cursor:pointer;padding:4px 8px;font-family:inherit;}
#ttsPlayer{display:none;}
/* --- 居中计时 --- */
.center-timer{position:absolute;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(20,22,30,.5);}
.center-timer.show{display:flex;}
.center-timer .box{background:#fff;border-radius:28px;padding:32px 32px 24px;text-align:center;max-width:320px;}
.center-timer .big{font-size:64px;font-weight:750;color:var(--ink);letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;}
.center-timer .txt{margin-top:14px;font-size:16px;color:var(--ink);font-weight:650;}
.center-timer .sub{margin-top:8px;font-size:12.5px;color:var(--sub);line-height:1.7;}
.center-timer .actions{display:flex;gap:8px;margin-top:20px;}
.center-timer .actions button{flex:1;border:0;font-family:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;}
.center-timer .actions .btn-skip{background:#EEF2F8;color:var(--ink2);}
.center-timer .actions .btn-ok{background:var(--pri);color:#fff;}
/* --- 导入导出 --- */
.import-option{padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-md);cursor:pointer;margin-bottom:10px;background:#fff;transition:.15s;}
.import-option:active{transform:scale(.98);background:#F3F6FB;}
.import-option.primary{border-color:var(--pri);background:#F3F6FB;}
.import-option .io-title{font-size:14px;font-weight:750;margin-bottom:4px;}
.import-option .io-desc{font-size:12px;color:var(--sub);line-height:1.5;}
.import-option.primary .io-title{color:var(--ink);}
.backup-warn{background:#FDF0EE;border:1px solid #F6CFC8;color:#DC2626;border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer;}
.backup-warn:active{background:#FBE3DE;}
/* --- 产品库 --- */
.prod-lib-card{background:#fff;border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(25,27,34,.03);position:relative;}
.prod-lib-card.expired{opacity:.65;background:#F3F6FB;border-style:dashed;}
.prod-lib-card .plc-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.prod-lib-card .plc-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FDEFF4,#FBCFE8);display:grid;place-items:center;font-size:18px;flex-shrink:0;}
.prod-lib-card .plc-body{flex:1;min-width:0;}
.prod-lib-card .plc-name{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4;word-break:break-all;padding-right:24px;}
.prod-lib-card .plc-meta{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.55;}
.prod-lib-card .plc-badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:4px;margin-top:2px;}
.prod-lib-card .plc-badge.ok{background:var(--accent-soft);color:var(--accent);}
.prod-lib-card .plc-badge.warn{background:#FFF4E0;color:#D98A0B;}
.prod-lib-card .plc-badge.danger{background:var(--hot-soft);color:var(--hot);}
.prod-lib-card .plc-badge.info{background:var(--blue-soft);color:var(--blue);}
.prod-lib-card .plc-del{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:none;background:var(--hot-soft);color:var(--hot);font-size:12px;cursor:pointer;line-height:1;}
/* --- 护肤流程 --- */
.routine-step{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed #ECEFF5;}
.routine-step:last-child{border-bottom:none;}
.routine-step .rs-num{width:24px;height:24px;border-radius:50%;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;}
.routine-step .rs-body{flex:1;min-width:0;}
.routine-step .rs-title{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.4;}
.routine-step .rs-prod{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.55;}
.routine-step .rs-note{font-size:12.5px;color:var(--warn);margin-top:3px;line-height:1.55;background:#FFF7ED;padding:4px 8px;border-radius:6px;display:inline-block;}
.routine-step .rs-days{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue);flex-shrink:0;margin-top:1px;}
.routine-step .rs-days.warn{background:#FFF4E0;color:#D98A0B;}
.routine-step .rs-days.danger{background:var(--hot-soft);color:var(--hot);}
#fatal-error{display:none;padding:20px;color:#DC2626;background:#FDF0EE;font-size:14px;line-height:1.6;word-break:break-all;}
.timeline-divider{display:flex;align-items:center;gap:8px;margin:14px 4px 8px;font-size:12.5px;color:var(--sub);font-weight:600;cursor:pointer;}
.timeline-divider::before,.timeline-divider::after{content:'';flex:1;height:1px;background:#E6EAF1;}
.timeline-divider:active{opacity:0.7;}
/* --- 空状态 --- */
.empty-state{text-align:center;padding:36px 20px;background:#fff;border-radius:var(--r-lg);border:1px dashed #D9DFE9;margin-bottom:12px;}
.empty-state .es-icon{font-size:44px;line-height:1;margin-bottom:12px;opacity:0.85;}
.empty-state .es-title{font-size:15px;font-weight:750;color:var(--ink2);margin-bottom:6px;}
.empty-state .es-desc{font-size:12.5px;color:var(--sub);line-height:1.6;}
.sheet-form-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #ECEFF5;}
.sheet-form-row .lb{width:56px;font-size:13px;color:var(--ink2);font-weight:600;flex:none;}
.sheet-form-row input[type=text],.sheet-form-row input[type=date],.sheet-form-row input[type=time],.sheet-form-row textarea{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;font-weight:500;background:#F7F9FC;outline:none;}
.sheet-form-row textarea{min-height:60px;resize:vertical;}
.svg-icon{width:18px;height:18px;vertical-align:-3px;fill:currentColor;margin-right:4px;}


/* ================= V3 增补组件 ================= */
.top-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:#5b6276;cursor:pointer;flex-shrink:0;padding:0;box-shadow:0 1px 3px rgba(25,27,34,.05);}
.top-btn:active{transform:scale(.93);}

/* 今日复习卡 */
.rv-card{background:linear-gradient(135deg,#1D4ED8,#3B82F6);color:#fff;border-radius:20px;padding:17px 18px;margin-bottom:14px;box-shadow:0 14px 30px -18px rgba(37,99,235,.7);}
.rv-card.empty{background:#fff;color:#191B22;border:1px solid var(--line);box-shadow:0 2px 8px rgba(25,27,34,.04);}
.rv-top{display:flex;justify-content:space-between;align-items:flex-start;}
.rv-k{font-size:12px;letter-spacing:1.2px;font-weight:700;opacity:.82;}
.rv-card.empty .rv-k{color:var(--sub);opacity:1;}
.rv-v{font-size:23px;font-weight:850;margin-top:6px;letter-spacing:-.4px;}
.rv-ico{font-size:22px;opacity:.85;}
.rv-sub{font-size:12.5px;line-height:1.65;opacity:.85;margin-top:8px;}
.rv-card.empty .rv-sub{color:var(--sub);opacity:1;}
.rv-nums{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.rv-nums span{font-size:12px;font-weight:650;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;}
.rv-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.rv-btn{flex:1;min-width:118px;background:#fff;color:#1D4ED8;border:0;border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:750;font-family:inherit;cursor:pointer;}
.rv-btn:active{transform:scale(.98);}

/* 全局搜索 */
.srch-wrap{padding:2px 0 10px;}
.srch-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.srch-title{font-size:17px;font-weight:800;}
.srch-input{width:100%;border:1px solid var(--line);background:#f7f9fc;border-radius:14px;padding:13px 15px;font-size:15px;font-family:inherit;outline:none;}
.srch-input:focus{border-color:var(--pri);background:#fff;}
.srch-tip{font-size:13px;color:var(--sub);text-align:center;padding:26px 0;line-height:1.7;}
.srch-sec{font-size:12px;font-weight:750;color:var(--sub);letter-spacing:.6px;margin:16px 0 4px;}
.srch-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f1f3f9;cursor:pointer;}
.srch-row:last-child{border-bottom:0;}
.srch-row .t{font-size:14px;font-weight:700;line-height:1.45;}
.srch-row .d{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5;}
.srch-row .i{width:30px;height:30px;border-radius:9px;background:#f2f5fb;display:grid;place-items:center;font-size:14px;flex-shrink:0;}

/* 记账报表 */
.rep-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rep-kpi > div{background:#f7f9fc;border-radius:14px;padding:13px 14px;}
.rep-kpi .k{font-size:12px;color:var(--sub);font-weight:600;}
.rep-kpi .v{font-size:20px;font-weight:850;margin-top:5px;letter-spacing:-.3px;}
.rep-bar{height:8px;border-radius:99px;background:#eef1f7;overflow:hidden;margin-top:6px;}
.rep-bar > i{display:block;height:100%;border-radius:99px;background:var(--pri);}
.rep-line{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:2px;}
.rep-delta{font-size:12px;font-weight:750;padding:2px 8px;border-radius:99px;}

/* 运动趋势 */
.trend{display:flex;align-items:flex-end;gap:7px;height:104px;padding:6px 2px 0;}
.trend > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px;}
.trend b{display:block;width:100%;background:#dbe7fb;border-radius:6px 6px 3px 3px;min-height:3px;}
.trend b.hot{background:var(--pri);}
.trend .lb{font-size:10px;color:var(--sub);}

/* 速查表 */
.q-table{width:100%;border-collapse:collapse;font-size:13px;}
.q-table th,.q-table td{padding:9px 6px;border-bottom:1px solid #eef1f7;text-align:left;vertical-align:top;line-height:1.6;}
.q-table th{font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.4px;}

/* 成分卡 */
.ing-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#fff;}
.ing-h{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ing-n{font-size:15px;font-weight:800;}
.ing-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#EAF1FF;color:#2563EB;flex-shrink:0;}
.ing-row{font-size:12.5px;line-height:1.72;color:#4b5265;margin-top:7px;}

/* 护肤打卡 */
.sk-steps{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.sk-step{border:1px solid var(--line);background:#f7f9fc;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:650;color:#4b5265;cursor:pointer;font-family:inherit;}
.sk-step.on{background:#E7F9F5;border-color:#9BE3D3;color:#0F8A76;}

/* 设置行 */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f1f3f9;}
.set-row:last-child{border-bottom:0;}
.set-lab{font-size:14px;font-weight:650;}
.set-hint{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;}
.seg{display:flex;gap:4px;background:#f1f3f9;padding:3px;border-radius:11px;flex-shrink:0;}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:650;color:#5b6276;font-family:inherit;cursor:pointer;}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(25,27,34,.1);}

/* 今日一题 */
.quiz-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#f7f9fc;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:#2b3244;font-family:inherit;cursor:pointer;margin-bottom:8px;}
.quiz-opt:active{transform:scale(.99);}
.quiz-opt.right{background:#E7F9F5;border-color:#9BE3D3;color:#0F8A76;font-weight:700;}
.quiz-opt.wrong{background:#FFEDEA;border-color:#FBC3BB;color:#C0392B;font-weight:700;}

/* 离线缓存标记 */
.offline-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#92400E;background:#FEF3C7;padding:2px 7px;border-radius:6px;}

/* --- 养成：重新养一遍自己 --- */
.grow-hero{background:linear-gradient(135deg,#1D4ED8,#3B82F6);border-radius:20px;padding:18px 16px 16px;color:#fff;position:relative;overflow:hidden;}
.grow-hero .glow{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);}
.grow-top{display:flex;gap:14px;align-items:center;position:relative;}
.grow-ava{width:96px;height:96px;flex-shrink:0;background:rgba(255,255,255,.16);border-radius:24px;display:flex;align-items:center;justify-content:center;}
.grow-ava svg{width:84px;height:84px;}
.grow-ava .gift-ring{position:absolute;font-size:17px;}
.grow-name{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;}
.grow-name .edit{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.2);border:0;color:#fff;padding:3px 9px;border-radius:99px;font-family:inherit;}
.grow-lv{font-size:12px;opacity:.92;margin-top:3px;}
.grow-prog{margin-top:9px;background:rgba(255,255,255,.22);border-radius:99px;height:7px;overflow:hidden;}
.grow-prog > div{height:100%;background:#FFE28A;border-radius:99px;transition:width .4s;}
.grow-stars{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:99px;font-size:13px;font-weight:800;}
.grow-edit-form{margin-top:12px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:relative;}
.grow-edit-form label{font-size:11.5px;opacity:.9;}
.grow-edit-form input{border:0;border-radius:9px;padding:8px 10px;font-size:14px;font-family:inherit;color:#1e293b;}
.grow-stats{display:flex;flex-direction:column;gap:11px;}
.grow-stat{display:flex;align-items:center;gap:10px;}
.grow-stat .lab{font-size:13px;font-weight:700;width:72px;flex-shrink:0;color:var(--ink2);}
.grow-stat .bar{flex:1;height:9px;background:#E6EAF1;border-radius:99px;overflow:hidden;}
.grow-stat .bar > div{height:100%;border-radius:99px;transition:width .5s;}
.grow-stat .val{font-size:12px;font-weight:700;color:var(--sub);width:30px;text-align:right;}
.grow-task{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#F5F8FD;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;font-family:inherit;transition:background .15s;}
.grow-task.done{background:#EAF7F3;border-color:#BFE8DE;}
.grow-task .ring{width:21px;height:21px;border-radius:50%;border:2px solid #B9C2D0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
.grow-task.done .ring{background:var(--pri);border-color:var(--pri);}
.grow-task .tx{flex:1;min-width:0;}
.grow-task .t1{font-size:14px;font-weight:650;color:var(--ink);}
.grow-task.done .t1{text-decoration:line-through;color:var(--sub);}
.grow-task .t2{font-size:11.5px;color:var(--sub);margin-top:1px;}
.grow-task .star-plus{font-size:12px;font-weight:800;color:#E8A200;flex-shrink:0;}
.grow-quote{background:#FDF6E8;border:1px solid #F3E4C2;border-radius:16px;padding:14px 15px;}
.grow-quote .q{font-size:14.5px;font-weight:650;color:#8A6A1F;line-height:1.7;}
.grow-shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.grow-gift{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;font-family:inherit;position:relative;}
.grow-gift .gi{font-size:26px;height:52px;display:flex;align-items:center;}
.grow-gift .gi img{width:56px;height:52px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(90,100,130,.18));}
.grow-gift .gn{font-size:13.5px;font-weight:750;margin-top:5px;color:var(--ink);}
.grow-gift .gd{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.5;}
.grow-gift .gp{font-size:12px;font-weight:800;color:#E8A200;margin-top:6px;}
.grow-gift.owned{border-color:#BFE8DE;background:#F2FAF7;}
.grow-gift.owned .gp{color:#12A08A;}
.grow-gift:disabled{opacity:.55;cursor:default;}
.grow-bday{background:linear-gradient(135deg,#FFF3F6,#F3F0FF);border:1px solid #F0DCE8;border-radius:16px;padding:14px 15px;}
.grow-diary-item{display:flex;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink2);align-items:baseline;}
.grow-diary-item:last-child{border-bottom:0;}
.grow-diary-item .d{font-size:11.5px;color:var(--sub);flex-shrink:0;min-width:74px;}
.grow-story{background:#EEF4FF;border:1px solid #D7E4FB;border-radius:16px;padding:14px 15px;}
.grow-story .s-tx{font-size:13.5px;line-height:1.85;color:#33415C;white-space:pre-line;}

/* --- 养成房间 --- */
.grow-room-card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-card);}
.grow-room-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;}
.grow-room-head .nm{font-size:17px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;}
.grow-room-head .nm .ed{font-size:11.5px;font-weight:600;background:var(--pri-soft);color:var(--pri);border:0;padding:3px 9px;border-radius:99px;font-family:inherit;}
.grow-room-head .lv{font-size:11.5px;color:var(--sub);margin-top:4px;}
.grow-room-head .st{font-size:14px;font-weight:850;color:#C98A00;background:#FFF8E6;border-radius:99px;padding:6px 12px;white-space:nowrap;}
.grow-room{position:relative;line-height:0;background:#EFF4FB;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.grow-room::-webkit-scrollbar{display:none;}
.grow-room svg{width:148%;max-width:none;height:auto;display:block;}
.grow-room-foot{padding:10px 16px 14px;}
.grow-prog2{height:8px;background:#EDF1F7;border-radius:99px;overflow:hidden;}
.grow-prog2 > div{height:100%;background:linear-gradient(90deg,#2563EB,#60A5FA);border-radius:99px;transition:width .4s;}
.grow-tipbar{display:flex;gap:8px;align-items:flex-start;background:#F5F8FD;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:12px;}
.grow-shop-sec{font-size:12px;font-weight:750;color:var(--sub);letter-spacing:.4px;margin:16px 2px 8px;}
.grow-shop-sec:first-of-type{margin-top:6px;}
.grow-feedbar{display:flex;gap:10px;align-items:center;margin-top:12px;}
.grow-feedbar .btn-primary{flex:1;}
.grow-today{font-size:12px;font-weight:700;color:#12A08A;background:#EAF7F3;border-radius:99px;padding:7px 12px;white-space:nowrap;}
.ex-anim-wrap{margin:2px 0 4px;}
.ex-anim{width:100%;height:auto;display:block;border-radius:12px;background:linear-gradient(180deg,#F8FAFF,#EDF3FB);border:1px solid #E3EAF5;}
.ex-anim line{fill:none;}
.ex-anim .sk-n{stroke:#2563EB;}
.ex-anim .sk-f{stroke:#A9BEE6;}
.ex-anim .sk-t{stroke:#1D4ED8;}
.ex-anim .sk-h{fill:#1D4ED8;stroke:none;}
.ex-anim .prop{stroke:#C6D0E0;stroke-width:2;fill:none;stroke-linecap:round;}
.ex-anim .band{stroke:#F26D5F;stroke-width:2;fill:none;stroke-dasharray:4 3;}
.ex-anim .wt{fill:#3A4A66;stroke:none;}
.ex-anim .lab{fill:#8292AC;font-size:8px;font-family:system-ui,sans-serif;}
.ex-anim-cap{font-size:10.5px;color:var(--sub);text-align:center;margin-top:4px;}
</style>

<body>
<div class="phone">
  <header class="topbar">
   <div class="brand"><span class="dot"></span>日常</div>
   <div class="top-right">
  <button class="top-btn" id="topSearchBtn" data-act="openSearch" title="全局搜索" aria-label="搜索"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.6"/><path d="M16.2 16.2 21 21"/></svg></button>
  <span id="todayLabel"></span>
  <span id="topDate" style="font-weight:600;color:#3A4152;">--月--日 周--</span>
  <div class="top-weather"><span id="homeWeather">☀️ 晴</span> <span id="homeTemp">--℃</span></div>
</div>
  </header>
  <main id="view"><div id="fatal-error"></div></main>
  <button class="fab" id="fab">🤖</button>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="sheet"></div>
  <div class="center-timer" id="centerTimer"><div class="box"><div class="big" id="centerTimerNum">200</div><div class="txt">该站起来走动走动了</div><div class="sub">起身 → 走动 2–3 分钟<br>下巴轻收 5 次 → 肩胛向后下轻收 5–8 次</div><div class="actions"><button class="btn-skip" data-act="closeCenterTimer">关闭</button><button class="btn-ok" data-act="closeCenterTimer">知道了</button></div></div></div>
<audio id="ttsPlayer" preload="none"></audio>
</div>
<script>
const _errs = [];
window.onerror = function(msg, url, line, col){
  _errs.push({ msg, url, line, col, t: Date.now() });
  console.error('[onerror]', msg, line, col);
  var el = document.getElementById('fatal-error');
  if (el){
    el.style.display = 'block';
    el.textContent = '脚本错误: ' + msg + ' @' + line + ':' + col +
                     '（共 ' + _errs.length + ' 个，详见控制台）';
  }
  return false;
};
window.addEventListener('error', e => console.error('Error:', e.message));
window.addEventListener('unhandledrejection', e => console.error('Promise:', e.reason));

window.onWidgetCheckin = function(key, done) {
    try {
        if (key.startsWith('todo_')) {
            const payloadStr = key.substring(5);
            try {
                const payload = JSON.parse(decodeURIComponent(payloadStr));
                const item = (getManualTodos()[payload.date] || []).find(x => (x.time || '') === (payload.time || '') && x.title === payload.title);
                if (item) { 
                    const m = getTodoStatusMap(); 
                    const k = getTodoKey(payload.date, item); 
                    if (done) m[k] = true; else delete m[k]; 
                    saveTodoStatusMap(m); 
                }
            } catch(err) { console.error('parse todo error', err); }
        } else { 
            setCheck(key, done); 
        }
        render({ keepScroll: true }); 
        syncToNativeWidget();
    } catch (e) { console.error('onWidgetCheckin error:', e); }
};

window.mergeNativeWidgetCheckins = function(){
    try {
        if (!window.AndroidBridge || !AndroidBridge.getWidgetTimelineData) return;
        const raw = AndroidBridge.getWidgetTimelineData();
        const items = JSON.parse(raw || '[]');
        if (!Array.isArray(items)) return;
        const checks = getChecks();
        const todoMap = getTodoStatusMap();
        let changed = false;
        items.forEach(item => {

/* 把各种失败归类，给出"该怎么办"，而不是一句笼统的失败 */
function errKind(e){
  const msg = (e && e.message) ? e.message : String(e || '');
  if (/Failed to fetch|NetworkError|ERR_INTERNET|ERR_NAME|ERR_CONNECTION|原生桥不可用/i.test(msg)) return 'net';
  if (/aborted|timeout|请求超时|超时/i.test(msg)) return 'slow';
  if (/HTTP 429|请求过于频繁|QPS|code=130/i.test(msg)) return 'limit';
  if (/HTTP 5\d\d|502|503|504|code=5\d\d/i.test(msg)) return 'server';
  if (/HTTP 4\d\d|code=4\d\d|无权限|未申请/i.test(msg)) return 'api';
  if (/无内容|接口返回空|内容太短/i.test(msg)) return 'empty';
  return 'other';
}
const ERR_ICON = { net:'📴', slow:'🐢', limit:'🚦', server:'🛠', api:'🔑', empty:'🫙', other:'⚠️' };
const ERR_TIP = {
  net:'检查一下网络连接，或稍后重试',
  slow:'接口响应太慢，稍后再试一次',
  limit:'接口被限流了，等 1 分钟再试',
  server:'对方服务出问题了，不是你的网络',
  api:'接口地址或密钥需要更新',
  empty:'对方暂时没返回内容，换一批试试'
};
function friendlyErr(e){
  const k = errKind(e);
  const msg = (e && e.message) ? e.message : String(e || '');
  if (k === 'net') return '网络不通';
  if (k === 'slow') return '请求超时';
  if (k === 'limit') return '接口限流';
  if (k === 'server') return '服务异常';
  if (k === 'api') return /HTTP 403/.test(msg) ? '无权限' : '接口不可用';
  if (k === 'empty') return '暂无内容';
  return msg || '失败';
}
/* 失败卡片：图标 + 原因 + 建议 + 重试 */
function errPanel(e, msg, act){
  const k = errKind(e);
  const title = msg || friendlyErr(e);
  return `<div class="card" style="text-align:center;padding:32px 20px;">
    <div style="font-size:32px;margin-bottom:10px;">${ERR_ICON[k] || '⚠️'}</div>
    <div style="font-size:14.5px;font-weight:700;color:#2b3244;margin-bottom:6px;">${esc(title)}</div>
    <div style="font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:14px;">${esc(ERR_TIP[k] || '')}</div>
    ${act ? `<button class="btn ghost" data-act="${act}">🔄 重试</button>` : ''}
  </div>`;
}
// 原生 HTTP 桥：WebView 内 fetch 失败时由安卓原生代码发请求（不受 WebView 网络限制）
function nativeGetRaw(url, timeout){
  return new Promise((resolve, reject) => {
    if (!window.AndroidHttp || typeof window.AndroidHttp.httpGet !== 'function'){ reject(new Error('原生桥不可用')); return; }
    window.__nativeHttpCbs = window.__nativeHttpCbs || {};
    window.__nativeHttpSeq = (window.__nativeHttpSeq || 0) + 1;
    const id = 'h' + window.__nativeHttpSeq;
    const timer = setTimeout(() => { delete window.__nativeHttpCbs[id]; reject(new Error('原生请求超时')); }, (timeout || 8000) + 1500);
    window.__nativeHttpCbs[id] = res => { clearTimeout(timer); delete window.__nativeHttpCbs[id]; resolve(res); };
    try { window.AndroidHttp.httpGet(url, id); } catch(e){ clearTimeout(timer); delete window.__nativeHttpCbs[id]; reject(e); }

function calcShape(){ const s = body.shoulder, w = body.waist, h = body.hip; const whr = w / h, shr = s / h; if (whr <= 0.76) { if (Math.abs(shr - 1) < 0.06) return { name:'沙漏型', desc:'肩臀接近，腰线明显' }; if (shr > 1.06) return { name:'倒三角型', desc:'肩部较宽' }; return { name:'梨形', desc:'臀胯较宽' }; } if (shr >= 1.06) return { name:'倒三角型', desc:'肩部偏宽' }; if (h - s >= 6) return { name:'梨形', desc:'臀胯偏宽' }; return { name:'矩形', desc:'肩腰臀比例接近' }; }
/* 依据身材数据给穿衣建议，并把衣橱里已录入尺寸的单品排出合身榜 */
function garmentFitScore(c){
  const g = c.garment || {}; const t = getSizeType(c.cat); const rows = [];
  const add = (label, val, bv, soft, hard) => { if (!val || !bv) return; const e = val - bv; rows.push({ label, e, fit: fitEase(e, soft, hard) }); };
  if (t === 'cloth'){
    add('胸围', g.bust, body.bust, 2, 6); add('肩宽', body.shoulder && g.shoulder ? g.shoulder : 0, body.shoulder, 1.5, 3.5);
    add('下摆/腰围', g.waist, body.waist, 4, 10); add('袖长', g.sleeve, (body.armLength||0)*0.85, 3, 5);
  } else if (t === 'pants'){
    add('腰围', g.waist, body.waist, 2, 5); add('臀围', g.hip, body.hip, 2.5, 6);
    add('大腿围', g.thigh, body.thigh, 2, 6); add('裤长', g.length, body.inseam, 3, 5);
  } else if (t === 'shoes'){
    add('脚长', g.footLength, body.footLength, 0.4, 0.9); add('脚宽', g.footWidth, body.footWidth, 0.2, 0.6);
  }
  if (!rows.length) return null;
  let score = 100;
  rows.forEach(r => { score -= (r.fit.k === 'tight' || r.fit.k === 'loose') ? 14 : ((r.fit.k === 'slight-tight' || r.fit.k === 'slight-loose') ? 5 : 0); });
  return { rows, score: Math.max(0, score) };
}
function bodyFitReport(){
  const sh = calcShape();
  const whr = (body.waist / body.hip).toFixed(2);
  const legRatio = body.height ? Math.round(body.legLength / body.height * 100) : 0;
  const topTips = { '梨形':'上身选亮色、有肩部设计感的款式；下身深色直筒，避开紧包臀。', '倒三角型':'避开垫肩/泡泡袖，V 领和落肩更柔和；下装可放量平衡。', '沙漏型':'收腰、V 领、合身剪裁最能突出腰线。', '矩形':'用腰带、荷叶边、A 字下摆制造曲线。' }[sh.name] || '按肩腰臀比例选择合身版型。';
  const lowerTips = (body.hip - body.shoulder >= 6) ? '下装：高腰直筒/微喇，臀围留 2–6cm 松量最舒服。' : '下装：高腰 + 短上衣可拉长比例，裤长参考内腿长 ' + body.inseam + 'cm。';
  const scored = clothes.map(c => ({ c, f: garmentFitScore(c) })).filter(x => x.f);
  const best = scored.slice().sort((a,b) => b.f.score - a.f.score).slice(0, 3);
  const risky = scored.filter(x => x.f.rows.some(r => r.fit.k === 'tight')).slice(0, 2);
  const line = x => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px dashed #eceef4;"><span style="color:#3f4658;">${esc(x.c.name || (CATEGORIES[x.c.cat]||{}).label || '单品')}</span><span style="color:${x.f.score>=80?'#047857':'#B45309'};font-weight:700;">${x.f.score} 分</span></div>`;
  return `<div class="card" style="border:2px solid var(--purple);background:#FBFAFF;">
    <div style="font-size:13.5px;font-weight:800;color:var(--purple);margin-bottom:8px;">👗 体型与穿衣报告</div>
    <div style="font-size:13px;line-height:1.8;color:#3f4658;">
      <div><b>${esc(sh.name)}</b> · ${esc(sh.desc)} · 腰臀比 ${whr} · 腿长约占身高 ${legRatio}%</div>
      <div style="margin-top:6px;">上衣：${esc(topTips)}</div>
      <div>下装：${esc(lowerTips)}</div>
      <div style="margin-top:6px;color:var(--sub);font-size:12px;">参考尺寸：胸 ${body.bust} / 腰 ${body.waist} / 臀 ${body.hip} / 肩 ${body.shoulder} / 臂长 ${body.armLength} / 内腿长 ${body.inseam} cm</div>
    </div>
    ${best.length ? `<div style="margin-top:12px;font-size:12.5px;font-weight:750;color:var(--purple);">衣橱里最合身的 ${best.length} 件</div>${best.map(line).join('')}` : '<div style="margin-top:12px;font-size:12px;color:var(--sub);">去衣橱录入几件衣服的实际尺寸，这里会排出合身榜。</div>'}
    ${risky.length ? `<div style="margin-top:10px;font-size:12px;font-weight:750;color:#B45309;">⚠️ 可能偏紧，试穿留意</div>${risky.map(line).join('')}` : ''}
    <button class="btn ghost wide" style="margin-top:12px;" data-act="gotoCloset">去衣橱 →</button>
  </div>`;
}
function fitEase(ease, soft, hard){ if (ease < -hard) return { k:'tight', t:'偏紧', color:'#FF6B5B', bg:'#FFEDEA' }; if (ease < -soft) return { k:'slight-tight', t:'略紧', color:'#D98A0B', bg:'#FFF4E0' }; if (ease <= soft) return { k:'ok', t:'合身', color:'#1FBFA9', bg:'#E7F9F5' }; if (ease <= hard) return { k:'slight-loose', t:'略松', color:'#4A9EFF', bg:'#EAF3FF' }; return { k:'loose', t:'偏松', color:'#8B7CF6', bg:'#F1EEFF' }; }
function analyzeGarment(){ 
  const cat = state.closetCat || 'top'; 
  const sizeType = getSizeType(cat); 
  if (sizeType === 'free') return null; 
  const g = state.garmentDraft || {}; 
  const rows = [], suggestions = []; 
  const shape = calcShape(); 
  
  if (sizeType === 'cloth'){ 
    if (g.bust){ const e = g.bust - body.bust; rows.push({ key:'bust', label:'胸围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,6) }); } 
    if (g.shoulder){ const d = body.shoulder - g.shoulder; rows.push({ key:'shoulder', label:'肩宽差', value:d>0?`身体宽 ${d.toFixed(1)} cm`:`衣服宽 ${(-d).toFixed(1)} cm`, fit:fitEase(d,1.5,3.5) }); } 
    if (g.length){ const bodyLen = body.height * 0.37; const e = g.length - bodyLen; rows.push({ key:'length', label:'衣长 vs 身高', value:`衣长 ${g.length}cm · 参考 ${bodyLen.toFixed(0)}cm`, fit:fitEase(e,-5,10) }); } 
    if (g.sleeve){ const refSleeve = body.armLength * 0.85; const e = g.sleeve - refSleeve; rows.push({ key:'sleeve', label:'袖长', value:`袖长 ${g.sleeve}cm · 参考 ${refSleeve.toFixed(0)}cm`, fit:fitEase(e,-3,5) }); } 
    if (g.waist && cat === 'coat'){ const e = g.waist - body.waist; rows.push({ key:'waist', label:'腰围松量（收腰款）', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,4,10) }); } 
    if (shape.name === '梨形') suggestions.push('梨形：上半身穿亮色、有设计感的款式，下半身选深色简洁剪裁。'); 
    if (shape.name === '倒三角型') suggestions.push('倒三角：避免垫肩、泡泡袖，下半身可选阔腿裤/A字裙平衡。'); 
    if (shape.name === '沙漏型') suggestions.push('沙漏：适合收腰、V领、合身剪裁，突出腰线。'); 
    if (shape.name === '矩形') suggestions.push('矩形：可用腰带、荷叶边、A字裙制造曲线感。'); 
    if (rows.filter(r=>r.fit.k==='tight').length) suggestions.push('肩宽/胸围偏紧：建议选大一号，或换落肩/宽松版型。'); 
  } 
  if (sizeType === 'pants'){ 
    if (g.waist){ const e = g.waist - body.waist; rows.push({ key:'waist', label:'腰围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,5) }); } 
    if (g.hip){ const e = g.hip - body.hip; rows.push({ key:'hip', label:'臀围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2.5,6) }); } 
    if (g.length){ const ref = body.inseam; const e = g.length - ref; rows.push({ key:'length', label:'裤长 vs 内腿长', value:`裤长 ${g.length}cm · 内腿 ${ref}cm`, fit:fitEase(e,-3,5) }); } 
    if (g.thigh){ const e = g.thigh - body.thigh; rows.push({ key:'thigh', label:'大腿围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,6) }); } 
    if (shape.name === '梨形') suggestions.push('梨形：选高腰、直筒或微喇裤，避免过紧的臀部。'); 
    if (shape.name === '倒三角型') suggestions.push('倒三角：选阔腿裤、喇叭裤平衡比例。'); 
    if (shape.name === '矩形') suggestions.push('矩形：选高腰裤 + 短上衣制造比例。'); 
    if (rows.filter(r=>r.fit.k==='tight').length) suggestions.push('臀围偏紧：建议选大一码或弹力面料。'); 
  } 
  if (sizeType === 'shoes'){ 
    if (g.footLength){ const e = g.footLength - body.footLength; rows.push({ key:'footLength', label:'脚长松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,0.4,0.9) }); } 
    if (g.footWidth){ const e = g.footWidth - body.footWidth; rows.push({ key:'footWidth', label:'脚宽松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,0.2,0.6) }); } 
    suggestions.push('选鞋建议：下午/晚上试穿（脚会略微膨胀），脚趾前留 0.5-1cm 活动空间。'); 
  } 
  // 新增维度：领围 / 下摆 / 袖肥 / 膝围 / 裤脚，都用身体数据做对照
  if (sizeType === 'cloth'){
    if (g.neck && body.neck){ const e = g.neck - body.neck; rows.push({ key:'neck', label:'领围松量', value:`领围 ${g.neck}cm · 颈围 ${body.neck}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 1.5, 3.5) }); }
    if (g.hem && body.hip){ const e = g.hem - body.hip; rows.push({ key:'hem', label:'下摆 vs 臀围', value:`下摆 ${g.hem}cm · 臀围 ${body.hip}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 4, 10) }); }
    if (g.armhole && body.upperArm){ const e = g.armhole - body.upperArm; rows.push({ key:'armhole', label:'袖肥松量', value:`袖肥 ${g.armhole}cm · 上臂 ${body.upperArm}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 2, 5) }); }
  }
  if (sizeType === 'pants'){
    if (g.knee && body.calf){ const ref = Number((body.calf * 1.15).toFixed(1)); const e = g.knee - ref; rows.push({ key:'knee', label:'膝围松量', value:`膝围 ${g.knee}cm · 参考 ${ref}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 2, 5) }); }
    if (g.cuff && body.ankle){ const e = g.cuff - body.ankle; rows.push({ key:'cuff', label:'裤脚 vs 踝围', value:`裤脚 ${g.cuff}cm · 踝围 ${body.ankle}cm · ${e>0?'+':''}${e.toFixed(1)}cm`, fit:fitEase(e, 2, 6) }); }
  }
  const hardTight = rows.filter(r => r.fit.k === 'tight' || r.fit.k === 'loose').length; 
  const slightCount = rows.filter(r => r.fit.k === 'slight-tight' || r.fit.k === 'slight-loose').length; 
  const score = Math.max(0, 100 - hardTight * 8 - slightCount * 3); 
  return { rows, suggestions, score, sizeType }; 
}

function cnToNumber(str){ if (str == null) return NaN; const s = String(str).trim(); if (!s) return NaN; if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s); const map = { '零':0, '〇':0, '一':1, '二':2, '两':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9 }; if (s.length === 1){ if (map[s] !== undefined) return map[s]; if (/^\d$/.test(s)) return parseInt(s); return NaN; } if (s === '十') return 10; if (/^十[一二三四五六七八九]$/.test(s)) return 10 + map[s[1]]; if (/^[一二三四五六七八九]十$/.test(s)) return map[s[0]] * 10; if (/^[一二三四五六七八九]十[一二三四五六七八九]$/.test(s)) return map[s[0]] * 10 + map[s[2]]; let result = 0; for (const ch of s){ let d; if (map[ch] !== undefined) d = map[ch]; else if (/^\d$/.test(ch)) d = parseInt(ch); else return NaN; result = result * 10 + d; } return result; }
function round2(n){ return Math.round(n * 100) / 100; }
function parseChineseAmount(text){ if (text == null) return NaN; let s = String(text).replace(/快/g, '块').replace(/园/g, '元').replace(/圓/g, '元'); const numP = '(\\d+(?:\\.\\d+)?|[零〇一二两三四五六七八九十]+)'; let m = s.match(new RegExp(numP + '\\s*[块元]\\s*' + numP + '\\s*[毛角]\\s*' + numP + '\\s*分?')); if (m){ const y = cnToNumber(m[1]), j = cnToNumber(m[2]), f = cnToNumber(m[3]); if (!isNaN(y) && !isNaN(j) && !isNaN(f)) return round2(y + j/10 + f/100); } m = s.match(new RegExp(numP + '\\s*[毛角]\\s*' + numP + '\\s*分?')); if (m){ const j = cnToNumber(m[1]), f = cnToNumber(m[2]); if (!isNaN(j) && !isNaN(f)) return round2(j/10 + f/100); } m = s.match(new RegExp(numP + '\\s*[块元]\\s*' + numP + '\\s*[毛角]')); if (m){ const y = cnToNumber(m[1]), j = cnToNumber(m[2]); if (!isNaN(y) && !isNaN(j)) return round2(y + j/10); } m = s.match(new RegExp(numP + '\\s*[块元]\\s*' + numP)); if (m){ const y = cnToNumber(m[1]); const raw = String(m[2]); let sub; if (/^\d+(\.\d+)?$/.test(raw)){ sub = parseFloat(raw); if (/\./.test(raw)) return round2(y + sub); const digits = raw.replace(/\D/g, '').length; if (digits === 1) return round2(y + sub/10); if (digits === 2) return round2(y + sub/100); return round2(y + sub); } else { sub = cnToNumber(raw); if (!isNaN(sub)){ if (sub < 10) return round2(y + sub/10); if (sub < 100) return round2(y + sub/100); return round2(y + sub); } } } m = s.match(new RegExp(numP + '\\s*[块元]')); if (m){ const y = cnToNumber(m[1]); if (!isNaN(y)) return round2(y); } m = s.match(new RegExp(numP + '\\s*[毛角]')); if (m){ const j = cnToNumber(m[1]); if (!isNaN(j)) return round2(j/10); } m = s.match(/(\d+(?:\.\d+)?)/); if (m) return round2(parseFloat(m[1])); m = s.match(/([零〇一二两三四五六七八九十]+)/); if (m){ const v = cnToNumber(m[1]); if (!isNaN(v)) return round2(v); } return NaN; }
function parseTransactionText(text){ const t = String(text || '').trim(); const amount = parseChineseAmount(t); let incomeScore = 0, expenseScore = 0; INCOME_HINTS.forEach(re => { if (re.test(t)) incomeScore++; }); EXPENSE_HINTS.forEach(re => { if (re.test(t)) expenseScore++; }); let type = incomeScore > expenseScore ? 'income' : 'expense'; let category = type === 'income' ? '其他收入' : '其他'; const dict = type === 'income' ? INCOME_CATS : EXPENSE_CATS; for (const [cat, re] of dict) { if (re.test(t)) { category = cat; break; } } const customObj = LS.get('app_h_customCats', { expense: [], income: [] }); const customs = (customObj && Array.isArray(customObj[type])) ? customObj[type] : []; for (const c of customs){ if (c && t.includes(c)){ category = c; break; } } let account = '现金'; for (let i = 0; i < ACCOUNT_HINTS.length; i++){ if (ACCOUNT_HINTS[i].test(t)) { account = ACCOUNT_LIST[i]; break; } } return { type, amount: isNaN(amount) ? 0 : amount, category, account, note: t }; }
function getCatList(type){ const base = (type === 'income' ? INCOME_CATS : EXPENSE_CATS).map(x => x[0]); const customObj = LS.get('app_h_customCats', { expense: [], income: [] }); const custom = (customObj && Array.isArray(customObj[type])) ? customObj[type] : []; custom.forEach(c => { if (!base.includes(c)) base.push(c); }); base.push(type === 'income' ? '其他收入' : '其他'); return base; }
function csvEscape(v){ const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

function addPeriod(start, end){ const log = getPeriodLog(); log.push({ id: Date.now(), start: localDateStr(new Date(start)), end: end ? localDateStr(new Date(end)) : null }); log.sort(function(a,b){ return a.start < b.start ? -1 : 1; }); savePeriodLog(log); }

function computePeriodForecast(){

    const pls = log.filter(function(x){ return x.end; }).map(function(x){ return Math.round((new Date(x.end)-new Date(x.start))/86400000)+1; }).filter(function(x){ return x>0 && x<20; });

  let inRecorded = false;

function musclesFor(ex){
  const t = (ex.target || '') + ' ' + (ex.purpose || '') + ' ' + (ex.name || '');
  const has = re => re.test(t);
  const m = new Set();
  if (has(/颈|下巴/)) m.add('neck');
  if (has(/肩|三角肌|肩胛/)) m.add('shoulders');
  if (has(/胸/)) m.add('chest');
  if (has(/斜方/)) m.add('traps');
  if (has(/背阔|上背|中背|菱形|背部|背肌|划船|下拉/)) m.add('lats');
  if (has(/下背|竖脊|腰部|腰背/)) m.add('lowerback');
  if (has(/二头/)) m.add('biceps');
  if (has(/三头/)) m.add('triceps');
  if (has(/手臂|上肢|臂部/) && !has(/二头|三头/)){ m.add('biceps'); m.add('triceps'); }
  if (has(/前臂|握力|小臂/)) m.add('forearms');
  if (has(/核心|腹部|腹肌|肋骨|躯干|呼吸/)) m.add('abs');

function exAnimSVG(code){

  const seg = (a, b, cls, w) => { const j0 = ks[0];
    return `<line class="${cls}" stroke-width="${w}" stroke-linecap="round" x1="${j0[a][0].toFixed(1)}" y1="${j0[a][1].toFixed(1)}" x2="${j0[b][0].toFixed(1)}" y2="${j0[b][1].toFixed(1)}">${an('x1', V(a, 0))}${an('y1', V(a, 1))}${an('x2', V(b, 0))}${an('y2', V(b, 1))}</line>`; };

    const p2 = l.xy || j0[l.b];
    s += `<line class="${l.cls || 'band'}" x1="${j0[l.a][0].toFixed(1)}" y1="${j0[l.a][1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}">${an('x1', V(l.a, 0))}${an('y1', V(l.a, 1))}${l.xy ? '' : (an('x2', V(l.b, 0)) + an('y2', V(l.b, 1)))}</line>`;
  });

  s += seg('sh', 'elbow2', farCls, 3.4) + seg('elbow2', 'hand2', farCls, 3);
  s += seg('hip', 'neck', 'sk-t', 5.5);
  s += seg('hip', 'knee', 'sk-n', 4.5) + seg('knee', 'ankle', 'sk-n', 4) + seg('ankle', 'toe', 'sk-n', 3.2);
  s += seg('sh', 'elbow', 'sk-n', 4) + seg('elbow', 'hand', 'sk-n', 3.4);
  s += `<circle class="sk-h" cx="${j0.head[0].toFixed(1)}" cy="${j0.head[1].toFixed(1)}" r="${L.headR}">${an('cx', V('head', 0))}${an('cy', V('head', 1))}</circle>`;

    s += `<circle class="${m.cls || 'wt'}" cx="${j0[m.j][0].toFixed(1)}" cy="${j0[m.j][1].toFixed(1)}" r="${m.r || 5}">${an('cx', V(m.j, 0))}${an('cy', V(m.j, 1))}</circle>`;

let _cropState = null;
function cropParams(){
  const c = _cropState; if (!c) return null;
  const base = Math.min(c.iw, c.ih);
  const size = Math.max(24, base / c.z);
  return { sx: (c.iw - size) * c.px / 100, sy: (c.ih - size) * c.py / 100, size };
}
function drawCropPreview(){

  const p = cropParams(); const ctx = cv.getContext('2d');
  ctx.fillStyle = '#F1F3F9'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(_cropState.img, p.sx, p.sy, p.size, p.size, 0, 0, cv.width, cv.height);
}

function confirmClothCrop(){
  if (!_cropState) return;
  const cv = document.createElement('canvas'); cv.width = cv.height = 480;

function shrinkImage(dataUrl, maxSide, quality){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', quality || 0.72));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}
